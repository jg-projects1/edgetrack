<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="MBWorld"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<title>MBWorld</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,sans-serif;background:#343A40;min-height:100%;font-size:14px;color:#F0EDE8;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;min-height:100svh}

.topbar{background:#2C3136;border-bottom:0.5px solid rgba(255,255,255,0.09);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:17px;font-weight:500;letter-spacing:-.3px;color:#F0EDE8}
.logo span{color:#22C55E}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:#C8C5BF;background:#3D4349;padding:4px 10px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.08)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#22C55E;flex-shrink:0}
.sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}
.sync-dot.error{background:#F87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.profile-bar{background:#2C3136;border-bottom:0.5px solid rgba(255,255,255,0.08);padding:8px 16px;display:flex;align-items:center;gap:10px}
.profile-label{font-size:11px;color:#9A9590;flex-shrink:0}
.profile-toggle{display:flex;gap:4px}
.profile-btn{padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;color:#C8C5BF;border:0.5px solid rgba(255,255,255,0.10);background:transparent;transition:all .15s;white-space:nowrap}
.profile-btn.active-me{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.profile-btn.active-wife{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.profile-btn.active-bp{background:#5C3800;color:#F0A500;border-color:#854F0B}
.profile-btn.active-rq{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.profile-btn.active-both{background:#3D4349;color:#F0EDE8;border-color:rgba(255,255,255,0.10)}

.content{flex:1;padding:14px 16px;padding-bottom:calc(72px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;width:100%}

.tab-bar{background:#2C3136;border-top:0.5px solid rgba(255,255,255,0.09);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100}
.tab{flex:1;padding:5px 2px;cursor:pointer;font-size:9px;font-weight:500;color:#9A9590;border:none;background:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;transition:color .15s}
.tab i{font-size:20px;line-height:1}
.tab.active{color:#22C55E}
.tab-label{font-size:9px;font-weight:500;white-space:nowrap}

.card{background:#2C3136;border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;overflow:hidden;margin-bottom:12px}
.card-header{padding:12px 16px;border-bottom:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;font-weight:500;color:#9A9590;letter-spacing:.3px;text-transform:uppercase}
.card-body{padding:14px 16px}

.metric-card{background:#3D4349;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:3px}
.metric-label{font-size:11px;color:#C8C5BF;font-weight:500;display:flex;align-items:center;gap:4px}
.metric-label i{font-size:14px}
.metric-value{font-size:26px;font-weight:500;letter-spacing:-1px;color:#F0EDE8;line-height:1.1}
.metric-value.pos{color:#22C55E}.metric-value.neg{color:#F87171}.metric-value.warn{color:#BA7517}
.metric-sub{font-size:11px;color:#9A9590}

.acct-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.acct-card{background:#2C3136;border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;padding:14px}
.acct-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.acct-name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:#F0EDE8}
.acct-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-me{background:#F0A500}.dot-wife{background:#7F77DD}.dot-bp{background:#BA7517}.dot-rq{background:#639922}
.acct-pnl{font-size:12px;font-weight:500}
.acct-pnl.pos{color:#22C55E}.acct-pnl.neg{color:#F87171}
.acct-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:0.5px solid rgba(255,255,255,0.08)}
.acct-row-label{font-size:11px;color:#9A9590;display:flex;align-items:center;gap:4px}
.acct-row-label i{font-size:13px}
.acct-row-val{font-size:12px;font-weight:500;color:#F0EDE8}

.list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid rgba(255,255,255,0.05);transition:background .1s}
.list-row:last-child{border-bottom:none}
.list-row-left{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;margin-right:10px}
.list-row-title{font-size:13px;font-weight:500;color:#F0EDE8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.list-row-right{font-size:13px;font-weight:500;flex-shrink:0}
.list-row-right.pos{color:#22C55E}.list-row-right.neg{color:#F87171}.list-row-right.warn{color:#BA7517}

.pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;border:0.5px solid transparent}
.pill-me{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.pill-wife{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.pill-bp{background:#5C3800;color:#F0A500;border-color:#854F0B}
.pill-rq{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.pill-qualifier{background:#7A4F00;color:#F5C842}
.pill-freebet{background:#14532D;color:#86EFAC}
.pill-boost{background:#5C3800;color:#F0A500}
.pill-mug{background:#042C53;color:#F5C842}
.pill-extraplace{background:#3C3489;color:#AFA9EC}
.pill-2up{background:#085041;color:#5DCAA5}
.pill-mbal{background:#72243E;color:#ED93B1}
.pill-cashback{background:#14532D;color:#86EFAC}
.pill-cashout{background:#791F1F;color:#F09595}
.pill-arb{background:#5C3800;color:#F0A500}
.pill-deposit,.pill-withdrawal{background:#0D4F5C;color:#5DCAA5}
.pill-exchangedeposit,.pill-exchangewithdrawal{background:#0D4F5C;color:#5DCAA5}
.pill-balanceamendment{background:#3D4349;color:#C8C5BF}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500}
.badge-active{background:#14532D;color:#86EFAC}
.badge-restricted{background:#5C3800;color:#F0A500}
.badge-gubbed{background:#791F1F;color:#F09595}
.badge-closed{background:#3D4349;color:#9A9590}

/* ── FORM ── */
.form-section{margin-bottom:14px}
.form-label{font-size:10px;font-weight:500;color:#9A9590;letter-spacing:.3px;text-transform:uppercase;display:block;margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-row.single{grid-template-columns:1fr}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.span2{grid-column:1/-1}
input[type=text],input[type=number],select,textarea{width:100%;background:#3D4349;border:0.5px solid rgba(255,255,255,0.10);border-radius:8px;padding:9px 11px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:#F0EDE8;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:rgba(255,255,255,0.25);background:#575A65}
input#f-pnl{border-color:#22C55E;font-size:15px;font-weight:500;background:#2A3D35}
input#f-pnl:focus{background:#2E4A3A}
input#f-date{font-size:12px;padding:7px 10px}
textarea{resize:vertical;min-height:60px}
select option{background:#3D4349;color:#F0EDE8}

/* ── TYPE GROUPS ── */
.type-groups{display:flex;flex-direction:column;gap:8px}
.type-group-label{font-size:10px;font-weight:500;color:#9A9590;letter-spacing:.3px;text-transform:uppercase;margin-bottom:5px}
.type-pills{display:flex;flex-wrap:wrap;gap:5px}
.type-pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF;transition:all .15s}
.type-pill.sel{border-width:1px}
.sel-qualifier{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.sel-freebet{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.sel-boost{background:#5C3800;color:#F0A500;border-color:#854F0B}
.sel-mug{background:#042C53;color:#F5C842;border-color:#7A4F00}
.sel-extraplace{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.sel-2up{background:#085041;color:#5DCAA5;border-color:#0F6E56}
.sel-mbal{background:#72243E;color:#ED93B1;border-color:#993556}
.sel-cashback{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.sel-cashout{background:#791F1F;color:#F09595;border-color:#A32D2D}
.sel-arb{background:#5C3800;color:#F0A500;border-color:#854F0B}
.sel-deposit,.sel-withdrawal{background:#0D4F5C;color:#5DCAA5;border-color:#0F8FA5}
.sel-exchangedeposit,.sel-exchangewithdrawal{background:#0D4F5C;color:#5DCAA5;border-color:#0F8FA5}
.sel-balanceamendment{background:#575A65;color:#B4B2A9;border-color:#9A9590}

.acct-selector{display:flex;gap:5px;flex-wrap:wrap}
.acct-sel-btn{flex:1;min-width:60px;padding:7px 5px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF;font-family:system-ui,-apple-system,sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.acct-sel-btn.active-me{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.acct-sel-btn.active-wife{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.acct-sel-btn.active-bp{background:#5C3800;color:#F0A500;border-color:#854F0B}
.acct-sel-btn.active-rq{background:#14532D;color:#86EFAC;border-color:#3B6D11}

.btn{padding:11px 20px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:0.5px solid rgba(255,255,255,0.09);background:#3D4349;color:#F0EDE8;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(0.98)}
.btn-primary{background:#22C55E;color:#fff;border-color:#22C55E}
.btn-primary:hover{background:#0F6E56;border-color:#0F6E56}
.btn-full{width:100%;padding:13px}
.btn-danger{background:#791F1F;color:#F09595;border-color:#A32D2D}
.btn-ghost{background:#3D4349;color:#C8C5BF;border-color:rgba(255,255,255,0.09)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px;font-family:system-ui,-apple-system,sans-serif;font-weight:500;cursor:pointer;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF;transition:all .15s}
.btn-sm-edit{background:#5C3800;color:#F0A500;border-color:#854F0B}
.btn-sm-dupe{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.btn-sm-danger{background:#791F1F;color:#F09595;border-color:#A32D2D}
.btn-won{background:#14532D;color:#86EFAC;border:0.5px solid #3B6D11;padding:9px 16px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;flex:1}
.btn-lost{background:#791F1F;color:#F09595;border:0.5px solid #A32D2D;padding:9px 16px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;flex:1}

.table-wrap{overflow:auto;border-radius:12px;border:0.5px solid rgba(255,255,255,0.09);margin-bottom:12px;background:#2C3136;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;min-width:460px}
.data-table th{padding:8px 12px;text-align:left;font-size:10px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;color:#9A9590;border-bottom:0.5px solid rgba(255,255,255,0.08);background:#3D4349;white-space:nowrap;position:sticky;top:0}
.data-table td{padding:9px 12px;font-size:12px;border-bottom:0.5px solid rgba(255,255,255,0.04);vertical-align:middle;color:#F0EDE8}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#4A4D58}
.pos{color:#22C55E;font-weight:500}.neg{color:#F87171;font-weight:500}.muted{color:#9A9590}

.pending-card{background:#2C3136;border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;padding:14px;margin-bottom:10px}
.pending-event{font-size:14px;font-weight:500;color:#F0EDE8;margin-bottom:6px}
.pending-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pending-info{background:#3D4349;border-radius:8px;padding:10px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pinfo-item{display:flex;flex-direction:column;gap:2px}
.pinfo-label{font-size:10px;color:#9A9590;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.pinfo-val{font-size:13px;font-weight:500;color:#F0EDE8}
.pinfo-val.pos{color:#22C55E}.pinfo-val.neg{color:#F87171}

.month-wrap{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding:6px 2px 2px}
.month-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;min-width:44px}
.month-bar{width:36px;border-radius:3px 3px 0 0;min-height:3px}
.month-bar.pos{background:#22C55E}.month-bar.neg{background:#F87171;border-radius:0 0 3px 3px}
.month-lbl{font-size:9px;color:#9A9590;font-weight:500}
.month-val{font-size:9px;font-weight:500}
.month-val.pos{color:#22C55E}.month-val.neg{color:#F87171}

.flow-preview{background:#085041;border:0.5px solid#0F6E56;border-radius:8px;padding:9px 12px;font-size:12px;color:#5DCAA5;display:flex;align-items:center;gap:8px;margin-bottom:10px}

.dest-selector{display:flex;gap:5px;flex-wrap:wrap}
.dest-btn{flex:1;min-width:55px;padding:6px 5px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF;font-family:system-ui,-apple-system,sans-serif;font-size:11px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.dest-btn.active{background:#085041;color:#5DCAA5;border-color:#0F6E56}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:#2C3136;border-radius:16px 16px 0 0;border:0.5px solid rgba(255,255,255,0.10);padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));width:100%;max-width:500px}
@media(min-width:600px){.modal{border-radius:14px;padding:24px}}
.modal-handle{width:32px;height:3px;background:rgba(255,255,255,0.09);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:500;margin-bottom:4px;color:#F0EDE8}
.modal-sub{font-size:12px;color:#9A9590;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;margin-top:16px}

.toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-16px);background:#22C55E;border-radius:12px;padding:14px 24px;font-size:15px;font-weight:600;color:#fff;z-index:999;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,0.4);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:12px;color:#9A9590;font-size:13px}
.spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,0.09);border-top-color:#22C55E;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:30px 20px;text-align:center;color:#9A9590;font-size:13px}
.search-input{width:100%;background:#3D4349;border:none;border-bottom:0.5px solid rgba(255,255,255,0.08);padding:10px 16px;font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:#F0EDE8;outline:none}
.search-input::placeholder{color:#9A9590}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-select{background:#2C3136;border:0.5px solid rgba(255,255,255,0.10);border-radius:8px;padding:7px 10px;font-family:system-ui,-apple-system,sans-serif;font-size:12px;color:#F0EDE8;outline:none;-webkit-appearance:none}
</style>
</head>
<body>
<div id="pin-screen" style="display:none"></div>
<div id="app-content" style="display:none">
<div class="app">
  <div class="topbar">
    <div class="logo">MB<span>World</span></div>
    <div class="sync-badge"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">Loading</span></div>
  </div>
  <div class="profile-bar" id="profile-bar" style="display:none">
    <span class="profile-label">Viewing</span>
    <div class="profile-toggle">
      <button class="profile-btn active-me" id="pbtn-me" onclick="switchProfile('me')">JG</button>
      <button class="profile-btn" id="pbtn-wife" onclick="switchProfile('wife')">HG</button>
      <button class="profile-btn" id="pbtn-bp" onclick="switchProfile('bp')">BP</button>
      <button class="profile-btn" id="pbtn-rq" onclick="switchProfile('rq')">RQ</button>
      <button class="profile-btn" id="pbtn-both" onclick="switchProfile('both')">All</button>
    </div>
  </div>
  <div class="content" id="main-content">
    <div class="loading"><div class="spinner"></div>Loading…</div>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="tab-dashboard" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard" aria-hidden="true"></i><span class="tab-label">Dashboard</span></button>
    <button class="tab" id="tab-pending" onclick="switchTab('pending')"><i class="ti ti-clock" aria-hidden="true"></i><span class="tab-label">Settle <span id="pending-badge" style="display:none;background:#BA7517;color:#fff;border-radius:10px;padding:0 5px;font-size:9px;font-weight:500">0</span></span></button>
    <button class="tab" id="tab-add" onclick="switchTab('add')"><i class="ti ti-plus" aria-hidden="true"></i><span class="tab-label">Log trade</span></button>
    <button class="tab" id="tab-history" onclick="switchTab('history')"><i class="ti ti-list" aria-hidden="true"></i><span class="tab-label">History</span></button>
    <button class="tab" id="tab-accounts" onclick="switchTab('accounts')"><i class="ti ti-building-bank" aria-hidden="true"></i><span class="tab-label">Accounts</span></button>
    <button class="tab" id="tab-reports" onclick="switchTab('reports')"><i class="ti ti-chart-bar" aria-hidden="true"></i><span class="tab-label">Reports</span></button>
    <button class="tab" id="tab-risk" onclick="switchTab('risk')"><i class="ti ti-shield" aria-hidden="true"></i><span class="tab-label">Risk</span></button>
    <button class="tab" id="tab-casino" onclick="switchTab('casino')"><i class="ti ti-cards" aria-hidden="true"></i><span class="tab-label">Casino</span></button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
const SUPABASE_URL_UNUSED='';
let syncTimeout=null;

function setSyncStatus(s){
  const dot=document.getElementById('sync-dot'),label=document.getElementById('sync-label');
  if(!dot||!label)return;
  dot.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  label.textContent=s==='syncing'?'Saving':s==='error'?'Offline':'Saved';
}

async function loadData(){
  try{
    // Try sessionStorage first — most recent confirmed state from this session
    const cached=localStorage.getItem('mbe_state');
