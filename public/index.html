<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="MBWorld"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<title>MBWorld</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,sans-serif;background:#343A40;min-height:100%;font-size:14px;color:#F0EDE8;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;min-height:100svh}

.topbar{background:#2C3136;border-bottom:0.5px solid rgba(255,255,255,0.09);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:17px;font-weight:500;letter-spacing:-.3px;color:#F0EDE8}
.logo span{color:#22C55E}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:#C8C5BF;background:#3D4349;padding:4px 10px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.08)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#22C55E;flex-shrink:0}
.sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}
.sync-dot.error{background:#F87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.profile-bar{background:#2C3136;border-bottom:0.5px solid rgba(255,255,255,0.08);padding:8px 16px;display:flex;align-items:center;gap:10px}
.profile-label{font-size:11px;color:#9A9590;flex-shrink:0}
.profile-toggle{display:flex;gap:4px}
.profile-btn{padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;color:#C8C5BF;border:0.5px solid rgba(255,255,255,0.10);background:transparent;transition:all .15s;white-space:nowrap}
.profile-btn.active-me{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.profile-btn.active-wife{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.profile-btn.active-bp{background:#5C3800;color:#F0A500;border-color:#854F0B}
.profile-btn.active-rq{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.profile-btn.active-both{background:#3D4349;color:#F0EDE8;border-color:rgba(255,255,255,0.10)}

.content{flex:1;padding:14px 16px;padding-bottom:calc(72px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;width:100%}

.tab-bar{background:#2C3136;border-top:0.5px solid rgba(255,255,255,0.09);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100}
.tab{flex:1;padding:5px 2px;cursor:pointer;font-size:9px;font-weight:500;color:#9A9590;border:none;background:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;transition:color .15s}
.tab i{font-size:20px;line-height:1}
.tab.active{color:#22C55E}
.tab-label{font-size:9px;font-weight:500;white-space:nowrap}

.card{background:#2C3136;border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;overflow:hidden;margin-bottom:12px}
.card-header{padding:12px 16px;border-bottom:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;font-weight:500;color:#9A9590;letter-spacing:.3px;text-transform:uppercase}
.card-body{padding:14px 16px}

.metric-card{background:#3D4349;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:3px}
.metric-label{font-size:11px;color:#C8C5BF;font-weight:500;display:flex;align-items:center;gap:4px}
.metric-label i{font-size:14px}
.metric-value{font-size:26px;font-weight:500;letter-spacing:-1px;color:#F0EDE8;line-height:1.1}
.metric-value.pos{color:#22C55E}.metric-value.neg{color:#F87171}.metric-value.warn{color:#BA7517}
.metric-sub{font-size:11px;color:#9A9590}

.acct-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.acct-card{background:#2C3136;border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;padding:14px}
.acct-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.acct-name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:#F0EDE8}
.acct-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-me{background:#F0A500}.dot-wife{background:#7F77DD}.dot-bp{background:#BA7517}.dot-rq{background:#639922}
.acct-pnl{font-size:12px;font-weight:500}
.acct-pnl.pos{color:#22C55E}.acct-pnl.neg{color:#F87171}
.acct-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:0.5px solid rgba(255,255,255,0.08)}
.acct-row-label{font-size:11px;color:#9A9590;display:flex;align-items:center;gap:4px}
.acct-row-label i{font-size:13px}
.acct-row-val{font-size:12px;font-weight:500;color:#F0EDE8}

.list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid rgba(255,255,255,0.05);transition:background .1s}
.list-row:last-child{border-bottom:none}
.list-row-left{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;margin-right:10px}
.list-row-title{font-size:13px;font-weight:500;color:#F0EDE8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.list-row-right{font-size:13px;font-weight:500;flex-shrink:0}
.list-row-right.pos{color:#22C55E}.list-row-right.neg{color:#F87171}.list-row-right.warn{color:#BA7517}

.pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;border:0.5px solid transparent}
.pill-me{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.pill-wife{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.pill-bp{background:#5C3800;color:#F0A500;border-color:#854F0B}
.pill-rq{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.pill-qualifier{background:#7A4F00;color:#F5C842}
.pill-freebet{background:#14532D;color:#86EFAC}
.pill-boost{background:#5C3800;color:#F0A500}
.pill-mug{background:#042C53;color:#F5C842}
.pill-extraplace{background:#3C3489;color:#AFA9EC}
.pill-2up{background:#085041;color:#5DCAA5}
.pill-mbal{background:#72243E;color:#ED93B1}
.pill-cashback{background:#14532D;color:#86EFAC}
.pill-cashout{background:#791F1F;color:#F09595}
.pill-arb{background:#5C3800;color:#F0A500}
.pill-deposit,.pill-withdrawal{background:#0D4F5C;color:#5DCAA5}
.pill-exchangedeposit,.pill-exchangewithdrawal{background:#0D4F5C;color:#5DCAA5}
.pill-balanceamendment{background:#3D4349;color:#C8C5BF}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500}
.badge-active{background:#14532D;color:#86EFAC}
.badge-restricted{background:#5C3800;color:#F0A500}
.badge-gubbed{background:#791F1F;color:#F09595}
.badge-closed{background:#3D4349;color:#9A9590}

/* ── FORM ── */
.form-section{margin-bottom:14px}
.form-label{font-size:10px;font-weight:500;color:#9A9590;letter-spacing:.3px;text-transform:uppercase;display:block;margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-row.single{grid-template-columns:1fr}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.span2{grid-column:1/-1}
input[type=text],input[type=number],select,textarea{width:100%;background:#3D4349;border:0.5px solid rgba(255,255,255,0.10);border-radius:8px;padding:9px 11px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:#F0EDE8;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:rgba(255,255,255,0.25);background:#575A65}
input#f-pnl{border-color:#22C55E;font-size:15px;font-weight:500;background:#2A3D35}
input#f-pnl:focus{background:#2E4A3A}
input#f-date{font-size:12px;padding:7px 10px}
textarea{resize:vertical;min-height:60px}
select option{background:#3D4349;color:#F0EDE8}

/* ── TYPE GROUPS ── */
.type-groups{display:flex;flex-direction:column;gap:8px}
.type-group-label{font-size:10px;font-weight:500;color:#9A9590;letter-spacing:.3px;text-transform:uppercase;margin-bottom:5px}
.type-pills{display:flex;flex-wrap:wrap;gap:5px}
.type-pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF;transition:all .15s}
.type-pill.sel{border-width:1px}
.sel-qualifier{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.sel-freebet{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.sel-boost{background:#5C3800;color:#F0A500;border-color:#854F0B}
.sel-mug{background:#042C53;color:#F5C842;border-color:#7A4F00}
.sel-extraplace{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.sel-2up{background:#085041;color:#5DCAA5;border-color:#0F6E56}
.sel-mbal{background:#72243E;color:#ED93B1;border-color:#993556}
.sel-cashback{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.sel-cashout{background:#791F1F;color:#F09595;border-color:#A32D2D}
.sel-arb{background:#5C3800;color:#F0A500;border-color:#854F0B}
.sel-deposit,.sel-withdrawal{background:#0D4F5C;color:#5DCAA5;border-color:#0F8FA5}
.sel-exchangedeposit,.sel-exchangewithdrawal{background:#0D4F5C;color:#5DCAA5;border-color:#0F8FA5}
.sel-balanceamendment{background:#575A65;color:#B4B2A9;border-color:#9A9590}

.acct-selector{display:flex;gap:5px;flex-wrap:wrap}
.acct-sel-btn{flex:1;min-width:60px;padding:7px 5px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF;font-family:system-ui,-apple-system,sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.acct-sel-btn.active-me{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.acct-sel-btn.active-wife{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.acct-sel-btn.active-bp{background:#5C3800;color:#F0A500;border-color:#854F0B}
.acct-sel-btn.active-rq{background:#14532D;color:#86EFAC;border-color:#3B6D11}

.btn{padding:11px 20px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:0.5px solid rgba(255,255,255,0.09);background:#3D4349;color:#F0EDE8;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(0.98)}
.btn-primary{background:#22C55E;color:#fff;border-color:#22C55E}
.btn-primary:hover{background:#0F6E56;border-color:#0F6E56}
.btn-full{width:100%;padding:13px}
.btn-danger{background:#791F1F;color:#F09595;border-color:#A32D2D}
.btn-ghost{background:#3D4349;color:#C8C5BF;border-color:rgba(255,255,255,0.09)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px;font-family:system-ui,-apple-system,sans-serif;font-weight:500;cursor:pointer;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF;transition:all .15s}
.btn-sm-edit{background:#5C3800;color:#F0A500;border-color:#854F0B}
.btn-sm-dupe{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.btn-sm-danger{background:#791F1F;color:#F09595;border-color:#A32D2D}
.btn-won{background:#14532D;color:#86EFAC;border:0.5px solid #3B6D11;padding:9px 16px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;flex:1}
.btn-lost{background:#791F1F;color:#F09595;border:0.5px solid #A32D2D;padding:9px 16px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;flex:1}

.table-wrap{overflow:auto;border-radius:12px;border:0.5px solid rgba(255,255,255,0.09);margin-bottom:12px;background:#2C3136;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;min-width:460px}
.data-table th{padding:8px 12px;text-align:left;font-size:10px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;color:#9A9590;border-bottom:0.5px solid rgba(255,255,255,0.08);background:#3D4349;white-space:nowrap;position:sticky;top:0}
.data-table td{padding:9px 12px;font-size:12px;border-bottom:0.5px solid rgba(255,255,255,0.04);vertical-align:middle;color:#F0EDE8}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#4A4D58}
.pos{color:#22C55E;font-weight:500}.neg{color:#F87171;font-weight:500}.muted{color:#9A9590}

.pending-card{background:#2C3136;border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;padding:14px;margin-bottom:10px}
.pending-event{font-size:14px;font-weight:500;color:#F0EDE8;margin-bottom:6px}
.pending-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pending-info{background:#3D4349;border-radius:8px;padding:10px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pinfo-item{display:flex;flex-direction:column;gap:2px}
.pinfo-label{font-size:10px;color:#9A9590;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.pinfo-val{font-size:13px;font-weight:500;color:#F0EDE8}
.pinfo-val.pos{color:#22C55E}.pinfo-val.neg{color:#F87171}

.month-wrap{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding:6px 2px 2px}
.month-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;min-width:44px}
.month-bar{width:36px;border-radius:3px 3px 0 0;min-height:3px}
.month-bar.pos{background:#22C55E}.month-bar.neg{background:#F87171;border-radius:0 0 3px 3px}
.month-lbl{font-size:9px;color:#9A9590;font-weight:500}
.month-val{font-size:9px;font-weight:500}
.month-val.pos{color:#22C55E}.month-val.neg{color:#F87171}

.flow-preview{background:#085041;border:0.5px solid#0F6E56;border-radius:8px;padding:9px 12px;font-size:12px;color:#5DCAA5;display:flex;align-items:center;gap:8px;margin-bottom:10px}

.dest-selector{display:flex;gap:5px;flex-wrap:wrap}
.dest-btn{flex:1;min-width:55px;padding:6px 5px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF;font-family:system-ui,-apple-system,sans-serif;font-size:11px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.dest-btn.active{background:#085041;color:#5DCAA5;border-color:#0F6E56}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:#2C3136;border-radius:16px 16px 0 0;border:0.5px solid rgba(255,255,255,0.10);padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));width:100%;max-width:500px}
@media(min-width:600px){.modal{border-radius:14px;padding:24px}}
.modal-handle{width:32px;height:3px;background:rgba(255,255,255,0.09);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:500;margin-bottom:4px;color:#F0EDE8}
.modal-sub{font-size:12px;color:#9A9590;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;margin-top:16px}

.toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-16px);background:#22C55E;border-radius:12px;padding:14px 24px;font-size:15px;font-weight:600;color:#fff;z-index:999;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,0.4);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:12px;color:#9A9590;font-size:13px}
.spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,0.09);border-top-color:#22C55E;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:30px 20px;text-align:center;color:#9A9590;font-size:13px}
.search-input{width:100%;background:#3D4349;border:none;border-bottom:0.5px solid rgba(255,255,255,0.08);padding:10px 16px;font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:#F0EDE8;outline:none}
.search-input::placeholder{color:#9A9590}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-select{background:#2C3136;border:0.5px solid rgba(255,255,255,0.10);border-radius:8px;padding:7px 10px;font-family:system-ui,-apple-system,sans-serif;font-size:12px;color:#F0EDE8;outline:none;-webkit-appearance:none}
</style>
</head>
<body>
<div id="pin-screen" style="display:none"></div>
<div id="app-content" style="display:none">
<div class="app">
  <div class="topbar">
    <div class="logo">MB<span>World</span></div>
    <div class="sync-badge"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">Loading</span></div>
  </div>
  <div class="profile-bar" id="profile-bar" style="display:none">
    <span class="profile-label">Viewing</span>
    <div class="profile-toggle">
      <button class="profile-btn active-me" id="pbtn-me" onclick="switchProfile('me')">JG</button>
      <button class="profile-btn" id="pbtn-wife" onclick="switchProfile('wife')">HG</button>
      <button class="profile-btn" id="pbtn-bp" onclick="switchProfile('bp')">BP</button>
      <button class="profile-btn" id="pbtn-rq" onclick="switchProfile('rq')">RQ</button>
      <button class="profile-btn" id="pbtn-both" onclick="switchProfile('both')">All</button>
    </div>
  </div>
  <div class="content" id="main-content">
    <div class="loading"><div class="spinner"></div>Loading…</div>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="tab-dashboard" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard" aria-hidden="true"></i><span class="tab-label">Dashboard</span></button>
    <button class="tab" id="tab-pending" onclick="switchTab('pending')"><i class="ti ti-clock" aria-hidden="true"></i><span class="tab-label">Settle <span id="pending-badge" style="display:none;background:#BA7517;color:#fff;border-radius:10px;padding:0 5px;font-size:9px;font-weight:500">0</span></span></button>
    <button class="tab" id="tab-trade" onclick="switchTab('trade')"><i class="ti ti-repeat" aria-hidden="true"></i><span class="tab-label">Trade</span></button>
    <button class="tab" id="tab-accounts" onclick="switchTab('accounts')"><i class="ti ti-wallet" aria-hidden="true"></i><span class="tab-label">Accounts</span></button>
    <button class="tab" id="tab-casino" onclick="switchTab('casino')"><i class="ti ti-cards" aria-hidden="true"></i><span class="tab-label">Casino</span></button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
const SUPABASE_URL_UNUSED='';
let syncTimeout=null;

function setSyncStatus(s){
  const dot=document.getElementById('sync-dot'),label=document.getElementById('sync-label');
  if(!dot||!label)return;
  dot.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  label.textContent=s==='syncing'?'Saving':s==='error'?'Offline':'Saved';
}

async function loadData(){
  try{
    // Try sessionStorage first — most recent confirmed state from this session
    const cached=localStorage.getItem('mbe_state');
    if(cached){
      const parsed=JSON.parse(cached);
      PROFILES.forEach(pr=>{
        if(parsed[pr]){
          state[pr]=JSON.parse(JSON.stringify(parsed[pr]));
          if(!state[pr].casino)state[pr].casino=[];
          if(!state[pr].freeBets)state[pr].freeBets=[];
        }
      });
      if(parsed.exchanges)state.exchanges=JSON.parse(JSON.stringify(parsed.exchanges));
      lastServerState=JSON.parse(JSON.stringify(parsed));
      setSyncStatus('synced');
      // Still fetch from server in background to pick up changes from other devices
      fetchFromServer();
      return;
    }
    // No cache — load from server directly
    await fetchFromServer();
  }catch(e){
    console.error('Load error:',e);
    setSyncStatus('error');
  }
}

async function fetchFromServer(){
  try{
    const [sportsRes, casinoRes] = await Promise.all([
      fetch('/api/load?t='+Date.now()),
      fetch('/api/load-casino?t='+Date.now())
    ]);
    if(!sportsRes.ok)throw new Error('HTTP '+sportsRes.status);
    const sportsJson=await sportsRes.json();
    if(sportsJson.ok&&sportsJson.data){
      const saved=sportsJson.data;
      const hasData=PROFILES.some(p=>saved[p]&&((saved[p].transactions||[]).length>0||saved[p].bank!==0));
      if(hasData){
        // Only update if server has more data than current state
        const serverCount=PROFILES.reduce((a,p)=>a+(saved[p]?.transactions||[]).length,0);
        const localCount=PROFILES.reduce((a,p)=>a+(state[p]?.transactions||[]).length,0);
        // Always merge — never let server overwrite local-only transactions
        PROFILES.forEach(pr=>{
          if(!saved[pr])return;
          const serverTxs=saved[pr].transactions||[];
          const localTxs=state[pr].transactions||[];
          const serverMap=new Map(serverTxs.map(t=>[String(t.id),t]));
          const localMap=new Map(localTxs.map(t=>[String(t.id),t]));
          // Union: all IDs from both
          const allIds=new Set([...serverMap.keys(),...localMap.keys()]);
          const merged=[];
          allIds.forEach(id=>{
            const server=serverMap.get(id);
            const local=localMap.get(id);
            if(local&&server){
              // Prefer local settled over server pending
              if(local.result!=='Pending'&&server.result==='Pending')merged.push(local);
              else merged.push(server);
            } else if(local){
              merged.push(local); // local-only — keep it (new log not yet on server)
            } else {
              merged.push(server); // server-only
            }
          });
          // Sort by date desc
          merged.sort((a,b)=>{const da=parseDate(a.date),db=parseDate(b.date);return db!==da?db-da:b.id-a.id;});
          // Only use server bank if local is 0 (fresh load) — preserve local amendments
          if((state[pr].bank||0)===0)state[pr].bank=saved[pr].bank;
          // Merge bookies — keep local balance if it differs from server
          // (local is more recent, server may be stale replica)
          const serverBk=saved[pr].bookies||{};
          const localBk=state[pr].bookies||{};
          // Server wins for balances — local only wins if it has a non-zero balance and server has zero
          const mergedBk={...serverBk};
          Object.keys(localBk).forEach(k=>{
            if(!mergedBk[k]&&(localBk[k].bal||0)!==0)mergedBk[k]=localBk[k];
            else if(mergedBk[k]&&(localBk[k].bal||0)!==0&&(mergedBk[k].bal||0)===0){
              // Local has a balance but server doesn't — local wins
              mergedBk[k]={...mergedBk[k],bal:localBk[k].bal};
            }
            // In all other cases server wins — don't let local 0 overwrite server balance
          });
          // Just use merged bookies as-is — migrateLegacy will clean up
          state[pr].bookies=mergedBk;
          state[pr].transactions=merged;
          state[pr].freeBets=saved[pr].freeBets||state[pr].freeBets||[];
          if(!state[pr].casino)state[pr].casino=[];
        });
        if(saved.exchanges)state.exchanges=JSON.parse(JSON.stringify(saved.exchanges));
        lastServerState=JSON.parse(JSON.stringify(saved));
      }
    }
    if(casinoRes&&casinoRes.ok){
      const casinoJson=await casinoRes.json();
      if(casinoJson.ok&&casinoJson.data){
        PROFILES.forEach(pr=>{
          if(casinoJson.data[pr]?.casino){
            if(!state[pr])state[pr]={transactions:[],casino:[],bank:0,bookies:{}};
            state[pr].casino=JSON.parse(JSON.stringify(casinoJson.data[pr].casino));
          }
        });
      }
    }
    setSyncStatus('synced');
    migrateLegacy();
    render();
  }catch(e){
    console.error('Server fetch error:',e);
  }
}

async function saveData(source='unknown'){
  if(window._appLoading){console.log('Save blocked during load');return;}
  // If a save is already in progress, queue this one and return
  if(saveInProgress){
    pendingSave=source;
    return;
  }
  saveInProgress=true;
  setSyncStatus('syncing');
  window._lastSaveSource=source;
  try{
    // Build sports-only state (no casino sessions)
    const sportsState={exchanges:state.exchanges,_source:source,_serverState:lastServerState};
    PROFILES.forEach(pr=>{
      sportsState[pr]={
        bank:state[pr]?.bank||0,
        bookies:state[pr]?.bookies||{},
        transactions:state[pr]?.transactions||[],
        freeBets:state[pr]?.freeBets||[],
        deletedIds:deletedTxIds[pr]||[]
      };
    });
    // Build casino-only state
    const casinoState={};
    PROFILES.forEach(pr=>{
      casinoState[pr]={casino:state[pr]?.casino||[],deletedIds:casinoDeletedIds[pr]||[]};
    });
    // Save both in parallel
    const [sportsRes,casinoRes]=await Promise.all([
      fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sportsState)}),
      fetch('/api/save-casino',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(casinoState)})
    ]);
    if(!sportsRes.ok)throw new Error('Sports save failed');
    if(!casinoRes.ok)throw new Error('Casino save failed');
    // Update state from server's merged response — avoids stale load on next refresh
    const sportsJson=await sportsRes.json();
    if(sportsJson.ok&&sportsJson.data){
      PROFILES.forEach(pr=>{
        if(sportsJson.data[pr]){
          state[pr].bank=sportsJson.data[pr].bank;
          // Use server bookies as-is — migrateLegacy will clean up
          state[pr].bookies=sportsJson.data[pr].bookies||{};
          // Merge transactions — union of server + local, prefer settled over pending
          const serverTxs=sportsJson.data[pr].transactions||[];
          const localTxs=state[pr].transactions||[];
          const serverMap=new Map(serverTxs.map(t=>[String(t.id),t]));
          const localMap=new Map(localTxs.map(t=>[String(t.id),t]));
          const allIds=new Set([...serverMap.keys(),...localMap.keys()]);
          const mergedTxs=[];
          allIds.forEach(id=>{
            const srv=serverMap.get(id);
            const loc=localMap.get(id);
            if(loc&&srv){
              if(loc.result!=='Pending'&&srv.result==='Pending')mergedTxs.push(loc);
              else mergedTxs.push(srv);
            } else { mergedTxs.push(loc||srv); }
          });
          mergedTxs.sort((a,b)=>{const da=parseDate(a.date),db=parseDate(b.date);return db!==da?db-da:b.id-a.id;});
          state[pr].transactions=mergedTxs;
          // Preserve casino data — not included in sports response
          if(!state[pr].casino)state[pr].casino=[];
          if(!state[pr].freeBets)state[pr].freeBets=[];
        }
      });
      if(sportsJson.data.exchanges)state.exchanges=sportsJson.data.exchanges;
      // Track confirmed server state so next save can skip stale KV read
      lastServerState=JSON.parse(JSON.stringify(sportsJson.data));
      // Cache in sessionStorage so pull-to-refresh gets fresh data
      try{localStorage.setItem('mbe_state',JSON.stringify(sportsJson.data));}catch(e){}
    }
    PROFILES.forEach(pr=>{casinoDeletedIds[pr]=[];deletedTxIds[pr]=[];});
    setSyncStatus('synced');
  }catch(e){
    console.error('Save error:',e);
    setSyncStatus('error');
    showToast('⚠ Save failed: '+e.message);
  }finally{
    saveInProgress=false;
    if(pendingSave){const nextSource=pendingSave;pendingSave=null;saveData(nextSource);}
  }
}
function debouncedSave(source='unknown'){if(syncTimeout)clearTimeout(syncTimeout);setSyncStatus('syncing');syncTimeout=setTimeout(()=>saveData(source),1500);}
function save(source='unknown'){debouncedSave(source);}

function makeProfile(){const b={};DEFAULT_BOOKIES.forEach(x=>b[x]={bal:0,status:'Not Signed Up',notes:''});return{bookies:b,bank:0,transactions:[],freeBets:[]};}
function freshState(){const ex={};EXCHANGES.forEach(x=>ex[x]=0);const st={exchanges:ex};PROFILES.forEach(pr=>st[pr]=makeProfile());return st;}

function migrateLegacy(){
  PROFILES.forEach(pr=>{
    if(!state[pr])state[pr]=makeProfile();
    if(!state[pr].transactions)state[pr].transactions=[];if(!state[pr].freeBets)state[pr].freeBets=[];
    const bk=state[pr].bookies||{};
    // Case-insensitive dedup — for each DEFAULT_BOOKIES entry, find any case variant and merge
    DEFAULT_BOOKIES.forEach(canonical=>{
      Object.keys(bk).forEach(existing=>{
        if(existing!==canonical&&existing.toLowerCase()===canonical.toLowerCase()){
          // Found a case variant — merge into canonical
          if(!bk[canonical])bk[canonical]={bal:0,status:'Not Signed Up',notes:''};
          bk[canonical].bal=(bk[canonical].bal||0)+(bk[existing].bal||0);
          if(bk[existing].status&&bk[existing].status!=='Not Signed Up')bk[canonical].status=bk[existing].status;
          if(bk[existing].notes)bk[canonical].notes=bk[existing].notes;
          delete bk[existing];
        }
      });
    });
    // Explicit renames for non-case-variant changes
    const renames={
      'Hot Streak Casino':'Hot Streak',
      'hot streak casino':'Hot Streak',
      'Gala':'Gala Casino',
    };
    Object.entries(renames).forEach(([oldName,newName])=>{
      if(bk[oldName]){
        if(!bk[newName])bk[newName]={bal:0,status:'Not Signed Up',notes:''};
        bk[newName].bal=(bk[newName].bal||0)+(bk[oldName].bal||0);
        if(bk[oldName].status&&bk[oldName].status!=='Not Signed Up')bk[newName].status=bk[oldName].status;
        if(bk[oldName].notes)bk[newName].notes=bk[oldName].notes;
        delete bk[oldName];
      }
    });
    // Add any new bookies with Not Signed Up default
    DEFAULT_BOOKIES.forEach(b=>{if(!bk[b])bk[b]={bal:0,status:'Not Signed Up',notes:''};});
    Object.keys(bk).forEach(k=>{
      if(typeof bk[k]==='number')bk[k]={bal:bk[k],status:'Not Signed Up',notes:''};
      if(!bk[k].status)bk[k].status='Not Signed Up';
      if(bk[k].notes===undefined)bk[k].notes='';
    });
    // Re-sort bookies alphabetically — preserve ALL existing balances
    const sorted={};
    DEFAULT_BOOKIES.forEach(b=>{
      if(bk[b]){sorted[b]=bk[b];} // keep existing entry with balance intact
      else{sorted[b]={bal:0,status:'Not Signed Up',notes:''};} // only new bookies get 0
    });
    // Also keep any bookies with non-zero balance not in DEFAULT_BOOKIES
    Object.keys(bk).forEach(b=>{if(!sorted[b]&&(bk[b].bal||0)!==0)sorted[b]=bk[b];});
    state[pr].bookies=sorted;
  });
  if(!state.exchanges){state.exchanges={};EXCHANGES.forEach(e=>state.exchanges[e]=0);}
  EXCHANGES.forEach(e=>{if(state.exchanges[e]===undefined)state.exchanges[e]=0;});
  PROFILES.forEach(pr=>{if(!state[pr].casino)state[pr].casino=[];});
  // Bookie migration save disabled — was overwriting correct balances
}

function renderPerformanceCard(){

  const won=txs.filter(t=>t.result==='Won').length;
  const total=txs.length;
  const winRate=Math.round(won/total*100);
  const totalPnlVal=txs.reduce((a,t)=>a+(t.pnl||0),0);
  const avgPnl=totalPnlVal/total;
  // This month
  const now=new Date();
  const thisMonth=txs.filter(t=>{const p=t.date?.split('/');return p&&p.length===3&&+p[1]===now.getMonth()+1&&+p[2]===now.getFullYear();});
  const monthPnl=thisMonth.reduce((a,t)=>a+(t.pnl||0),0);
  // Best bookie
  const bookiePnl={};txs.forEach(t=>{if(!t.bookie)return;bookiePnl[t.bookie]=(bookiePnl[t.bookie]||0)+(t.pnl||0);});
  const bestBookie=Object.entries(bookiePnl).sort((a,b)=>b[1]-a[1])[0];
  return '<div class="card" style="margin-bottom:12px">'
    +'<div class="card-header"><span class="card-title">Performance</span></div>'

    +'<div style="background:#343A40;padding:12px"><div style="font-size:10px;color:#9A9590;margin-bottom:3px">Avg P&L / bet</div><div style="font-size:18px;font-weight:500;color:'+(avgPnl>=0?'#22C55E':'#F87171')+'">'+fmtS(avgPnl)+'</div><div style="font-size:10px;color:#9A9590">all settled bets</div></div>'
    +'<div style="background:#343A40;padding:12px"><div style="font-size:10px;color:#9A9590;margin-bottom:3px">This month</div><div style="font-size:18px;font-weight:500;color:'+(monthPnl>=0?'#22C55E':'#F87171')+'">'+fmtS(monthPnl)+'</div><div style="font-size:10px;color:#9A9590">'+thisMonth.length+' bets</div></div>'

function applyBalanceOnSettle(tx,p,result){
  // Underlay lost: P&L = £0, no lay profit to exchange, bookie stays deducted
  if(tx.underlay&&result==='Lost'){tx.pnl=0;return;}
  const isFB=isFreeBet(tx.type);
  const bstake=tx.bstake||0,bodds=tx.bodds||0,pnl=tx.pnl||0,exchange=tx.exchange;
  if(result==='Won'){
    if(isFB){
      // Free bet SNR: winnings only = (odds - 1) × stake. Stake not returned.
      if(tx.bookie&&p.bookies[tx.bookie])
        p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+((bodds-1)*bstake);
    }else{
      // Normal bet won: full return = odds × stake (stake was deducted at log time)
      if(tx.bookie&&p.bookies[tx.bookie])
        p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+(bodds*bstake);
    }
  }else if(result==='Lost'){
    // Lost: lay profit goes to exchange. Bookie already reduced at log time for normal bets.
    if(exchange&&state.exchanges[exchange]!==undefined)
      state.exchanges[exchange]=(state.exchanges[exchange]||0)+pnl;
  }
}

function applyBalanceAtLog(tx,p){
  if(tx.result==='Pending'){
    // Only deduct stake for normal bets — free bets don't use your money
    if(!isFreeBet(tx.type)&&tx.bookie&&p.bookies[tx.bookie])
      p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(tx.bstake||0);
  }else{
    // Logged as already settled — for normal bets deduct stake first, then apply result
    if(!isFreeBet(tx.type)&&tx.result==='Lost'&&tx.bookie&&p.bookies[tx.bookie])
      p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(tx.bstake||0);
    applyBalanceOnSettle(tx,p,tx.result);
  }
}

function settleBet(acct,id,result){
  const p=state[acct];const tx=(p.transactions||[]).find(t=>t.id===id);if(!tx||tx.result!=='Pending')return;
  tx.result=result;applyBalanceOnSettle(tx,p,result);
  // Immediately update localStorage so refresh doesn't revert
  try{const snap={exchanges:state.exchanges};PROFILES.forEach(pr=>{snap[pr]={bank:state[pr].bank,bookies:state[pr].bookies,transactions:state[pr].transactions,freeBets:state[pr].freeBets||[]};});localStorage.setItem('mbe_state',JSON.stringify(snap));}catch(e){}
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('settle');
  const card=document.getElementById('pcard-'+id);
  if(card){card.style.transition='opacity .25s,transform .25s';card.style.opacity='0';card.style.transform='translateY(-6px)';setTimeout(()=>{card.remove();updateBadge();},260);}
  showToast(`${result==='Won'?'Won':'Lost'} — ${fmtS(tx.pnl||0)}`,result==='Won'?'success':'error');
  setTimeout(render,300);
}

function confirmPnlEdit(acct,id){
  const newPnl=parseFloat(document.getElementById('modal-pnl')?.value);if(isNaN(newPnl))return;
  const p=state[acct];const tx=p.transactions.find(t=>t.id===id);if(!tx)return;
  const diff=newPnl-(tx.pnl||0);tx.pnl=newPnl;
  // P&L edit only affects exchange (lay profit) not bookie balance
  // Bookie balance is set from odds×stake on settlement, not from P&L
  if(tx.result==='Lost'&&tx.exchange&&state.exchanges[tx.exchange]!==undefined)
    state.exchanges[tx.exchange]=(state.exchanges[tx.exchange]||0)+diff;
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('editPnl');closeModal();showToast(`P&L updated to ${fmtS(newPnl)}`);render();
}

function renderMonthBars(map,height=90){

      return`<div class="month-col" style="min-width:40px"><div class="month-val ${col}" style="font-size:10px;font-weight:600">${fmtS(v)}</div><div class="month-bar ${col}" style="height:${pct}px;width:34px"></div><div class="month-lbl" style="font-size:10px;margin-top:2px">${lbl}</div></div>`;

function renderPerformanceCard(){
  const txs=allTxs().filter(t=>t.type!=='Balance Amendment'&&t.result!=='Pending'&&t.result!=='—');
  if(!txs.length)return'';
  const won=txs.filter(t=>t.result==='Won').length;
  const total=txs.length;
  const winRate=Math.round(won/total*100);
  const totalPnlVal=txs.reduce((a,t)=>a+(t.pnl||0),0);
  const avgPnl=totalPnlVal/total;
  // This month
  const now=new Date();
  const thisMonth=txs.filter(t=>{const p=t.date?.split('/');return p&&p.length===3&&+p[1]===now.getMonth()+1&&+p[2]===now.getFullYear();});

    +'<div style="background:#343A40;padding:12px"><div style="font-size:10px;color:#9A9590;margin-bottom:3px">Avg P&L / bet</div><div style="font-size:18px;font-weight:500;color:'+(avgPnl>=0?'#22C55E':'#F87171')+'">'+fmtS(avgPnl)+'</div><div style="font-size:10px;color:#9A9590">all settled bets</div></div>'

function applyBalanceOnSettle(tx,p,result){
  // Underlay lost: P&L = £0, no lay profit to exchange, bookie stays deducted
  if(tx.underlay&&result==='Lost'){tx.pnl=0;return;}
  const isFB=isFreeBet(tx.type);
  const bstake=tx.bstake||0,bodds=tx.bodds||0,pnl=tx.pnl||0,exchange=tx.exchange;
  if(result==='Won'){
    if(isFB){
      // Free bet SNR: winnings only = (odds - 1) × stake. Stake not returned.
      if(tx.bookie&&p.bookies[tx.bookie])
        p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+((bodds-1)*bstake);
    }else{
      // Normal bet won: full return = odds × stake (stake was deducted at log time)
      if(tx.bookie&&p.bookies[tx.bookie])
        p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+(bodds*bstake);
    }
  }else if(result==='Lost'){
    // Lost: lay profit goes to exchange. Bookie already reduced at log time for normal bets.
    if(exchange&&state.exchanges[exchange]!==undefined)
      state.exchanges[exchange]=(state.exchanges[exchange]||0)+pnl;
  }
}

function applyBalanceAtLog(tx,p){
  if(tx.result==='Pending'){
    // Only deduct stake for normal bets — free bets don't use your money
    if(!isFreeBet(tx.type)&&tx.bookie&&p.bookies[tx.bookie])
      p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(tx.bstake||0);
  }else{
    // Logged as already settled — for normal bets deduct stake first, then apply result
    if(!isFreeBet(tx.type)&&tx.result==='Lost'&&tx.bookie&&p.bookies[tx.bookie])
      p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(tx.bstake||0);
    applyBalanceOnSettle(tx,p,tx.result);
  }
}

function settleBet(acct,id,result){
  const p=state[acct];const tx=(p.transactions||[]).find(t=>t.id===id);if(!tx||tx.result!=='Pending')return;
  tx.result=result;applyBalanceOnSettle(tx,p,result);
  // Immediately update localStorage so refresh doesn't revert
  try{const snap={exchanges:state.exchanges};PROFILES.forEach(pr=>{snap[pr]={bank:state[pr].bank,bookies:state[pr].bookies,transactions:state[pr].transactions,freeBets:state[pr].freeBets||[]};});localStorage.setItem('mbe_state',JSON.stringify(snap));}catch(e){}
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('settle');
  const card=document.getElementById('pcard-'+id);
  if(card){card.style.transition='opacity .25s,transform .25s';card.style.opacity='0';card.style.transform='translateY(-6px)';setTimeout(()=>{card.remove();updateBadge();},260);}
  showToast(`${result==='Won'?'Won':'Lost'} — ${fmtS(tx.pnl||0)}`,result==='Won'?'success':'error');
  setTimeout(render,300);
}

function confirmPnlEdit(acct,id){
  const newPnl=parseFloat(document.getElementById('modal-pnl')?.value);if(isNaN(newPnl))return;
  const p=state[acct];const tx=p.transactions.find(t=>t.id===id);if(!tx)return;
  const diff=newPnl-(tx.pnl||0);tx.pnl=newPnl;
  // P&L edit only affects exchange (lay profit) not bookie balance
  // Bookie balance is set from odds×stake on settlement, not from P&L
  if(tx.result==='Lost'&&tx.exchange&&state.exchanges[tx.exchange]!==undefined)
    state.exchanges[tx.exchange]=(state.exchanges[tx.exchange]||0)+diff;
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('editPnl');closeModal();showToast(`P&L updated to ${fmtS(newPnl)}`);render();
}

function submitTx(){
  const msg=document.getElementById('form-msg');
  if(!selectedBetType){msg.textContent='Please select a transaction type.';return;}
  const isBookieT=BOOKIE_TRANSFER.includes(selectedBetType),isExchT=EXCHANGE_TRANSFER.includes(selectedBetType),isBet=BET_ONLY.includes(selectedBetType),isAmend=selectedBetType==='Balance Amendment';
  const date=document.getElementById('f-date').value||todayStr(),notes=document.getElementById('f-notes')?.value||'';
  if(isAmend){
    const target=document.getElementById('f-amend-target')?.value,newValStr=document.getElementById('f-amend-new')?.value,reason=document.getElementById('f-amend-reason')?.value||'Balance Amendment';
    if(!target){msg.textContent='Select what to amend.';return;}
    if(!newValStr){msg.textContent='Enter a new balance.';return;}
    const newVal=parseFloat(newValStr);if(isNaN(newVal))return;
    const p=state[formAccount];let oldVal,targetLabel;
    if(target==='bank'){oldVal=p.bank;p.bank=newVal;targetLabel='Bank';}
    else{const name=target.slice(7);oldVal=(p.bookies||{})[name]?.bal||0;p.bookies[name].bal=newVal;targetLabel=name;}
    const diff=newVal-oldVal;if(!p.transactions)p.transactions=[];
    p.transactions.push({id:Date.now(),date,type:'Balance Amendment',target:targetLabel,oldVal,newVal,diff,pnl:diff,notes:reason,result:'—',_acct:formAccount});
    if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('balanceAmend');showToast(`${targetLabel} → ${fmt(newVal)}`);msg.textContent='';resetForm();setTimeout(render,100);return;
  }
  const bookie=document.getElementById('f-bookie')?.value||(document.getElementById('f-bookie-search')?.value||''),exchange=document.getElementById('f-exchange')?.value,event=document.getElementById('f-event')?.value||'';
  const bstake=parseFloat(document.getElementById('f-bstake')?.value)||0,bodds=parseFloat(document.getElementById('f-bodds')?.value)||0,comm=parseFloat(document.getElementById('f-comm')?.value)||0;
  const result=document.getElementById('f-result')?.value||'Pending',pnl=parseFloat(document.getElementById('f-pnl')?.value)||0,amount=parseFloat(document.getElementById('f-amount')?.value)||0;
  if(isBookieT){
    if(!bookie){msg.textContent='Select a bookmaker.';return;}
    if(!amount){msg.textContent='Enter an amount.';return;}
    const p=state[formAccount];
    if(!p.bookies[bookie])p.bookies[bookie]={bal:0,status:'Active',notes:''};
    if(selectedBetType==='Deposit'){p.bookies[bookie].bal=(p.bookies[bookie].bal||0)+amount;p.bank-=amount;}
    else{p.bookies[bookie].bal=(p.bookies[bookie].bal||0)-amount;p.bank+=amount;}
    if(!p.transactions)p.transactions=[];
    p.transactions.push({id:Date.now(),date,type:selectedBetType,bookie,amount,pnl:0,notes,result:'—',_acct:formAccount});
  }else if(isExchT){
    if(!exchange){msg.textContent='Select an exchange.';return;}
    if(!amount){msg.textContent='Enter an amount.';return;}
    const ba=state[exchTransferBank];
    if(selectedBetType==='Exchange Deposit'){state.exchanges[exchange]=(state.exchanges[exchange]||0)+amount;ba.bank-=amount;}
    else{state.exchanges[exchange]=(state.exchanges[exchange]||0)-amount;ba.bank+=amount;}
    if(!ba.transactions)ba.transactions=[];
    ba.transactions.push({id:Date.now(),date,type:selectedBetType,exchange,amount,pnl:0,notes,result:'—',_acct:exchTransferBank});
  }else if(isBet){
    if(!bookie){msg.textContent='Select a bookmaker.';return;}
    if(!bstake||!bodds){msg.textContent='Enter back stake and odds.';return;}
    const p=state[formAccount];
    if(!p.bookies[bookie])p.bookies[bookie]={bal:0,status:'Active',notes:''};
    if(!p.transactions)p.transactions=[];
    const tx={id:Date.now(),date,type:selectedBetType,bookie,exchange,event,bstake,bodds,comm,result,pnl,notes,underlay:isUnderlay,_acct:formAccount};
    p.transactions.push(tx);applyBalanceAtLog(tx,p);
    if(selectedBetType==='Qualifier'){
      if(!p.freeBets)p.freeBets=[];
      p.freeBets.push({id:Date.now()+Math.random(),date,bookie,acct:formAccount,status:'Pending'});
      showToast('Free bet added for '+bookie+' — check Dashboard','success');
    }
  }
  // Track recent bookies and last exchange
  const usedBookie=document.getElementById('f-bookie')?.value||(document.getElementById('f-bookie-search')?.value||'');
  const usedExchange=document.getElementById('f-exchange')?.value||'';
  if(usedBookie){recentBookies=([usedBookie,...recentBookies.filter(b=>b!==usedBookie)]).slice(0,8);}
  if(usedExchange)lastExchange=usedExchange;
  // Store last saved tx for quick duplicate
  const lastTx={type:selectedBetType,bookie:document.getElementById('f-bookie')?.value||(document.getElementById('f-bookie-search')?.value||''),exchange:document.getElementById('f-exchange')?.value||'',event:document.getElementById('f-event')?.value||'',bstake:document.getElementById('f-bstake')?.value||'',bodds:document.getElementById('f-bodds')?.value||'',pnl:document.getElementById('f-pnl')?.value||'',_acct:formAccount};
  lastSavedTrade=lastTx;
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('logTrade');showToast('✓ Trade saved');msg.textContent='';
  // Stay on form — keep type, bookie, exchange; clear event/stake/odds/pnl
  const keepBookie=document.getElementById('f-bookie-search')?.value||'';
  const keepBookieVal=document.getElementById('f-bookie')?.value||'';
  const keepExchange=document.getElementById('f-exchange')?.value||'';
  // Re-render keeping context
  const mc=document.getElementById('main-content');
  if(mc&&currentTab==='add'){
    mc.innerHTML=renderAdd();
    setTimeout(()=>{
      if(keepBookie){const bs=document.getElementById('f-bookie-search');if(bs)bs.value=keepBookie;}
      const bh=document.getElementById('f-bookie');if(bh)bh.value=keepBookieVal;
      const fe=document.getElementById('f-exchange');if(fe&&keepExchange)fe.value=keepExchange;
      updateFormFields();bindFormEvents();
    },10);
  }
}

function deleteTx(acct,id){
  if(!confirm('Delete this transaction? Balances will be reversed.'))return;
  const tx=(state[acct].transactions||[]).find(t=>t.id===id);
  if(!tx){state[acct].transactions=state[acct].transactions.filter(t=>t.id!==id);if(!deletedTxIds[acct])deletedTxIds[acct]=[];deletedTxIds[acct].push(id);if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('quickDeleteTx');render();return;}
  const p=state[acct];
  const isFB=isFreeBet(tx.type);
  const bstake=tx.bstake||0,bodds=tx.bodds||0,pnl=tx.pnl||0;
  // Reverse the balance changes that were applied when this tx was logged/settled
  if(BET_ONLY.includes(tx.type)){
    if(tx.result==='Pending'){
      // Was deducted at log time — restore stake to bookie
      if(!isFB&&tx.bookie&&p.bookies[tx.bookie])
        p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+bstake;
    }else if(tx.result==='Won'){
      // Return was added — reverse it
      if(isFB){
        if(tx.bookie&&p.bookies[tx.bookie])
          p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-((bodds-1)*bstake);
      }else{
        if(tx.bookie&&p.bookies[tx.bookie])
          p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(bodds*bstake);
      }
    }else if(tx.result==='Lost'){
      // Stake was deducted, lay profit went to exchange — reverse exchange
      if(!isFB&&tx.bookie&&p.bookies[tx.bookie])
        p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+bstake;
      if(tx.exchange&&state.exchanges[tx.exchange]!==undefined)
        state.exchanges[tx.exchange]=(state.exchanges[tx.exchange]||0)-pnl;
    }
  }else if(tx.type==='Deposit'){
    // Reverse: bookie −deposit, bank +deposit
    if(tx.bookie&&p.bookies[tx.bookie])p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(tx.amount||0);
    p.bank+=(tx.amount||0);
  }else if(tx.type==='Withdrawal'){
    if(tx.bookie&&p.bookies[tx.bookie])p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+(tx.amount||0);
    p.bank-=(tx.amount||0);
  }else if(tx.type==='Exchange Deposit'){
    if(tx.exchange&&state.exchanges[tx.exchange]!==undefined)state.exchanges[tx.exchange]=(state.exchanges[tx.exchange]||0)-(tx.amount||0);
    p.bank+=(tx.amount||0);
  }else if(tx.type==='Exchange Withdrawal'){
    if(tx.exchange&&state.exchanges[tx.exchange]!==undefined)state.exchanges[tx.exchange]=(state.exchanges[tx.exchange]||0)+(tx.amount||0);
    p.bank-=(tx.amount||0);
  }
  // Balance Amendment — reverse the diff
  else if(tx.type==='Balance Amendment'){
    const target=tx.target;
    if(target==='Bank'){p.bank-=(tx.diff||0);}
    else if(target&&p.bookies[target]){p.bookies[target].bal=(p.bookies[target].bal||0)-(tx.diff||0);}
  }
  state[acct].transactions=state[acct].transactions.filter(t=>t.id!==id);
  if(!deletedTxIds[acct])deletedTxIds[acct]=[];
  deletedTxIds[acct].push(id);
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}
  saveData('deleteTx');showToast('Transaction deleted & balances reversed');render();
}

// ── GUBBING RISK TRACKER ─────────────────────────────────────────────────────
function calcBookieRisk(acct, bookieName){
  const txs=(state[acct].transactions||[]).filter(t=>t.bookie===bookieName&&BET_ONLY.includes(t.type));
  const settled=txs.filter(t=>t.result==='Won'||t.result==='Lost');
  if(settled.length<2)return null;

  // Mug bets — low odds bets to appear as normal punter
  const mugBets=txs.filter(t=>t.type==='Mug').length;
  const mugRatio=txs.length>0?mugBets/txs.length:0;

  // Free bet ratio — using every offer looks automated
  const freeBets=txs.filter(t=>t.type==='Free Bet').length;
  const freeBetRatio=txs.length>0?freeBets/txs.length:0;

  // Average back odds — always betting high odds looks like a sharp
  const oddsArr=txs.filter(t=>t.bodds>0).map(t=>t.bodds);
  const avgOdds=oddsArr.length?oddsArr.reduce((a,b)=>a+b,0)/oddsArr.length:0;
  const hasLowOddsBets=oddsArr.some(o=>o<=2.0);
  const allHighOdds=oddsArr.length>4&&!hasLowOddsBets;

  // Bets per week — very high frequency looks automated
  const dates=txs.map(t=>{const p=t.date?.split('/');return p?.length===3?new Date(+p[2],+p[1]-1,+p[0]):null;}).filter(Boolean);
  let betsPerWeek=0;
  if(dates.length>1){
    const spanWeeks=Math.max((Math.max(...dates)-Math.min(...dates))/(1000*60*60*24*7),0.1);
    betsPerWeek=txs.length/spanWeeks;
  }

  // Total P&L — very profitable accounts get restricted faster
  const totalPnl=settled.reduce((a,t)=>a+(t.pnl||0),0);

  // Score: 0 (safe) to 100 (high risk)
  let score=0;
  const flags=[];

  // 1. Mug bet ratio — biggest factor
  if(mugRatio===0&&txs.length>4){
    score+=40;flags.push('No mug bets logged on this bookie');
  } else if(mugRatio<0.1&&txs.length>4){
    score+=25;flags.push(`Very low mug bet ratio (${Math.round(mugRatio*100)}%)`);
  } else if(mugRatio<0.2&&txs.length>6){
    score+=12;flags.push(`Low mug bet ratio (${Math.round(mugRatio*100)}%)`);
  }

  // 2. Always high odds — no low-odds bets ever placed
  if(allHighOdds){
    score+=25;flags.push(`Always high odds — avg ${avgOdds.toFixed(2)}, no bets under 2.0`);
  } else if(avgOdds>3.5&&txs.length>5){
    score+=12;flags.push(`High average odds (${avgOdds.toFixed(2)}) — add some low-odds bets`);
  }

  // 3. High free bet ratio — looks like pure bonus hunting
  if(freeBetRatio>0.65&&txs.length>4){
    score+=20;flags.push(`Mostly free bets (${Math.round(freeBetRatio*100)}%) — mix in qualifiers`);
  } else if(freeBetRatio>0.45&&txs.length>4){
    score+=10;flags.push(`High free bet ratio (${Math.round(freeBetRatio*100)}%)`);
  }

  // 4. High P&L — very profitable accounts attract attention
  if(totalPnl>500){
    score+=15;flags.push(`High profit on this bookie (£${totalPnl.toFixed(0)})`);
  } else if(totalPnl>250){
    score+=8;flags.push(`Good profit (£${totalPnl.toFixed(0)}) — monitor`);
  }

  // 5. Very high bet frequency
  if(betsPerWeek>20){
    score+=10;flags.push(`Very high frequency (${betsPerWeek.toFixed(1)} bets/week)`);
  } else if(betsPerWeek>10){
    score+=5;flags.push(`High frequency (${betsPerWeek.toFixed(1)} bets/week)`);
  }

  score=Math.min(score,100);
  const level=score>=55?'red':score>=25?'amber':'green';
  return{score,level,flags,txCount:txs.length,settled:settled.length,mugRatio,freeBetRatio,avgOdds,hasLowOddsBets,betsPerWeek,totalPnl};
}

function renderRisk(){
  // Gather all bookies across all accounts with enough data
  const allRisks=[];
  PROFILES.forEach(acct=>{
    Object.keys(state[acct].bookies||{}).forEach(bookie=>{
      const risk=calcBookieRisk(acct,bookie);
      if(risk)allRisks.push({acct,bookie,risk});
    });
  });

  if(!allRisks.length)return`<div style="text-align:center;padding:60px 20px"><i class="ti ti-shield" style="font-size:48px;color:#9A9590" aria-hidden="true"></i><div style="font-size:15px;font-weight:500;margin-top:12px;color:#F0EDE8">No risk data yet</div><div style="font-size:13px;color:#9A9590;margin-top:6px">Log at least 2 settled bets per bookie to see risk analysis</div></div>`;

  const red=allRisks.filter(r=>r.risk.level==='red');
  const amber=allRisks.filter(r=>r.risk.level==='amber');
  const green=allRisks.filter(r=>r.risk.level==='green');

  // Sort: red first, then amber, then green, within each by score desc
  const sorted=[...red,...amber,...green].sort((a,b)=>{
    const order={red:0,amber:1,green:2};
    if(order[a.risk.level]!==order[b.risk.level])return order[a.risk.level]-order[b.risk.level];
    return b.risk.score-a.risk.score;
  });

  return`
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
    <div class="metric-card" style="background:#791F1F">
      <div class="metric-label" style="color:#F09595"><i class="ti ti-shield-x" aria-hidden="true"></i>High risk</div>
      <div class="metric-value" style="color:#F09595">${red.length}</div>
      <div class="metric-sub" style="color:#F09595">bookies</div>
    </div>
    <div class="metric-card" style="background:#5C3800">
      <div class="metric-label" style="color:#F0A500"><i class="ti ti-shield-half" aria-hidden="true"></i>Medium</div>
      <div class="metric-value" style="color:#F0A500">${amber.length}</div>
      <div class="metric-sub" style="color:#F0A500">bookies</div>
    </div>
    <div class="metric-card" style="background:#14532D">
      <div class="metric-label" style="color:#86EFAC"><i class="ti ti-shield-check" aria-hidden="true"></i>Low risk</div>
      <div class="metric-value" style="color:#86EFAC">${green.length}</div>
      <div class="metric-sub" style="color:#86EFAC">bookies</div>
    </div>
  </div>

  ${red.length?`<div style="font-size:11px;font-weight:500;color:#F09595;letter-spacing:.3px;text-transform:uppercase;margin-bottom:8px"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Action needed</div>
  ${red.map(r=>renderRiskCard(r)).join('')}`:''}

  ${amber.length?`<div style="font-size:11px;font-weight:500;color:#F0A500;letter-spacing:.3px;text-transform:uppercase;margin:12px 0 8px"><i class="ti ti-alert-circle" aria-hidden="true"></i> Monitor closely</div>
  ${amber.map(r=>renderRiskCard(r)).join('')}`:''}

  ${green.length?`<div style="font-size:11px;font-weight:500;color:#86EFAC;letter-spacing:.3px;text-transform:uppercase;margin:12px 0 8px"><i class="ti ti-circle-check" aria-hidden="true"></i> Looking good</div>
  ${green.map(r=>renderRiskCard(r)).join('')}`:''}`;
}

function renderRiskCard(r){
  const {acct,bookie,risk}=r;
  const levelColors={
    red:{bg:'#791F1F',border:'#A32D2D',text:'#F09595',badge:'#A32D2D'},
    amber:{bg:'#5C3800',border:'#854F0B',text:'#F0A500',badge:'#854F0B'},
    green:{bg:'#14532D',border:'#3B6D11',text:'#86EFAC',badge:'#3B6D11'},
  }[risk.level];
  const levelLabel={red:'High risk',amber:'Medium risk',green:'Low risk'}[risk.level];
  const barWidth=Math.round(risk.score);

  return`<div style="background:#2C3136;border:0.5px solid rgba(255,255,255,0.09);border-left:2px solid ${levelColors.border};border-radius:12px;padding:14px;margin-bottom:8px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="font-size:14px;font-weight:500;color:#F0EDE8">${bookie}</span>
          ${acctPill(acct)}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span style="font-size:11px;color:#9A9590">${risk.txCount} bets</span>
          <span style="font-size:11px;color:#9A9590">${Math.round(risk.mugRatio*100)}% mugged</span>
          ${risk.avgOdds>0?`<span style="font-size:11px;color:#9A9590">avg odds ${risk.avgOdds.toFixed(2)}</span>`:''}
          <span style="font-size:11px;color:#9A9590">£${risk.totalPnl.toFixed(0)} profit</span>
        </div>
      </div>
      <span style="background:${levelColors.bg};color:${levelColors.text};border:0.5px solid ${levelColors.border};padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;flex-shrink:0">${levelLabel}</span>
    </div>

    <div style="background:#3D4349;border-radius:4px;height:4px;margin-bottom:10px;overflow:hidden">
      <div style="background:${levelColors.text};height:100%;width:${barWidth}%;border-radius:4px;transition:width .5s"></div>
    </div>

    ${risk.flags.length?`<div style="display:flex;flex-direction:column;gap:4px">
      ${risk.flags.map(f=>`<div style="font-size:11px;color:${levelColors.text};display:flex;align-items:center;gap:5px"><i class="ti ti-point-filled" style="font-size:8px" aria-hidden="true"></i>${f}</div>`).join('')}
    </div>`:''}

    ${risk.level!=='green'?`<div style="margin-top:10px;padding-top:10px;border-top:0.5px solid rgba(255,255,255,0.08)">
      <div style="font-size:11px;color:#9A9590;margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.3px">Suggested action</div>
      <div style="font-size:12px;color:#B4B2A9">${getRiskAdvice(risk)}</div>
    </div>`:''}
  </div>`;
}

function getRiskAdvice(risk){
  const tips=[];
  if(risk.mugRatio<0.2)tips.push('Log more mug bets on this bookie — aim for 1 mug per 3–4 matched bets');
  if(!risk.hasLowOddsBets||risk.avgOdds>3.5)tips.push('Place some bets at lower odds (1.3–2.0) to look like a normal punter');
  if(risk.freeBetRatio>0.5)tips.push('Mix in more qualifying and mug bets alongside free bet usage');
  if(risk.totalPnl>300)tips.push('Consider a gradual withdrawal to avoid drawing attention');
  if(risk.betsPerWeek>15)tips.push('Reduce bet frequency — spread bets across more days');
  return tips.length?tips.join(' · '):'Keep logging mug bets regularly to maintain a natural pattern';
}


// ── CASINO ───────────────────────────────────────────────────────────────────
const CASINO_OFFER_TYPES=['Reload','Welcome','Free Spins','Cashback','Other'];
let casinoFormAcct='me';
let casinoView='log';
let casinoOfferType='';
let casinoPendingSpins=false;
let casinoHasDeposit=false;
let casinoOperator='JG';

function renderCasino(){
  const allSessions=PROFILES.flatMap(p=>(state[p].casino||[]).map(s=>({...s,_acct:p}))).sort((a,b)=>b.id-a.id);
  const totalCasino=PROFILES.reduce((a,p)=>a+casinoPnl(p),0);
  const jgPnl=allSessions.reduce((a,s)=>{
    if(s.operator!=='JG')return a;
    return a+(s.startBal!==undefined?s.endBal-s.startBal:s.netProfit||0);
  },0);
  const jpPnl=allSessions.reduce((a,s)=>{
    if(s.operator!=='JP')return a;
    return a+(s.startBal!==undefined?s.endBal-s.startBal:s.netProfit||0);
  },0);
  const profilePnlHtml=PROFILES.map(p=>'<span>'+profileLabel(p)+': <span style="color:'+(casinoPnl(p)>=0?'#22C55E':'#F87171')+'">'+fmtS(casinoPnl(p))+'</span></span>').join('');

  // Render view content separately so tabs work correctly
  let viewHtml='';
  if(casinoView==='log')viewHtml=renderCasinoForm();
  else if(casinoView==='history')viewHtml=renderCasinoHistory();
  else if(casinoView==='monthly')viewHtml=renderCasinoMonthly();
  else viewHtml=renderCasinoSummaryView();

  return '<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn-sm" onclick="exportCasinoCSV()"><i class="ti ti-download" aria-hidden="true"></i> Export CSV</button></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'
    +'<div class="metric-card" style="grid-column:span 2">'
    +'<div class="metric-label"><i class="ti ti-cards" aria-hidden="true"></i>Casino P&L</div>'
    +'<div class="metric-value '+(totalCasino>=0?'pos':'neg')+'">'+fmtS(totalCasino)+'</div>'
    +'<div class="metric-sub" style="display:flex;gap:10px;flex-wrap:wrap">'+profilePnlHtml+'</div>'
    +'<div style="margin-top:6px;padding-top:6px;border-top:0.5px solid rgba(255,255,255,0.08);display:flex;gap:10px">'
    +'<span style="font-size:11px">JG: <span style="color:'+(jgPnl>=0?'#22C55E':'#F87171')+';font-weight:500">'+fmtS(jgPnl)+'</span></span>'
    +'<span style="font-size:11px">JP: <span style="color:'+(jpPnl>=0?'#22C55E':'#F87171')+';font-weight:500">'+fmtS(jpPnl)+'</span></span>'
    +'</div></div></div>'
    +'<div style="display:flex;gap:8px;margin-bottom:14px">'
    +'<button onclick="setCasinoView(0)" class="btn '+(casinoView==='log'?'btn-primary':'btn-ghost')+'" style="flex:1;padding:10px">Log</button>'
    +'<button onclick="setCasinoView(1)" class="btn '+(casinoView==='history'?'btn-primary':'btn-ghost')+'" style="flex:1;padding:10px">History</button>'
    +'<button onclick="setCasinoView(2)" class="btn '+(casinoView==='monthly'?'btn-primary':'btn-ghost')+'" style="flex:1;padding:10px">Monthly</button>'
    +'<button onclick="setCasinoView(3)" class="btn '+(casinoView==='summary'?'btn-primary':'btn-ghost')+'" style="flex:1;padding:10px">Summary</button>'
    +'</div>'
    +'<div id="casino-view">'+viewHtml+'</div>';
}


function renderCasinoMonthly(){
  const allSessions=PROFILES.flatMap(p=>(state[p].casino||[]).map(s=>({...s,_acct:p})));
  const newSessions=allSessions.filter(s=>s.startBal!==undefined&&s.endBal!==undefined);
  const monthlyMap={};
  newSessions.forEach(s=>{
    const d=s.date||'';
    const parts=d.split('/');
    if(parts.length<3)return;
    const key=parts[2]+'-'+parts[1].padStart(2,'0');
    if(!monthlyMap[key])monthlyMap[key]={JG:0,JP:0,total:0};
    const pnl=s.endBal-s.startBal;
    monthlyMap[key][s.operator||'JG']+=pnl;
    monthlyMap[key].total+=pnl;
  });
  const histTotal=allSessions.filter(s=>s.startBal===undefined).reduce((a,s)=>a+(s.netProfit||0),0);
  const monthKeys=Object.keys(monthlyMap).sort().reverse();
  if(!monthKeys.length&&histTotal===0)return '<div class="empty">No casino sessions yet</div>';
  const rows=monthKeys.map(k=>{
    const mo=monthlyMap[k];
    const label=k.slice(0,4)+'/'+k.slice(5);
    return '<tr>'
      +'<td style="font-size:12px">'+label+'</td>'
      +'<td style="text-align:right;font-size:12px;color:'+(mo.JG>=0?'#22C55E':'#F87171')+'">'+fmtS(mo.JG)+'</td>'
      +'<td style="text-align:right;font-size:12px;color:'+(mo.JP>=0?'#22C55E':'#F87171')+'">'+fmtS(mo.JP)+'</td>'
      +'<td style="text-align:right;font-size:12px;font-weight:500;color:'+(mo.total>=0?'#22C55E':'#F87171')+'">'+fmtS(mo.total)+'</td>'
      +'</tr>';
  }).join('');
  const histRow=histTotal!==0
    ?'<tr style="border-top:1px solid rgba(255,255,255,0.10)">'
      +'<td style="font-size:11px;color:#9A9590">Historical</td>'
      +'<td style="text-align:right;font-size:11px;color:#9A9590">—</td>'
      +'<td style="text-align:right;font-size:11px;color:#9A9590">—</td>'
      +'<td style="text-align:right;font-size:11px;color:'+(histTotal>=0?'#22C55E':'#F87171')+'">'+fmtS(histTotal)+'</td>'
      +'</tr>'
    :'';
  return '<div class="card">'
    +'<div class="card-header"><span class="card-title">Monthly Casino P&L by Operator</span></div>'
    +'<div style="overflow-x:auto">'
    +'<table class="data-table" style="width:100%">'
    +'<thead><tr><th>Month</th><th style="text-align:right">JG (£)</th><th style="text-align:right">JP (£)</th><th style="text-align:right">Total (£)</th></tr></thead>'
    +'<tbody>'+rows+histRow+'</tbody>'
    +'</table></div></div>';
}


function renderCasinoSummaryView(){
  const allSessions=PROFILES.flatMap(p=>(state[p].casino||[]).map(s=>({...s,_acct:p})));
  const sessionPnl=s=>s.startBal!==undefined?s.endBal-s.startBal:s.netProfit||0;

  // Split by operator
  const jgSessions=allSessions.filter(s=>(s.operator||'JG')==='JG');
  const jpSessions=allSessions.filter(s=>s.operator==='JP');
  const jgPnl=jgSessions.reduce((a,s)=>a+sessionPnl(s),0);
  const jpPnl=jpSessions.reduce((a,s)=>a+sessionPnl(s),0);
  const totalPnl=jgPnl+jpPnl;
  const totalSessions=allSessions.length;

  // By casino
  const casinoMap={};
  allSessions.forEach(s=>{
    if(!s.casino)return;
    casinoMap[s.casino]=(casinoMap[s.casino]||0)+sessionPnl(s);
  });
  const entries=Object.entries(casinoMap).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return '<div class="empty">No casino sessions yet</div>';

  const rows=entries.map(([casino,pnl])=>'<div class="list-row">'
    +'<div class="list-row-left"><div class="list-row-title" style="font-size:12px">'+(casino||'Unknown')+'</div></div>'
    +'<div class="list-row-right" style="color:'+(pnl>=0?'#22C55E':'#F87171')+';font-size:12px">'+fmtS(pnl)+'</div>'
    +'</div>').join('');

  return '<div class="metric-card" style="margin-bottom:12px">'
    +'<div class="metric-label"><i class="ti ti-cards" aria-hidden="true"></i>Combined Casino Summary</div>'
    +'<div class="metric-value '+(totalPnl>=0?'pos':'neg')+'">'+fmtS(totalPnl)+'</div>'
    +'<div class="metric-sub">'+totalSessions+' total sessions</div>'
    +'<div style="margin-top:8px;padding-top:8px;border-top:0.5px solid rgba(255,255,255,0.08);display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    +'<div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:10px">'
    +'<div style="font-size:10px;color:#9A9590;margin-bottom:4px">JG</div>'
    +'<div style="font-size:16px;font-weight:500;color:'+(jgPnl>=0?'#22C55E':'#F87171')+'">'+fmtS(jgPnl)+'</div>'
    +'<div style="font-size:11px;color:#9A9590;margin-top:2px">'+jgSessions.length+' sessions</div>'
    +'</div>'
    +'<div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:10px">'
    +'<div style="font-size:10px;color:#9A9590;margin-bottom:4px">JP</div>'
    +'<div style="font-size:16px;font-weight:500;color:'+(jpPnl>=0?'#22C55E':'#F87171')+'">'+fmtS(jpPnl)+'</div>'
    +'<div style="font-size:11px;color:#9A9590;margin-top:2px">'+jpSessions.length+' sessions</div>'
    +'</div>'
    +'</div></div>'
    +'<div class="card">'
    +'<div class="card-header"><span class="card-title">P&L by Casino</span></div>'
    +rows
    +'</div>';
}


function renderCasinoHistory(){
  const sessions=PROFILES.flatMap(p=>(state[p].casino||[])
    .filter(s=>s.startBal!==undefined&&s.endBal!==undefined)
    .map(s=>({...s,_acct:p}))).sort((a,b)=>b.id-a.id);
  if(!sessions.length)return '<div class="empty">No new casino sessions yet — log one above</div>';
  const rows=sessions.map(s=>{
    const pnl=s.endBal-s.startBal;

      +'<td style="font-size:11px;white-space:nowrap">'+(s.date||'')+'</td>'

      +'<td><button onclick="deleteCasinoSession(\x27'+s._acct+'\x27,'+s.id+')" style="background:none;border:none;color:#F87171;cursor:pointer;padding:4px"><i class="ti ti-trash" style="font-size:13px"></i></button></td>'
      +'</tr>';

// Prevent scroll wheel changing number inputs
document.addEventListener('wheel', function(e){
  if(document.activeElement&&document.activeElement.type==='number'){
    document.activeElement.blur();
  }
}, {passive:false});

async function loadApp(){
  window._appLoading=true;
  // Version check — clear localStorage cache if bookie list version changed
  const BOOKIE_VERSION='v8';
  if(localStorage.getItem('mbe_bookie_ver')!==BOOKIE_VERSION){
    localStorage.removeItem('mbe_state');
    localStorage.setItem('mbe_bookie_ver',BOOKIE_VERSION);
  }
  try{
    await loadData();
    // migrateLegacy runs inside fetchFromServer after server data loads
  }catch(e){
    console.error('Load failed:',e);
  }finally{
    window._appLoading=false;
  }
  const pb=document.getElementById('profile-bar');if(pb)pb.style.display='none';
  switchProfile('me');
  render();
}

function checkPin(){
  if(sessionStorage.getItem('mbe_unlocked')==='1'){
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('app-content').style.display='block';
    loadApp();
    return;
  }
  const pinKey='0069';
  const ps=document.getElementById('pin-screen');
  ps.style.cssText='display:flex;position:fixed;inset:0;background:#343A40;z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px';
  ps.innerHTML=`
    <div style="font-size:22px;font-weight:500;color:#F0EDE8;margin-bottom:8px">MBWorld</div>
    <div style="font-size:13px;color:#9A9590;margin-bottom:32px">Enter PIN to continue</div>
    <div id="pin-dots" style="display:flex;gap:12px;margin-bottom:32px">
      ${[0,1,2,3].map(i=>'<div style="width:14px;height:14px;border-radius:50%;border:2px solid #9A9590;background:transparent" id="pd'+i+'"></div>').join('')}
    </div>
    <div id="pin-error" style="font-size:12px;color:#F87171;margin-bottom:16px;min-height:18px"></div>
    <div style="display:grid;grid-template-columns:repeat(3,72px);gap:12px">
      ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(d=>`<button onclick="pinPress('${d}')" style="height:72px;border-radius:50%;border:0.5px solid rgba(255,255,255,0.10);background:#2C3136;color:#F0EDE8;font-size:${d==='⌫'?'20':'22'}px;font-weight:500;font-family:system-ui,-apple-system,sans-serif;cursor:pointer;${d===''?'visibility:hidden':''}">${d}</button>`).join('')}
    </div>`;
  let entry='';
  window.pinPress=function(d){
    if(d==='⌫'){entry=entry.slice(0,-1);}
    else if(d!==''){entry+=d;}
    for(let i=0;i<4;i++){
      const dot=document.getElementById('pd'+i);
      if(dot)dot.style.background=i<entry.length?'#F0EDE8':'transparent';
    }
    if(entry.length===4){
      if(entry===pinKey){
        sessionStorage.setItem('mbe_unlocked','1');
        ps.style.display='none';
        document.getElementById('app-content').style.display='block';
        loadApp();
      }else{
        document.getElementById('pin-error').textContent='Incorrect PIN';
        entry='';
        for(let i=0;i<4;i++){const dot=document.getElementById('pd'+i);if(dot)dot.style.background='transparent';}
      }
    }
  };
}

async function init(){
  checkPin();
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  });
}
init();
