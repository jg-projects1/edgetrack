function verifyBookie(acct,name){
  const p=state[acct];
  if(!p.bookies[name])return;
  const stored=p.bookies[name].bal||0;
  const safeId=name.replace(/[^a-z0-9]/gi,'_');
  const input=document.getElementById('vinput-'+acct+'-'+safeId);
  if(!input)return;
  const entered=parseFloat(input.value);
  if(isNaN(entered)){showToast('Enter a valid balance','error');return;}
  const diff=Math.round((entered-stored)*100)/100;
  if(Math.abs(diff)>0.001){
    // Log balance amendment
    const date=todayStr();
    p.transactions=p.transactions||[];
    p.transactions.push({id:Date.now(),date,type:'Balance Amendment',target:name,oldVal:stored,newVal:entered,diff,pnl:diff,notes:'Balance verified',result:'—',_acct:acct,txUpdatedAt:Date.now()});
    p.bookies[name].bal=entered;p.bookies[name].balUpdatedAt=Date.now();
    showToast(name+' updated by '+fmtS(diff));
  } else {
    // Balance unchanged, but a manual confirmation is still a genuine
    // freshness signal — you looked at this bookie and confirmed it's
    // right, same as if activity had touched it naturally.
    p.bookies[name].balUpdatedAt=Date.now();
    showToast(name+' balance confirmed ✓');
  }
  p.bookies[name].verifiedAt=Date.now();
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('verify');
  // Update bookie row in place
  const safeId2=name.replace(/[^a-z0-9]/gi,'_');
  const vrow=document.getElementById('vrow-'+acct+'-'+safeId2);
  if(vrow){
    // Update status label colour
    const statusSpan=vrow.querySelector('span');
    const vs=getVerifyStatus(p.bookies[name]);
    if(statusSpan){
      statusSpan.textContent=vs.show?vs.label:'£0 balance — nothing to verify';
      statusSpan.style.color=vs.show?vs.col:'var(--text-muted)';
    }
    vrow.style.display='none';
  }
  // Update RAG dot on bookie row — hide it entirely if the balance is
  // now £0 (e.g. amended down to zero), rather than trying to colour a
  // dot that shouldn't be showing at all anymore.
  const ragDot=document.getElementById('rag-'+acct+'-'+safeId2);
  const vs2=getVerifyStatus(p.bookies[name]);
  if(ragDot){ragDot.style.display=vs2.show?'block':'none';if(vs2.show)ragDot.style.background=vs2.col;}
  // Re-render dashboard if currently on it, otherwise just update strip
  if(currentTab==='dashboard'){
    render();
  } else {
    updateDashboardStrip();
  }
}

function getVerifyStats(){
  const now=Date.now();
  const ab=PROFILES.flatMap(pr=>Object.entries(state[pr].bookies||{})
    .filter(([,d])=>d&&d.status==='Active'&&Math.abs(d.bal||0)>=0.01) // £0 balances excluded — nothing to track
    .map(([,d])=>d));
  const never=ab.filter(b=>!b.balUpdatedAt).length;
  const overdue=ab.filter(b=>b.balUpdatedAt&&Math.floor((now-b.balUpdatedAt)/86400000)>30).length;
  const recent=ab.filter(b=>b.balUpdatedAt&&Math.floor((now-b.balUpdatedAt)/86400000)<=30).length;
  return{ab,never,overdue,recent,allVerified:!never&&!overdue};
}

function getVerifyStatus(bookie){
  const bal=bookie.bal||0;
  // £0 balances have nothing at risk — no dot, no warning, regardless of
  // how long they've sat untouched. Only non-zero balances get tracked.
  if(Math.abs(bal)<0.01)return{label:'£0 balance',days:null,col:null,show:false};
  const t=bookie.balUpdatedAt;
  if(!t)return{label:'No activity tracked',days:null,col:'#F87171',show:true};
  const days=Math.floor((Date.now()-t)/(1000*60*60*24));
  if(days===0)return{label:'Updated today',days:0,col:'#22C55E',show:true};
  if(days<=14)return{label:'Updated '+days+'d ago',days,col:'#22C55E',show:true};
  if(days<=30)return{label:'Updated '+days+'d ago',days,col:'#F0A500',show:true};
  return{label:'Updated '+days+'d ago',days,col:'#F87171',show:true};
}

// ── GUBBING RISK TRACKER ─────────────────────────────────────────────────────
function calcBookieRisk(acct, bookieName){
  const txs=(state[acct].transactions||[]).filter(t=>t.bookie===bookieName&&BET_ONLY.includes(t.type));
  const settled=txs.filter(t=>t.result==='Won'||t.result==='Lost');
  if(settled.length<2)return null;

  // Mug bets — low odds bets to appear as normal punter
  const mugBets=txs.filter(t=>t.type==='Mug').length;
  const mugRatio=txs.length>0?mugBets/txs.length:0;

  // Free bet ratio — using every offer looks automated
  const freeBets=txs.filter(t=>t.type==='Free Bet').length;
  const freeBetRatio=txs.length>0?freeBets/txs.length:0;

  // Average back odds — always betting high odds looks like a sharp
  const oddsArr=txs.filter(t=>t.bodds>0).map(t=>t.bodds);
  const avgOdds=oddsArr.length?oddsArr.reduce((a,b)=>a+b,0)/oddsArr.length:0;
  const hasLowOddsBets=oddsArr.some(o=>o<=2.0);
  const allHighOdds=oddsArr.length>4&&!hasLowOddsBets;

  // Bets per week — very high frequency looks automated
  const dates=txs.map(t=>{const p=t.date?.split('/');return p?.length===3?new Date(+p[2],+p[1]-1,+p[0]):null;}).filter(Boolean);
  let betsPerWeek=0;
  if(dates.length>1){
    const spanWeeks=Math.max((Math.max(...dates)-Math.min(...dates))/(1000*60*60*24*7),0.1);
    betsPerWeek=txs.length/spanWeeks;
  }

  // Total P&L — very profitable accounts get restricted faster
  const totalPnl=settled.reduce((a,t)=>a+(t.pnl||0),0);

  // Score: 0 (safe) to 100 (high risk)
  let score=0;
  const flags=[];

  // 1. Mug bet ratio — biggest factor
  if(mugRatio===0&&txs.length>4){
    score+=40;flags.push('No mug bets logged on this bookie');
  } else if(mugRatio<0.1&&txs.length>4){
    score+=25;flags.push(`Very low mug bet ratio (${Math.round(mugRatio*100)}%)`);
  } else if(mugRatio<0.2&&txs.length>6){
    score+=12;flags.push(`Low mug bet ratio (${Math.round(mugRatio*100)}%)`);
  }

  // 2. Always high odds — no low-odds bets ever placed
  if(allHighOdds){
    score+=25;flags.push(`Always high odds — avg ${avgOdds.toFixed(2)}, no bets under 2.0`);
  } else if(avgOdds>3.5&&txs.length>5){
    score+=12;flags.push(`High average odds (${avgOdds.toFixed(2)}) — add some low-odds bets`);
  }

  // 3. High free bet ratio — looks like pure bonus hunting
  if(freeBetRatio>0.65&&txs.length>4){
    score+=20;flags.push(`Mostly free bets (${Math.round(freeBetRatio*100)}%) — mix in qualifiers`);
  } else if(freeBetRatio>0.45&&txs.length>4){
    score+=10;flags.push(`High free bet ratio (${Math.round(freeBetRatio*100)}%)`);
  }

  // 4. High P&L — very profitable accounts attract attention
  if(totalPnl>500){
    score+=15;flags.push(`High profit on this bookie (£${totalPnl.toFixed(0)})`);
  } else if(totalPnl>250){
    score+=8;flags.push(`Good profit (£${totalPnl.toFixed(0)}) — monitor`);
  }

  // 5. Very high bet frequency
  if(betsPerWeek>20){
    score+=10;flags.push(`Very high frequency (${betsPerWeek.toFixed(1)} bets/week)`);
  } else if(betsPerWeek>10){
    score+=5;flags.push(`High frequency (${betsPerWeek.toFixed(1)} bets/week)`);
  }

  score=Math.min(score,100);
  const level=score>=55?'red':score>=25?'amber':'green';
  return{score,level,flags,txCount:txs.length,settled:settled.length,mugRatio,freeBetRatio,avgOdds,hasLowOddsBets,betsPerWeek,totalPnl};
}

function renderRisk(){
  // Gather all bookies across all accounts with enough data
  const allRisks=[];
  PROFILES.forEach(acct=>{
    Object.keys(state[acct].bookies||{}).forEach(bookie=>{
      const risk=calcBookieRisk(acct,bookie);
      if(risk)allRisks.push({acct,bookie,risk});
    });
  });

  if(!allRisks.length)return`<div style="text-align:center;padding:60px 20px"><i class="ti ti-shield" style="font-size:48px;color:var(--text-muted)" aria-hidden="true"></i><div style="font-size:15px;font-weight:500;margin-top:12px;color:var(--text-primary)">No risk data yet</div><div style="font-size:13px;color:var(--text-muted);margin-top:6px">Log at least 2 settled bets per bookie to see risk analysis</div></div>`;

  const red=allRisks.filter(r=>r.risk.level==='red');
  const amber=allRisks.filter(r=>r.risk.level==='amber');
  const green=allRisks.filter(r=>r.risk.level==='green');

  // Sort: red first, then amber, then green, within each by score desc
  const sorted=[...red,...amber,...green].sort((a,b)=>{
    const order={red:0,amber:1,green:2};
    if(order[a.risk.level]!==order[b.risk.level])return order[a.risk.level]-order[b.risk.level];
    return b.risk.score-a.risk.score;
  });

  return`
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
    <div class="metric-card" style="background:var(--bg-risk-red)">
      <div class="metric-label" style="color:var(--text-neg)"><i class="ti ti-shield-x" aria-hidden="true"></i>High risk</div>
      <div class="metric-value" style="color:#F87171">${red.length}</div>
      <div class="metric-sub" style="color:#F87171">bookies</div>
    </div>
    <div class="metric-card" style="background:var(--bg-risk-amber)">
      <div class="metric-label" style="color:#FBBF24"><i class="ti ti-shield-half" aria-hidden="true"></i>Medium</div>
      <div class="metric-value" style="color:#FBBF24">${amber.length}</div>
      <div class="metric-sub" style="color:#FBBF24">bookies</div>
    </div>
    <div class="metric-card" style="background:var(--bg-risk-green)">
      <div class="metric-label" style="color:var(--text-accent)"><i class="ti ti-shield-check" aria-hidden="true"></i>Low risk</div>
      <div class="metric-value" style="color:var(--text-accent)">${green.length}</div>
      <div class="metric-sub" style="color:var(--text-accent)">bookies</div>
    </div>
  </div>

  ${red.length?`<div style="font-size:11px;font-weight:500;color:var(--text-neg);letter-spacing:.3px;text-transform:uppercase;margin-bottom:8px"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Action needed</div>
  ${red.map(r=>renderRiskCard(r)).join('')}`:''}

  ${amber.length?`<div style="font-size:11px;font-weight:500;color:var(--text-warn);letter-spacing:.3px;text-transform:uppercase;margin:12px 0 8px"><i class="ti ti-alert-circle" aria-hidden="true"></i> Monitor closely</div>
  ${amber.map(r=>renderRiskCard(r)).join('')}`:''}

  ${green.length?`<div style="font-size:11px;font-weight:500;color:var(--text-accent);letter-spacing:.3px;text-transform:uppercase;margin:12px 0 8px"><i class="ti ti-circle-check" aria-hidden="true"></i> Looking good</div>
  ${green.map(r=>renderRiskCard(r)).join('')}`:''}`;
}

function renderRiskCard(r){
  const {acct,bookie,risk}=r;
  const levelColors={
    red:{bg:'var(--bg-risk-red)',border:'rgba(248,113,113,0.4)',text:'#F87171',badge:'rgba(248,113,113,0.3)'},
    amber:{bg:'var(--bg-risk-amber)',border:'rgba(251,191,36,0.4)',text:'var(--text-warn)',badge:'rgba(251,191,36,0.3)'},
    green:{bg:'var(--bg-risk-green)',border:'rgba(34,197,94,0.4)',text:'var(--text-accent)',badge:'rgba(34,197,94,0.3)'},
  }[risk.level];
  const levelLabel={red:'High risk',amber:'Medium risk',green:'Low risk'}[risk.level];
  const barWidth=Math.round(risk.score);

  return`<div style="background:var(--bg-card);border:0.5px solid var(--border-col);border-left:2px solid ${levelColors.border};border-radius:12px;padding:14px;margin-bottom:8px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="font-size:14px;font-weight:500;color:var(--text-primary)">${bookie}</span>
          ${acctPill(acct)}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span style="font-size:11px;color:var(--text-muted)">${risk.txCount} bets</span>
          <span style="font-size:11px;color:var(--text-muted)">${Math.round(risk.mugRatio*100)}% mugged</span>
          ${risk.avgOdds>0?`<span style="font-size:11px;color:var(--text-muted)">avg odds ${risk.avgOdds.toFixed(2)}</span>`:''}
          <span style="font-size:11px;color:var(--text-muted)">£${risk.totalPnl.toFixed(0)} profit</span>
        </div>
      </div>
      <span style="background:${levelColors.bg};color:${levelColors.text};border:0.5px solid ${levelColors.border};padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;flex-shrink:0">${levelLabel}</span>
    </div>

    <div style="background:var(--bg-input);border-radius:4px;height:4px;margin-bottom:10px;overflow:hidden">
      <div style="background:${levelColors.text};height:100%;width:${barWidth}%;border-radius:4px;transition:width .5s"></div>
    </div>

    ${risk.flags.length?`<div style="display:flex;flex-direction:column;gap:4px">
      ${risk.flags.map(f=>`<div style="font-size:11px;color:${levelColors.text};display:flex;align-items:center;gap:5px"><i class="ti ti-point-filled" style="font-size:8px" aria-hidden="true"></i>${f}</div>`).join('')}
    </div>`:''}

    ${risk.level!=='green'?`<div style="margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border-col)">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.3px">Suggested action</div>
      <div style="font-size:12px;color:var(--text-secondary)">${getRiskAdvice(risk)}</div>
    </div>`:''}
  </div>`;
}

function getRiskAdvice(risk){
  const tips=[];
  if(risk.mugRatio<0.2)tips.push('Log more mug bets on this bookie — aim for 1 mug per 3–4 matched bets');
  if(!risk.hasLowOddsBets||risk.avgOdds>3.5)tips.push('Place some bets at lower odds (1.3–2.0) to look like a normal punter');
  if(risk.freeBetRatio>0.5)tips.push('Mix in more qualifying and mug bets alongside free bet usage');
  if(risk.totalPnl>300)tips.push('Consider a gradual withdrawal to avoid drawing attention');
  if(risk.betsPerWeek>15)tips.push('Reduce bet frequency — spread bets across more days');
  return tips.length?tips.join(' · '):'Keep logging mug bets regularly to maintain a natural pattern';
}

const CASINO_OFFER_TYPES=['Reload','Welcome','Free Spins','Cashback','Other'];

let _txCacheKey={}; // cache invalidation keys

let _casinoCacheKey='';
let casinoOfferType='';
let casinoPendingSpins=false;
let casinoHasDeposit=false;
let casinoOperator='JG';

function getCasinoSessions(){
  // Cache key includes total count AND a hash of deleted IDs
  const key=PROFILES.map(p=>(state[p].casino||[]).length).join('-')+JSON.stringify(casinoDeletedIds);
  if(_casinoCache&&_casinoCacheKey===key)return _casinoCache;
  const raw=[];
  PROFILES.forEach(p=>{
    const sessions=state[p].casino||[];
    const deletedSet=new Set((casinoDeletedIds[p]||[]).map(String));
    sessions.forEach(s=>{
      if(!deletedSet.has(String(s.id)))raw.push({...s,_acct:p});
    });
  });
  // Sort once and cache
  raw.sort((a,b)=>b.id-a.id);
  _casinoCache=raw;
  _casinoCacheKey=key;
  return _casinoCache;
}
function invalidateCasinoCache(){_casinoCache=null;_casinoCacheKey='';}

  const jgPnl=allSessions.reduce((a,s)=>{
    if(s.operator&&s.operator!=='JG')return a; // default to JG if no operator
    return a+sessionPnlAmt(s);

function renderDailyOffersTable(){
  const allSessions=getCasinoSessions();
  // Build the last 7 calendar days as DD/MM/YYYY strings, matching how
  // session dates are stored, most recent first.
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date();
    d.setDate(d.getDate()-i);
    const ds=[String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),d.getFullYear()].join('/');
    days.push(ds);
  }
  const counts={};
  days.forEach(ds=>{counts[ds]={jg:0,jp:0};});
  allSessions.forEach(s=>{
    if(!counts[s.date])return; // outside the 7-day window
    const op=s.operator==='JP'?'jp':'jg'; // default to JG if unset
    counts[s.date][op]++;
  });
  // Built as a CSS grid rather than the shared .data-table class — that
  // class carries a min-width:460px meant for wider multi-column tables,
  // which pushed the JP column off-screen on a phone with no way to
  // scroll to it. A 3-column grid fits naturally at any width instead.
  const headerRow='<div style="display:grid;grid-template-columns:1fr 60px 60px;gap:4px;padding:6px 0;border-bottom:0.5px solid var(--border-col)">'
    +'<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px">Day</div>'
    +'<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;text-align:center">JG</div>'
    +'<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;text-align:center">JP</div>'
    +'</div>';
  const rows=days.map((ds,i)=>{
    const label=i===0?'Today':i===1?'Yesterday':ds;
    const c=counts[ds];
    return '<div style="display:grid;grid-template-columns:1fr 60px 60px;gap:4px;padding:7px 0;border-bottom:0.5px solid var(--border-col2)">'
      +'<div style="font-size:12px;color:var(--text-secondary)">'+label+'</div>'
      +'<div style="text-align:center;font-size:13px;font-weight:500">'+c.jg+'</div>'
      +'<div style="text-align:center;font-size:13px;font-weight:500">'+c.jp+'</div>'
      +'</div>';
  }).join('');
  return '<div class="card" style="margin-bottom:12px">'
    +'<div class="card-header"><span class="card-title">Offers Completed — Last 7 Days</span></div>'
    +'<div style="padding:4px 14px 6px">'
    +headerRow+rows
    +'</div></div>';
}

function renderCasinoMonthly(){
  const allSessions=getCasinoSessions();
  const monthlyMap={};
  allSessions.forEach(s=>{
    const d=s.date||'';
    const parts=d.split('/');
    if(parts.length<3)return;
    const key=parts[2]+'-'+parts[1].padStart(2,'0');
    if(!monthlyMap[key])monthlyMap[key]={JG:0,JP:0,total:0};
    const pnl=(s.startBal!==undefined&&s.endBal!==undefined&&(s.startBal!==0||s.endBal!==0))?s.endBal-s.startBal:(s.netProfit||0);
    const op=s.operator||'JG';if(monthlyMap[key][op]===undefined)monthlyMap[key][op]=0;monthlyMap[key][op]+=pnl;
    monthlyMap[key].total+=pnl;
  });
  const monthKeys=Object.keys(monthlyMap).sort().reverse();
  if(!monthKeys.length)return '<div class="empty">No casino sessions yet</div>';
  // Built as a CSS grid rather than the shared .data-table class — same
  // reasoning as the Daily Offers table below it: .data-table carries a
  // min-width:460px meant for wider tables, which forced horizontal
  // scrolling here for no good reason on a 4-column table.
  const headerRow='<div style="display:grid;grid-template-columns:1fr 70px 70px 70px;gap:4px;padding:6px 0;border-bottom:0.5px solid var(--border-col)">'
    +'<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px">Month</div>'
    +'<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;text-align:right">JG</div>'
    +'<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;text-align:right">JP</div>'
    +'<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;text-align:right">Total</div>'
    +'</div>';
  const rows=monthKeys.map(k=>{
    const mo=monthlyMap[k];
    const label=k.slice(0,4)+'/'+k.slice(5);
    return '<div style="display:grid;grid-template-columns:1fr 70px 70px 70px;gap:4px;padding:7px 0;border-bottom:0.5px solid var(--border-col2)">'
      +'<div style="font-size:12px">'+label+'</div>'
      +'<div style="text-align:right;font-size:12px;color:'+(mo.JG>=0?'#22C55E':'#F87171')+'">'+fmtS(mo.JG)+'</div>'
      +'<div style="text-align:right;font-size:12px;color:'+(mo.JP>=0?'#22C55E':'#F87171')+'">'+fmtS(mo.JP)+'</div>'
      +'<div style="text-align:right;font-size:12px;font-weight:500;color:'+(mo.total>=0?'#22C55E':'#F87171')+'">'+fmtS(mo.total)+'</div>'
      +'</div>';
  }).join('');
  return '<div class="card" style="margin-bottom:12px">'
    +'<div class="card-header"><span class="card-title">Monthly Casino P&L by Operator</span></div>'
    +'<div style="padding:4px 14px 6px">'
    +headerRow+rows
    +'</div></div>'
    +renderDailyOffersTable();
}

let indexCasinoSummaryOp='JP'; // shared toggle for the rolling progress + rolling by-casino cards below

function renderCasinoRollingProgress(){
  const sessionPnl=s=>(s.startBal!==undefined&&s.endBal!==undefined&&(s.startBal!==0||s.endBal!==0))?s.endBal-s.startBal:(s.netProfit||0);
  const sessions=getCasinoSessions().filter(s=>(s.operator||'JG')===indexCasinoSummaryOp);
  const parseDMY=d=>{const p=(d||'').split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):null;};
  const cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-13); // today + previous 13 = 14 total

  const windowSessions=sessions.filter(s=>{const d=parseDMY(s.date);return d&&d>=cutoff;});
  const windowTotal=windowSessions.reduce((a,s)=>a+sessionPnl(s),0);

  const daily={};
  windowSessions.forEach(s=>{
    if(!daily[s.date])daily[s.date]={count:0,pnl:0,sortDate:parseDMY(s.date)};
    daily[s.date].count+=1;
    daily[s.date].pnl+=sessionPnl(s);
  });
  const days=Object.keys(daily).sort((a,b)=>daily[b].sortDate-daily[a].sortDate); // most recent first (left)
  const maxAbs=Math.max(1,...days.map(d=>Math.abs(daily[d].pnl)));

  const bars=days.map(d=>{
    const v=daily[d].pnl;
    const h=Math.max(3,Math.round(Math.abs(v)/maxAbs*44));
    const dayNum=d.split('/')[0];
    return'<div class="month-col">'
      +'<div class="month-val '+(v>=0?'pos':'neg')+'">'+(v>=0?'+':'')+Math.round(v)+'</div>'
      +'<div class="month-bar '+(v>=0?'pos':'neg')+'" style="height:'+h+'px"></div>'
      +'<div class="month-lbl">'+dayNum+'</div>'
      +'<div style="font-size:8px;color:var(--text-muted);font-weight:500">'+daily[d].count+'×</div>'
      +'</div>';
  }).join('');

  const toggle='<div style="display:flex;gap:5px">'
    +'<button onclick="indexCasinoSummaryOp=\'JG\';document.getElementById(\'main-content\').innerHTML=renderCasino()" class="profile-btn '+(indexCasinoSummaryOp==='JG'?'active-jg':'')+'" style="font-size:11px;padding:4px 10px">JG</button>'
    +'<button onclick="indexCasinoSummaryOp=\'JP\';document.getElementById(\'main-content\').innerHTML=renderCasino()" class="profile-btn '+(indexCasinoSummaryOp==='JP'?'active-hg':'')+'" style="font-size:11px;padding:4px 10px">JP</button>'
    +'</div>';

  return '<div class="card" style="margin-bottom:12px">'
    +'<div class="card-header"><span class="card-title">Progress — Last 14 Days</span>'+toggle+'</div>'
    +'<div style="padding:10px 14px">'
    +'<div class="metric-value '+(windowTotal>=0?'pos':'neg')+'">'+fmtS(windowTotal)+'</div>'
    +'<div class="metric-sub">'+windowSessions.length+' sessions</div>'
    +(days.length?'<div class="month-wrap" style="margin-top:14px">'+bars+'</div>':'<div style="font-size:12px;color:var(--text-muted);margin-top:10px">No sessions in the last 14 days</div>')
    +'</div></div>';
}

function renderCasinoSummaryView(){
  const allSessions=getCasinoSessions();
  const sessionPnl=s=>(s.startBal!==undefined&&s.endBal!==undefined&&(s.startBal!==0||s.endBal!==0))?s.endBal-s.startBal:(s.netProfit||0);

  // Split by operator — default to JG if no operator field (old sessions)
  const jgSessions=allSessions.filter(s=>!s.operator||s.operator==='JG');
  const jpSessions=allSessions.filter(s=>s.operator==='JP');
  const jgPnl=jgSessions.reduce((a,s)=>a+sessionPnl(s),0);
  const jpPnl=jpSessions.reduce((a,s)=>a+sessionPnl(s),0);
  const totalPnl=jgPnl+jpPnl;
  const totalSessions=allSessions.length;

  // By casino, rolling last 14 days — filtered to the shared toggle
  const parseDMY2=d=>{const p=(d||'').split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):null;};
  const cutoff14=new Date();cutoff14.setHours(0,0,0,0);cutoff14.setDate(cutoff14.getDate()-13);
  const casinoMap14={};
  allSessions.filter(s=>(s.operator||'JG')===indexCasinoSummaryOp).forEach(s=>{
    if(!s.casino)return;
    const d=parseDMY2(s.date);
    if(!d||d<cutoff14)return;
    if(!casinoMap14[s.casino])casinoMap14[s.casino]={pnl:0,count:0};
    casinoMap14[s.casino].pnl+=sessionPnl(s);
    casinoMap14[s.casino].count+=1;
  });
  const entries14=Object.entries(casinoMap14).sort((a,b)=>b[1].pnl-a[1].pnl);

  // By casino, all-time (unfiltered by operator, matches existing behaviour)
  const casinoMap={};
  allSessions.forEach(s=>{
    if(!s.casino)return;
    casinoMap[s.casino]=(casinoMap[s.casino]||0)+sessionPnl(s);
  });
  const entries=Object.entries(casinoMap).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return '<div class="empty">No casino sessions yet</div>';

  const rows=entries.map(([casino,pnl])=>'<div class="list-row">'
    +'<div class="list-row-left"><div class="list-row-title" style="font-size:12px">'+(casino||'Unknown')+'</div></div>'
    +'<div class="list-row-right" style="color:'+(pnl>=0?'#22C55E':'#F87171')+';font-size:12px">'+fmtS(pnl)+'</div>'
    +'</div>').join('');

  const toggle14='<div style="display:flex;gap:5px">'
    +'<button onclick="indexCasinoSummaryOp=\'JG\';document.getElementById(\'main-content\').innerHTML=renderCasino()" class="profile-btn '+(indexCasinoSummaryOp==='JG'?'active-jg':'')+'" style="font-size:11px;padding:4px 10px">JG</button>'
    +'<button onclick="indexCasinoSummaryOp=\'JP\';document.getElementById(\'main-content\').innerHTML=renderCasino()" class="profile-btn '+(indexCasinoSummaryOp==='JP'?'active-hg':'')+'" style="font-size:11px;padding:4px 10px">JP</button>'
    +'</div>';
  const rows14=entries14.length
    ?entries14.map(([casino,d])=>'<div class="list-row">'
      +'<div class="list-row-left"><div class="list-row-title" style="font-size:12px">'+(casino||'Unknown')+'</div>'
      +'<div style="font-size:10px;color:var(--text-muted)">'+d.count+' session'+(d.count===1?'':'s')+'</div></div>'
      +'<div class="list-row-right" style="color:'+(d.pnl>=0?'#22C55E':'#F87171')+';font-size:12px">'+fmtS(d.pnl)+'</div>'
      +'</div>').join('')
    :'<div class="empty">No '+indexCasinoSummaryOp+' sessions in the last 14 days</div>';

  return renderCasinoRollingProgress()
    +'<div class="metric-card" style="margin-bottom:12px">'
    +'<div class="metric-label"><i class="ti ti-cards" aria-hidden="true"></i>Combined Casino Summary</div>'
    +'<div class="metric-value '+(totalPnl>=0?'pos':'neg')+'">'+fmtS(totalPnl)+'</div>'
    +'<div class="metric-sub">'+totalSessions+' total sessions</div>'
    +'<div style="margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border-col);display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    +'<div style="background:var(--border-col2);border-radius:8px;padding:10px">'
    +'<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">JG</div>'
    +'<div style="font-size:16px;font-weight:500;color:'+(jgPnl>=0?'#22C55E':'#F87171')+'">'+fmtS(jgPnl)+'</div>'
    +'<div style="font-size:11px;color:var(--text-muted);margin-top:2px">'+jgSessions.length+' sessions</div>'
    +'</div>'
    +'<div style="background:var(--border-col2);border-radius:8px;padding:10px">'
    +'<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">JP</div>'
    +'<div style="font-size:16px;font-weight:500;color:'+(jpPnl>=0?'#22C55E':'#F87171')+'">'+fmtS(jpPnl)+'</div>'
    +'<div style="font-size:11px;color:var(--text-muted);margin-top:2px">'+jpSessions.length+' sessions</div>'
    +'</div>'
    +'</div></div>'
    +'<div class="card" style="margin-bottom:12px">'
    +'<div class="card-header"><span class="card-title">By Casino — Last 14 Days</span>'+toggle14+'</div>'
    +rows14
    +'</div>'
    +'<div class="card">'
    +'<div class="card-header"><span class="card-title">By Casino — All Time</span></div>'
    +rows
    +'</div>';
}

function calcQuick(){
  const bs=parseFloat(document.getElementById('qc-stake')?.value)||0;
  const bo=parseFloat(document.getElementById('qc-bodds')?.value)||0;
  const lo=parseFloat(document.getElementById('qc-lodds')?.value)||0;
  const commPct=parseFloat(document.getElementById('qc-comm')?.value)||0;
  const c=commPct/100; // decimal form for the maths below
  // Store values for re-render preservation
  window._qcStake=bs||'';
  window._qcBodds=bo||'';
  window._qcLodds=lo||'';
  window._qcComm=commPct||'';

  const res=document.getElementById('qc-results');
  const btn=document.getElementById('qc-log-btn');
  if(!bs||!bo||!lo){if(res)res.style.display='none';if(btn)btn.style.display='none';return;}

  const isFB=calcBetType==='Free Bet';
  const isUL=calcStrategy==='underlay';
  let layStake,winPnl,losePnl;

  // Commission only ever affects a branch where the LAY side actually
  // wins (i.e. exchange charges its cut on your lay winnings) — a
  // losing lay is never charged commission. That's why only some
  // branches below change when c>0; each has been checked to reduce
  // exactly to the original (pre-commission) formula when c=0.
  if(isUL){
    if(!isFB){
      // Underlay lay stake is deliberately just the back stake — not a
      // full hedge, that's the point of the strategy — so commission
      // doesn't change what to lay, only the "if loses" outcome, since
      // that's the branch where the lay wins.
      layStake=bs;
      winPnl=bs*(bo-lo); // lay loses here — no commission impact
      losePnl=layStake*(1-c)-bs; // was flat £0 — now reflects the real commission cost
    }else{
      // SNR underlay: same reasoning — the smaller-than-full-hedge lay
      // stake is intentional, only the lay-wins outcome changes.
      layStake=lo>1&&bo>2?bs*(bo-2)/(lo-1):0;
      winPnl=bs; // lay loses here — no commission impact
      losePnl=layStake*(1-c); // was flat layStake — now net of commission
    }
  }else{
    if(!isFB){
      // Standard lock-in: lay stake itself needs adjusting so both
      // outcomes are genuinely equal once commission is real — that's
      // the whole point of a "lock". S = B*O/(L-c); reduces to the
      // original B*O/L exactly when c=0.
      layStake=(lo-c)>0?bs*bo/(lo-c):0;
      winPnl=bs*(bo-1)-layStake*(lo-1);
      losePnl=layStake*(1-c)-bs;
    }else{
      // Free bet lock-in: same principle, S=(O-1)*B/(L-c).
      layStake=(lo-c)>0?(bo-1)*bs/(lo-c):0;
      winPnl=(bo-1)*bs-layStake*(lo-1);
      losePnl=layStake*(1-c);
    }
  }

  const lsEl=document.getElementById('qc-laystake');
  const winEl=document.getElementById('qc-win');
  const loseEl=document.getElementById('qc-lose');

  if(lsEl)lsEl.textContent='£'+layStake.toFixed(2);
  if(winEl){winEl.textContent=fmtS(winPnl);winEl.style.color=winPnl>=0?'#22C55E':'#F87171';}
  if(loseEl){loseEl.textContent=fmtS(losePnl);loseEl.style.color=losePnl>0?'#22C55E':losePnl<0?'#F87171':'#9A9590';}

  if(res)res.style.display='block';
  if(btn)btn.style.display='block';
  const copyBtn=document.getElementById('qc-copy-btn');
  if(copyBtn)copyBtn.style.display='inline-flex';
}

// ── BACKUP ───────────────────────────────────────────────────────────────────
function buildFullBackup(){
  return{
    version:2,
    exportedAt:new Date().toISOString(),
    exportedBy:'MBWorld',
    state:{
      exchanges:state.exchanges,
      profiles:Object.fromEntries(PROFILES.map(pr=>[pr,{
        bank:state[pr].bank,
        bookies:state[pr].bookies,
        transactions:state[pr].transactions,
        freeBets:state[pr].freeBets||[],
        casino:state[pr].casino||[]
      }]))
    }
  };
}

async function downloadBackup(){
  showToast('Preparing backup…','info');
  try{
    // Use server-side backup — reads directly from KV, always complete
    const res=await fetch('/api/backup');
    if(!res.ok)throw new Error('Backup failed: '+res.status);
    const json=await res.json();
    const blob=new Blob([JSON.stringify(json,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const date=todayStr().replace(/\//g,'-');
    a.href=url;a.download=`mbworld-backup-${date}.json`;a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem('mbe_last_backup',Date.now().toString());
    showToast('Full backup downloaded ✓ (includes casino)');
    updateBackupStatus();
  }catch(e){
    // Fallback to local backup
    const backup=buildFullBackup();
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const date=todayStr().replace(/\//g,'-');
    a.href=url;a.download=`mbworld-backup-${date}.json`;a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem('mbe_last_backup',Date.now().toString());
    showToast('Backup downloaded (local)');
    updateBackupStatus();
  }
}

function getLastBackupDays(){
  const last=localStorage.getItem('mbe_last_backup');
  if(!last)return null;
  return Math.floor((Date.now()-parseInt(last))/86400000);
}

function updateBackupStatus(){
  const el=document.getElementById('backup-status');
  if(!el)return;
  const days=getLastBackupDays();
  if(days===null){el.textContent='Never backed up';el.style.color='#F87171';}
  else if(days===0){el.textContent='Backed up today';el.style.color='#22C55E';}
  else if(days<=7){el.textContent=`Last backup ${days}d ago`;el.style.color='#22C55E';}
  else if(days<=14){el.textContent=`Last backup ${days}d ago`;el.style.color='#F0A500';}
  else{el.textContent=`Last backup ${days}d ago — overdue`;el.style.color='#F87171';}
}

function checkAutoBackup(){
  // Auto-backup: trigger on first Monday open if last backup > 6 days ago
  const now=new Date();
  const isMonday=now.getDay()===1;
  const days=getLastBackupDays();
  const lastAutoCheck=localStorage.getItem('mbe_auto_backup_check');
  const todayKey=now.toISOString().slice(0,10);
  if(lastAutoCheck===todayKey)return; // already checked today
  localStorage.setItem('mbe_auto_backup_check',todayKey);
  if(isMonday&&(days===null||days>6)){
    // Show backup prompt after 3 seconds
    setTimeout(function(){
      showBackupPrompt();
    },3000);
  }
}

function showBackupPrompt(){
  const days=getLastBackupDays();
  const msg=days===null?'You have never backed up your data.':'Your last backup was '+days+' days ago.';
  document.getElementById('modal-root').innerHTML=
    '<div class="modal-bg">'    +'<div class="modal">'    +'<div class="modal-handle"></div>'    +'<div class="modal-title">Weekly Backup</div>'    +'<div class="modal-sub">'+msg+' Download a full backup now?</div>'    +'<div style="background:var(--bg-card);border-radius:10px;padding:12px 14px;margin-bottom:16px">'    +'<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">Your backup includes:</div>'    +'<div style="font-size:12px;color:var(--text-secondary)">All transactions · Bookie balances · Casino sessions · Free bets · Exchange balances</div>'    +'</div>'    +'<div class="modal-actions">'    +'<button class="btn btn-primary" style="flex:1" onclick="downloadBackup();closeModal()"><i class="ti ti-download"></i> Download backup</button>'    +'<button class="btn btn-ghost" onclick="localStorage.setItem(\'mbe_last_backup\',Date.now().toString());closeModal()">Skip for now</button>'    +'</div>'    +'</div></div>';
}

  if(currentTab==='dashboard'){
    try{

      el.innerHTML=renderDashboard();
      const qs=document.getElementById('qc-stake');if(qs&&_s)qs.value=_s;
      const qb=document.getElementById('qc-bodds');if(qb&&_b)qb.value=_b;
      const ql=document.getElementById('qc-lodds');if(ql&&_l)ql.value=_l;
      if(_s&&_b&&_l)calcQuick();
      setTimeout(initMonthlyChart,80);
      // Casino portion of Combined P&L: blocks on first-ever load (see
      // ensureCasinoLoaded), then silently refreshes in the background
      // on later visits if the cached data's gone stale — so a long-
      // running session (or a browser that suspends/resumes rather than
      // truly reloading) doesn't get permanently stuck on data from
      // whenever it first loaded.
      if(!casinoDataLoaded){
        ensureCasinoLoaded(()=>{ if(currentTab==='dashboard')render(); });
      }else{
        refreshCasinoIfStale(()=>{ if(currentTab==='dashboard')render(); });
      }
    }catch(e){
      el.innerHTML='<div style="padding:20px;color:#F87171;font-size:13px">Error: '+e.message+'</div>';
    }
  }
  else if(currentTab==='pending')el.innerHTML=renderPending();
  else if(currentTab==='trade'){
    el.innerHTML=renderTrade();
    if(tradeSubTab==='log')setTimeout(bindFormEvents,50);
  }
  else if(currentTab==='accounts')el.innerHTML=renderAccounts();
  else if(currentTab==='casino'){
    if(casinoDataLoaded){
      el.innerHTML=renderCasino();
      // Render instantly from whatever's cached, then quietly check for
      // anything newer in the background — no spinner, just a silent
      // re-render if something actually changed.
      refreshCasinoIfStale(()=>{ if(currentTab==='casino')render(); });
    }else{
      el.innerHTML='<div class="loading" style="padding:60px 20px;text-align:center;color:var(--text-muted)"><div class="spinner"></div><div style="margin-top:10px;font-size:13px">Loading casino data…</div></div>';
      ensureCasinoLoaded(()=>{ if(currentTab==='casino')render(); });
    }
  }
  else el.innerHTML=renderDashboard();
  updateBadge();
}

function switchTab(t){
  currentTab=t;
  const pb=document.getElementById('profile-bar');
  if(pb)pb.style.display=(t==='dashboard'||t==='trade'||t==='casino')?'none':'flex';
  render();window.scrollTo(0,0);
}

function switchTradeTab(i){
  tradeSubTab=i===1?'history':'log';
  currentTab='trade';
  const mc=document.getElementById('main-content');
  if(mc)mc.innerHTML=renderTrade();
  window._txPage=0;if(tradeSubTab==='log')setTimeout(bindFormEvents,50);
  updateBadge();
}

function setAccountsTab(i){
  window._accountsSubTab=['accounts','risk','reports'][i];
  currentTab='accounts';
  document.getElementById('main-content').innerHTML=renderAccounts();
  if(i===2)setTimeout(updateBackupStatus,50);
}

function setCasinoView(i){
  casinoView=['log','history','monthly','summary'][i];
  currentTab='casino';
  const viewEl=document.getElementById('casino-view');
  if(viewEl){
    let viewHtml='';
    if(casinoView==='log')viewHtml=renderCasinoForm();
    else if(casinoView==='history')viewHtml=renderCasinoHistory();
    else if(casinoView==='monthly')viewHtml=renderCasinoMonthly();
    else viewHtml=renderCasinoSummaryView();
    viewEl.innerHTML=viewHtml;
    ['log','history','monthly','summary'].forEach(function(t){
      const btn=document.getElementById('casino-tab-'+t);
      if(btn)btn.className='btn '+(casinoView===t?'btn-primary':'btn-ghost');
    });
  } else { render(); }
}

function renderTrade(){
  const logActive=tradeSubTab==='log';
  const histActive=tradeSubTab==='history';
  const tabs='<div style="display:flex;gap:8px;margin-bottom:14px">'
    +'<button onclick="switchTradeTab(0)" class="btn '+(logActive?'btn-primary':'btn-ghost')+'" style="flex:1;padding:10px">Log</button>'
    +'<button onclick="switchTradeTab(1)" class="btn '+(histActive?'btn-primary':'btn-ghost')+'" style="flex:1;padding:10px">History</button>'
    +'</div>';
  if(histActive)return tabs+renderHistory();
  return tabs+renderAdd();
}

function renderAccounts(){
  const accountsSubTab=window._accountsSubTab||'accounts';
  const subBar='<div style="display:flex;gap:6px;margin-bottom:14px">'
    +'<button onclick="setAccountsTab(0)" class="btn '+(accountsSubTab==='accounts'?'btn-primary':'btn-ghost')+'" style="flex:1;padding:9px;font-size:12px">Accounts</button>'
    +'<button onclick="setAccountsTab(1)" class="btn '+(accountsSubTab==='risk'?'btn-primary':'btn-ghost')+'" style="flex:1;padding:9px;font-size:12px">Risk</button>'
    +'<button onclick="setAccountsTab(2)" class="btn '+(accountsSubTab==='reports'?'btn-primary':'btn-ghost')+'" style="flex:1;padding:9px;font-size:12px">Reports</button>'
    +'</div>';
  if(accountsSubTab==='risk')return subBar+renderRisk();
  if(accountsSubTab==='reports')return subBar+renderReports();
  return subBar+renderAccountsMain();
}

function renderCasinoForm(){
  const acctBtns=PROFILES.map(function(pr){
    return '<button class="acct-sel-btn '+(casinoFormAcct===pr?'active-'+pr:'')+'" onclick="casinoFormAcct=\''+pr+'\';setCasinoView(0)">'+profileLabel(pr)+'</button>';
  }).join('');
  const style2=getComputedStyle(document.documentElement);
  const inputBg2=style2.getPropertyValue('--bg-input').trim();
  const accentCol=style2.getPropertyValue('--text-accent').trim();
  const jgBg=casinoOperator==='JG'?inputBg2:inputBg2;
  const jgCol=casinoOperator==='JG'?accentCol:'var(--text-muted)';
  const jpBg=casinoOperator==='JP'?inputBg2:inputBg2;
  const jpCol=casinoOperator==='JP'?accentCol:'var(--text-muted)';
  return '<div class="card"><div class="card-header"><span class="card-title">Log casino session</span></div>'
    +'<div class="card-body" style="padding-bottom:80px">'
    +'<div class="form-section"><div class="form-label">Account</div><div class="acct-selector">'+acctBtns+'</div></div>'
    +'<div style="margin-bottom:10px"><div class="form-label">Operator</div><div style="display:flex;gap:6px">'
    +'<button onclick="casinoOperator=\'JG\';setCasinoView(0)" style="flex:1;padding:9px;border-radius:8px;border:0.5px solid var(--border-col);background:'+jgBg+';color:'+jgCol+';font-family:system-ui;font-size:13px;font-weight:500;cursor:pointer">JG</button>'
    +'<button onclick="casinoOperator=\'JP\';setCasinoView(0)" style="flex:1;padding:9px;border-radius:8px;border:0.5px solid var(--border-col);background:'+jpBg+';color:'+jpCol+';font-family:system-ui;font-size:13px;font-weight:500;cursor:pointer">JP</button>'
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:120px 1fr;gap:8px;margin-bottom:8px">'
    +'<div class="form-group"><div class="form-label">Date</div><input type="text" id="c-date" value="'+todayStr()+'" style="font-size:12px"/></div>'
    +'<div class="form-group"><div class="form-label">Casino / Bookie</div><div style="position:relative">'
    +'<input type="text" id="c-casino-search" placeholder="Search..." autocomplete="off" oninput="filterCasinoBookies(this.value)" onfocus="showCasinoBookies()"/>'
    +'<input type="hidden" id="c-casino" value=""/>'
    +'<div id="casino-bookie-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--bg-input);border:0.5px solid rgba(255,255,255,0.10);border-radius:8px;margin-top:3px;max-height:180px;overflow-y:auto"></div>'
    +'</div></div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'
    +'<div class="form-group"><div class="form-label">Starting Balance</div><input type="number" id="c-start-bal" placeholder="0.00" step="0.01" inputmode="decimal" oninput="updateCasinoNet()"/></div>'
    +'<div class="form-group"><div class="form-label">Ending Balance</div><input type="number" id="c-end-bal" placeholder="0.00" step="0.01" inputmode="decimal" oninput="updateCasinoNet()"/></div>'
    +'</div>'
    +'<div style="background:var(--bg-input);border-radius:8px;padding:12px;margin-bottom:8px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center">'
    +'<span style="font-size:12px;color:var(--text-secondary)">P&L</span>'
    +'<span id="c-net" style="font-size:20px;font-weight:500;color:#22C55E">£0.00</span>'
    +'</div></div>'
    +'<div class="form-group"><div class="form-label">Notes</div><input type="text" id="c-notes" placeholder="optional"/></div>'
    +'<div id="c-msg" style="font-size:12px;color:#F87171;margin-top:6px"></div>'
    +'</div>'
    +'<div style="position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));left:0;right:0;padding:10px 16px;background:var(--bg-card);border-top:0.5px solid var(--border-col);display:flex;gap:8px;z-index:90;max-width:680px;margin:0 auto">'
    +'<button class="btn btn-ghost" onclick="resetCasinoForm()" style="width:72px">Clear</button>'
    +'<button class="btn btn-primary btn-full" onclick="saveCasinoSession()"><i class="ti ti-check"></i> Save session</button>'
    +'</div></div>';
}


function showCasinoBookies(){
  filterCasinoBookies(document.getElementById('c-casino-search')?.value||'');
}

function filterCasinoBookies(q){
  const dd=document.getElementById('casino-bookie-dropdown');
  if(!dd)return;
  const bookies=Object.keys(state[casinoFormAcct]?.bookies||{}).sort();
  const filtered=q?bookies.filter(function(b){return b.toLowerCase().includes(q.toLowerCase());}):bookies;
  if(!filtered.length){dd.style.display='none';return;}
  dd.innerHTML=filtered.map(function(b){
    const safe=b.replace(/'/g,"&#39;");
    return '<div onclick="selectCasinoBook(\''+safe+'\')" style="padding:8px 12px;cursor:pointer;font-size:13px;color:var(--text-primary);border-bottom:0.5px solid var(--border-col2)">'+b+'</div>';
  }).join('');
  dd.style.display='block';
}

function selectCasinoBook(name){
  const s=document.getElementById('c-casino-search');
  const h=document.getElementById('c-casino');
  const dd=document.getElementById('casino-bookie-dropdown');
  if(s)s.value=name;
  if(h)h.value=name;
  if(dd)dd.style.display='none';
  // Auto-fill starting balance from this bookie's currently tracked
  // balance for the selected profile, since that's almost always what
  // you're about to sit down with.
  const startBalEl=document.getElementById('c-start-bal');
  const bal=state[casinoFormAcct]?.bookies?.[name]?.bal;
  if(startBalEl&&bal!==undefined){
    startBalEl.value=Number(bal).toFixed(2);
    updateCasinoNet();
  }
}

function updateCasinoNet(){
  const startBal=parseFloat(document.getElementById('c-start-bal')?.value)||0;
  const endBal=parseFloat(document.getElementById('c-end-bal')?.value)||0;
  const net=endBal-startBal;
  const el=document.getElementById('c-net');
  if(el){el.textContent=fmtS(net);el.style.color=net>=0?'#22C55E':'#F87171';}
}

function saveCasinoSession(){
  const msg=document.getElementById('c-msg');
  const casino=document.getElementById('c-casino')?.value||(document.getElementById('c-casino-search')?.value?.trim()||'');
  if(!casino){if(msg)msg.textContent='Select a casino / bookie.';return;}
  const startBal=parseFloat(document.getElementById('c-start-bal')?.value)||0;
  const endBal=parseFloat(document.getElementById('c-end-bal')?.value)||0;
  const net=endBal-startBal;
  const p=state[casinoFormAcct];
  if(!p.bookies[casino])p.bookies[casino]={bal:0,status:'Active',notes:''};
  p.bookies[casino].bal=(p.bookies[casino].bal||0)+net;p.bookies[casino].balUpdatedAt=Date.now();
  if(!p.casino)p.casino=[];
  p.casino.push({
    id:Date.now(),
    date:document.getElementById('c-date')?.value||todayStr(),
    casino,operator:casinoOperator,startBal,endBal,netProfit:net,
    notes:document.getElementById('c-notes')?.value||'',_acct:casinoFormAcct,
    csUpdatedAt:Date.now(),
  });
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveCasinoOnly('casinoSession');
  invalidateCasinoCache();showToast('Casino session saved!');
  // Smart update: only re-render casino tab content
  if(currentTab==='casino'){
    casinoView='history'; // switch to history to show what was just saved
    const mc=document.getElementById('main-content');
    if(mc)mc.innerHTML=renderCasino();
  }else{render();}
}

function resetCasinoForm(){
  casinoOperator='JG';
  ['c-casino','c-casino-search','c-start-bal','c-end-bal','c-notes'].forEach(function(id){
    const el=document.getElementById(id);if(el)el.value='';
  });
  const d=document.getElementById('c-date');if(d)d.value=todayStr();
  const dd=document.getElementById('casino-bookie-dropdown');if(dd)dd.style.display='none';
  const net=document.getElementById('c-net');if(net){net.textContent='£0.00';net.style.color='#22C55E';}
  setCasinoView(0);
}

function deleteCasinoSession(acct,id){
  if(!confirm('Delete this casino session?'))return;
  // Find session across ALL profiles - use _acct from session, not just parameter
  let realAcct=acct;
  let session=null;
  PROFILES.forEach(pr=>{
    const found=(state[pr].casino||[]).find(s=>String(s.id)===String(id));
    if(found){session=found;realAcct=pr;}
  });
  if(session){
    const p=state[realAcct];
    const casino=session.casino;
    const pnl=(session.startBal!==undefined&&session.endBal!==undefined&&(session.startBal!==0||session.endBal!==0))?session.endBal-session.startBal:(session.netProfit||0);
    if(p.bookies&&p.bookies[casino]){
      p.bookies[casino].bal=(p.bookies[casino].bal||0)-pnl;
      p.bookies[casino].balUpdatedAt=Date.now();
    }
    state[realAcct].casino=(state[realAcct].casino||[]).filter(s=>String(s.id)!==String(id));
  }
  // Track deleted ID on all profiles to prevent server restore
  PROFILES.forEach(pr=>{
    if(!casinoDeletedIds[pr])casinoDeletedIds[pr]=[];
    casinoDeletedIds[pr].push(id);
  });
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveCasinoOnly('deleteCasino');
  invalidateCasinoCache();showToast('Session deleted');
  // Smart update: remove just that row
  const casinoRow=document.querySelector('tr[data-csid="'+id+'"]');
  if(casinoRow){
    casinoRow.style.transition='opacity .2s';casinoRow.style.opacity='0';
    setTimeout(function(){casinoRow.remove();},200);
  }else{setCasinoView(1);}
}

// Prevent scroll wheel changing number inputs
document.addEventListener('wheel', function(e){
  if(document.activeElement&&document.activeElement.type==='number'){
    document.activeElement.blur();
  }
}, {passive:false});

async function loadApp(){
  window._appLoading=true;
  restoreQueue();
  // Restore visibility — hidden by default unless user has explicitly shown
  const savedVis=localStorage.getItem('mbe_dash_hidden');
  _dashHidden=savedVis===null?true:savedVis==='1';
  // Restore theme
  const savedTheme=localStorage.getItem('mbe_theme')||'stone';
  _theme=savedTheme;
  document.documentElement.setAttribute('data-theme',savedTheme==='dark'?'':savedTheme); // restore any queued saves from last session
  // Version check — clear localStorage cache if bookie list version changed
  const BOOKIE_VERSION='v10';
  if(localStorage.getItem('mbe_bookie_ver')!==BOOKIE_VERSION){
    localStorage.removeItem('mbe_state');
    localStorage.setItem('mbe_bookie_ver',BOOKIE_VERSION);
  }
  try{
    await loadData();
    // migrateLegacy runs inside fetchFromServer after server data loads
  }catch(e){
    console.error('Load failed:',e);
  }finally{
    window._appLoading=false;
  }
  const pb=document.getElementById('profile-bar');if(pb)pb.style.display='none';
  switchProfile('jg');
  render();
  checkAutoBackup();
  // Now drain any queued saves - app is fully loaded
  if(_saveQueue.length){
    console.log('Draining',_saveQueue.length,'queued saves after load');
    setTimeout(drainQueue, 2000);
  }
}

function checkPin(){
  if(sessionStorage.getItem('mbe_unlocked')==='1'){
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('app-content').style.display='block';
    loadApp();
    return;
  }
  const pinKey='0069';
  const ps=document.getElementById('pin-screen');
  ps.style.cssText='display:flex;position:fixed;inset:0;background:var(--bg-card2);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px';
  ps.innerHTML=`
    <div style="font-size:22px;font-weight:500;color:var(--text-primary);margin-bottom:8px">MBWorld</div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:32px">Enter PIN to continue</div>
    <div id="pin-dots" style="display:flex;gap:12px;margin-bottom:32px">
      ${[0,1,2,3].map(i=>'<div style="width:14px;height:14px;border-radius:50%;border:2px solid var(--text-primary);background:transparent" id="pd'+i+'"></div>').join('')}
    </div>
    <div id="pin-error" style="font-size:12px;color:#F87171;margin-bottom:16px;min-height:18px"></div>
    <div style="display:grid;grid-template-columns:repeat(3,72px);gap:12px">
      ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(d=>`<button onclick="pinPress('${d}')" style="height:72px;border-radius:50%;border:0.5px solid var(--border-col);background:var(--bg-card);color:var(--text-primary);font-size:${d==='⌫'?'20':'22'}px;font-weight:500;font-family:system-ui,-apple-system,sans-serif;cursor:pointer;${d===''?'visibility:hidden':''}">${d}</button>`).join('')}
    </div>`;
  let entry='';
  window.pinPress=function(d){
    if(d==='⌫'){entry=entry.slice(0,-1);}
    else if(d!==''){entry+=d;}
    for(let i=0;i<4;i++){
      const dot=document.getElementById('pd'+i);
      if(dot)dot.style.background=i<entry.length?'var(--text-primary)':'transparent';if(dot)dot.style.borderColor='var(--text-primary)';
    }
    if(entry.length===4){
      if(entry===pinKey){
        sessionStorage.setItem('mbe_unlocked','1');
        ps.style.display='none';
        document.getElementById('app-content').style.display='block';
        loadApp();
      }else{
        document.getElementById('pin-error').textContent='Incorrect PIN';
        entry='';
        for(let i=0;i<4;i++){const dot=document.getElementById('pd'+i);if(dot)dot.style.background='transparent';}
      }
    }
  };
}

async function init(){
  checkPin();
}

// Auto-drain queue when connection returns
window.addEventListener('online',function(){
  if(_saveQueue.length){
    showToast('Connection restored — syncing '+_saveQueue.length+' pending save'+(_saveQueue.length>1?'s':''));
    drainQueue();
  }
});
window.addEventListener('offline',function(){
  setSyncStatus('error');
  showToast('⚠ You are offline — saves will queue','error');
});

// Covers the case where the browser suspends/resumes the page (bfcache)
// rather than truly reloading it — e.g. some mobile browsers on "close
// and reopen" — where no other code would run at all, so nothing would
// ever get the chance to check whether casino data has gone stale. A
// resumed page runs no code on its own; this is what gives it that
// chance without requiring a genuine full reload.
window.addEventListener('pageshow',function(e){
  if(e.persisted){
    if(currentTab==='casino'||currentTab==='dashboard')render();
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  });
}
init();
</script>
