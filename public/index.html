<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="MBWorld"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<title>MBWorld</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}

/* ── THEMES ────────────────────────────────────── */
:root{
  --bg-page:var(--bg-page);
  --bg-card:var(--bg-card);
  --bg-input:var(--bg-input);
  --bg-card2:var(--bg-card2);
  --bg-input2:var(--bg-input2);
  --bg-risk-red:#791F1F;
  --bg-risk-amber:#5C3800;
  --bg-risk-green:#14532D;
  --text-primary:var(--text-primary);
  --text-secondary:var(--text-secondary);
  --text-muted:var(--text-muted);
  --text-accent:#22C55E;
  --text-neg:#F87171;
  --text-warn:#F0A500;
  --border-col:rgba(255,255,255,0.09);
  --border-col2:rgba(255,255,255,0.07);
  --border-col3:var(--border-col3);
  --tab-bg:var(--bg-card);
  --tab-border:rgba(255,255,255,0.09);
  --overlay:rgba(0,0,0,0.6);
  --modal-handle:rgba(255,255,255,0.09);
  --toast-bg:#22C55E;
  --pill-bg:rgba(255,255,255,0.08);
}
[data-theme="stone"]{
  --bg-page:#F5F0E8;
  --bg-card:#EDE8DF;
  --bg-input:#E2DDD4;
  --bg-card2:#F5F0E8;
  --bg-input2:#D8D2C8;
  --bg-risk-red:#FECACA;
  --bg-risk-amber:#FEF3C7;
  --bg-risk-green:#D1FAE5;
  --text-primary:#1A1A1A;
  --text-secondary:#3D3830;
  --text-muted:#6B6560;
  --text-accent:#16803C;
  --text-neg:#B91C1C;
  --text-warn:#92400E;
  --border-col:rgba(0,0,0,0.10);
  --border-col2:rgba(0,0,0,0.07);
  --border-col3:rgba(0,0,0,0.04);
  --tab-bg:#EDE8DF;
  --tab-border:rgba(0,0,0,0.10);
  --overlay:rgba(0,0,0,0.5);
  --modal-handle:rgba(0,0,0,0.12);
  --toast-bg:#16803C;
  --pill-bg:rgba(0,0,0,0.06);
}
[data-theme="stone"] .metric-card,[data-theme="stone"] .card,[data-theme="stone"] .acct-card{border-color:rgba(0,0,0,0.08)}
[data-theme="stone"] .data-table th{background:var(--bg-input)}
[data-theme="stone"] select,[data-theme="stone"] input,[data-theme="stone"] textarea{background:var(--bg-input);color:var(--text-primary);border-color:rgba(0,0,0,0.12)}
[data-theme="stone"] .filter-select{background:var(--bg-card);color:var(--text-primary);border-color:rgba(0,0,0,0.10)}
[data-theme="stone"] .search-input{background:var(--bg-input);color:var(--text-primary);border:0.5px solid var(--border-col)}
input::placeholder{color:var(--text-muted)}
select{background:var(--bg-input);color:var(--text-primary);border:0.5px solid var(--border-col)}
textarea{background:var(--bg-input);color:var(--text-primary);border:0.5px solid var(--border-col)}
[data-theme="stone"] input,[data-theme="stone"] select,[data-theme="stone"] textarea{
  background:#EDE8DF !important;color:#1A1A1A !important;border:1px solid rgba(0,0,0,0.20) !important
}
[data-theme="stone"] input::placeholder{color:#8A8078 !important}
[data-theme="stone"] .form-group input,[data-theme="stone"] .form-group select,[data-theme="stone"] .form-group textarea{
  background:#EDE8DF !important;color:#1A1A1A !important
}
[data-theme="stone"] .badge-active{background:#C8E6D4;color:#1B5E35;border-color:#B0D4BC}
[data-theme="stone"] .badge-restricted{background:#FDE8CC;color:#7A3000;border-color:#F5C898}
[data-theme="stone"] .badge-gubbed{background:#FAD4D4;color:#8B0000;border-color:#F0B0B0}
[data-theme="stone"] .badge-closed{background:#E0DDD8;color:#4A4540;border-color:#C8C4BE}
[data-theme="stone"] .toast{color:#fff}
[data-theme="slate"] .metric-card,[data-theme="slate"] .card,[data-theme="slate"] .acct-card{border-color:rgba(255,255,255,0.06)}
[data-theme="slate"] select,[data-theme="slate"] input,[data-theme="slate"] textarea{background:var(--bg-input);color:var(--text-primary);border-color:rgba(255,255,255,0.08)}
[data-theme="slate"] .filter-select{background:var(--bg-card);color:var(--text-primary)}
[data-theme="slate"] .search-input{background:var(--bg-input);color:var(--text-primary);border:0.5px solid var(--border-col)}
input::placeholder{color:var(--text-muted)}
select{background:var(--bg-input);color:var(--text-primary);border:0.5px solid var(--border-col)}
textarea{background:var(--bg-input);color:var(--text-primary);border:0.5px solid var(--border-col)}

[data-theme="slate"]{
  --bg-page:#1F1C18;
  --bg-card:#2A2620;
  --bg-input:#35302A;
  --bg-card2:#1F1C18;
  --bg-input2:#403A30;
  --bg-risk-red:#7C2D2D;
  --bg-risk-amber:#7C4D1A;
  --bg-risk-green:#1A4D30;
  --text-primary:#F5F0E8;
  --text-secondary:#D8D0C0;
  --text-muted:#A09880;
  --text-accent:#34D399;
  --text-neg:#F87171;
  --text-warn:#FBBF24;
  --border-col:rgba(255,255,255,0.08);
  --border-col2:rgba(255,255,255,0.05);
  --border-col3:rgba(255,255,255,0.03);
  --tab-bg:#2A2620;
  --tab-border:rgba(255,255,255,0.08);
  --overlay:rgba(0,0,0,0.7);
  --modal-handle:rgba(255,255,255,0.08);
  --toast-bg:#34D399;
  --pill-bg:rgba(255,255,255,0.06);
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-page);min-height:100%;font-size:14px;color:var(--text-primary);-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;min-height:100svh}

.topbar{background:var(--bg-card);border-bottom:0.5px solid var(--border-col);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:17px;font-weight:500;letter-spacing:-.3px;color:var(--text-primary)}
.logo span{color:#22C55E}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);background:var(--bg-input);padding:4px 10px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.08)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#22C55E;flex-shrink:0}
.sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}
.sync-dot.error{background:#F87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.profile-bar{background:var(--bg-card);border-bottom:0.5px solid var(--border-col);padding:8px calc(max(16px,(100vw - 680px)/2));display:flex;align-items:center;gap:10px}
.profile-label{font-size:11px;color:var(--text-muted);flex-shrink:0}
.profile-toggle{display:flex;gap:4px}
.profile-btn{padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text-secondary);border:0.5px solid var(--border-col);background:transparent;transition:all .15s;white-space:nowrap}
.profile-btn.active-jg{background:#14B8A6;color:#fff;border-color:#14B8A6}
.profile-btn.active-hg{background:#A78BFA;color:#fff;border-color:#A78BFA}
.profile-btn.active-bp{background:#60A5FA;color:#fff;border-color:#60A5FA}
.profile-btn.active-rq{background:#F87171;color:#fff;border-color:#F87171}
.profile-btn.active-both{background:var(--bg-input);color:var(--text-primary);border-color:var(--text-muted)}
.profile-btn.active-both{background:var(--bg-input);color:var(--text-primary);border-color:var(--border-col)}

.content{flex:1;padding:14px 16px;padding-bottom:calc(72px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;width:100%}

.tab-bar{background:var(--bg-card);border-top:0.5px solid var(--border-col);padding:6px calc(max(16px,(100vw - 680px)/2));padding-bottom:calc(6px + env(safe-area-inset-bottom));display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100}
.tab{flex:1;padding:5px 2px;cursor:pointer;font-size:9px;font-weight:500;color:var(--text-muted);border:none;background:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;transition:color .15s}
.tab i{font-size:20px;line-height:1}
.tab.active{color:var(--text-accent)}
.tab-label{font-size:9px;font-weight:500;white-space:nowrap}

.card{background:var(--bg-card);border:0.5px solid var(--border-col);border-radius:12px;overflow:hidden;margin-bottom:12px}
.card-header{padding:12px 16px;border-bottom:0.5px solid var(--border-col);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:.3px;text-transform:uppercase}
.card-body{padding:14px 16px}

.metric-card{background:var(--bg-input);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:3px}
.metric-label{font-size:11px;color:var(--text-secondary);font-weight:500;display:flex;align-items:center;gap:4px}
.metric-label i{font-size:14px}
.metric-value{font-size:26px;font-weight:500;letter-spacing:-1px;color:var(--text-primary);line-height:1.1}
.metric-value.pos{color:var(--text-accent)}.metric-value.neg{color:#F87171}.metric-value.warn{color:#BA7517}
.metric-sub{font-size:11px;color:var(--text-muted)}

.acct-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.acct-card{background:var(--bg-card);border:0.5px solid var(--border-col);border-radius:12px;padding:14px}
.acct-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.acct-name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--text-primary)}
.acct-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-jg{background:#14B8A6}.dot-hg{background:#A78BFA}.dot-bp{background:#60A5FA}.dot-rq{background:#F87171}
.acct-pnl{font-size:12px;font-weight:500}
.acct-pnl.pos{color:var(--text-accent)}.acct-pnl.neg{color:#F87171}
.acct-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:0.5px solid rgba(255,255,255,0.08)}
.acct-row-label{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
.acct-row-label i{font-size:13px}
.acct-row-val{font-size:12px;font-weight:500;color:var(--text-primary)}

.list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid rgba(255,255,255,0.05);transition:background .1s}
.list-row:last-child{border-bottom:none}
.list-row-left{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;margin-right:10px}
.list-row-title{font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.list-row-right{font-size:13px;font-weight:500;flex-shrink:0}
.list-row-right.pos{color:var(--text-accent)}.list-row-right.neg{color:#F87171}.list-row-right.warn{color:#BA7517}

.pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;border:0.5px solid transparent}
.pill-jg{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.pill-hg{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.pill-bp{background:#5C3800;color:#F0A500;border-color:#854F0B}
.pill-rq{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.pill-qualifier{background:#7A4F00;color:#F5C842}
.pill-freebet{background:#14532D;color:#86EFAC}
.pill-boost{background:#5C3800;color:#F0A500}
.pill-mug{background:#042C53;color:#F5C842}
.pill-extraplace{background:#3C3489;color:#AFA9EC}
.pill-2up{background:#085041;color:#5DCAA5}
.pill-mbal{background:#72243E;color:#ED93B1}
.pill-cashback{background:#14532D;color:#86EFAC}
.pill-cashout{background:#791F1F;color:#F09595}
.pill-arb{background:#5C3800;color:#F0A500}
.pill-deposit,.pill-withdrawal{background:#0D4F5C;color:#5DCAA5}
.pill-exchangedeposit,.pill-exchangewithdrawal{background:#0D4F5C;color:#5DCAA5}
.pill-balanceamendment{background:var(--bg-input);color:var(--text-secondary)}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500}
.badge-active{background:#14532D;color:#86EFAC}
.badge-restricted{background:#5C3800;color:#F0A500}
.badge-gubbed{background:#791F1F;color:#F09595}
.badge-closed{background:var(--bg-input);color:var(--text-muted)}

/* ── FORM ── */
.form-section{margin-bottom:14px}
.form-label{font-size:10px;font-weight:500;color:var(--text-muted);letter-spacing:.3px;text-transform:uppercase;display:block;margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-row.single{grid-template-columns:1fr}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.span2{grid-column:1/-1}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg-input);border:0.5px solid var(--border-col);border-radius:8px;padding:9px 11px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text-primary);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:rgba(255,255,255,0.25);background:#575A65}
input#f-pnl{border-color:#22C55E;font-size:15px;font-weight:500;background:#2A3D35}
input#f-pnl:focus{background:#2E4A3A}
input#f-date{font-size:12px;padding:7px 10px}
textarea{resize:vertical;min-height:60px}
select option{background:var(--bg-input);color:var(--text-primary)}

/* ── TYPE GROUPS ── */
.type-groups{display:flex;flex-direction:column;gap:8px}
.type-group-label{font-size:10px;font-weight:500;color:var(--text-muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:5px}
.type-pills{display:flex;flex-wrap:wrap;gap:5px}
.type-pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border-col);background:var(--bg-input);color:var(--text-secondary);transition:all .15s}
.type-pill.sel{border-width:1px}
.sel-qualifier{background:var(--bg-input);color:#FBBF24;border-color:#FBBF24}
.sel-freebet{background:var(--bg-input);color:#34D399;border-color:#34D399}
.sel-boost{background:var(--bg-input);color:#60A5FA;border-color:#60A5FA}
.sel-mug{background:var(--bg-input);color:var(--text-muted);border-color:var(--text-muted)}
.sel-extraplace{background:var(--bg-input);color:#C084FC;border-color:#C084FC}
.sel-2up{background:var(--bg-input);color:#F87171;border-color:#F87171}
.sel-mbal{background:var(--bg-input);color:#FB923C;border-color:#FB923C}
.sel-cashback{background:var(--bg-input);color:#A78BFA;border-color:#A78BFA}
.sel-cashout{background:var(--bg-input);color:#94A3B8;border-color:#94A3B8}
.sel-arb{background:var(--bg-input);color:#F472B6;border-color:#F472B6}
.sel-deposit,.sel-withdrawal{background:var(--bg-input);color:#34D399;border-color:#34D399}
.sel-exchangedeposit,.sel-exchangewithdrawal{background:var(--bg-input);color:#34D399;border-color:#34D399}
.sel-balanceamendment{background:var(--bg-input);color:var(--text-muted);border-color:var(--text-muted)}

.acct-selector{display:flex;gap:5px;flex-wrap:wrap}
.acct-sel-btn{flex:1;min-width:60px;padding:7px 5px;border-radius:8px;border:0.5px solid var(--border-col);background:var(--bg-input);color:var(--text-secondary);font-family:system-ui,-apple-system,sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.acct-sel-btn.active-jg{background:#14B8A6;color:#fff;border-color:#14B8A6}
.acct-sel-btn.active-hg{background:#A78BFA;color:#fff;border-color:#A78BFA}
.acct-sel-btn.active-bp{background:#60A5FA;color:#fff;border-color:#60A5FA}
.acct-sel-btn.active-rq{background:#F87171;color:#fff;border-color:#F87171}


.btn{padding:11px 20px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:0.5px solid var(--border-col);background:var(--bg-input);color:var(--text-primary);transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--text-accent);color:#fff;border-color:var(--text-accent)}
.btn-primary:hover{background:#0F6E56;border-color:#0F6E56}
.btn-full{width:100%;padding:13px}
.btn-danger{background:#791F1F;color:#F09595;border-color:#A32D2D}
.btn-ghost{background:var(--bg-input);color:var(--text-secondary);border-color:rgba(255,255,255,0.09)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px;font-family:system-ui,-apple-system,sans-serif;font-weight:500;cursor:pointer;border:0.5px solid var(--border-col);background:var(--bg-input);color:var(--text-secondary);transition:all .15s}
.btn-sm-edit{background:var(--bg-input);color:var(--text-accent);border-color:var(--text-accent)}
.btn-sm-dupe{background:var(--bg-input);color:#60A5FA;border-color:#60A5FA}
.btn-sm-danger{background:#791F1F;color:#F09595;border-color:#A32D2D}
.btn-won{background:rgba(34,197,94,0.15);color:#22C55E;border:0.5px solid rgba(34,197,94,0.3);padding:9px 16px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;flex:1}
.btn-lost{background:rgba(248,113,113,0.15);color:#F87171;border:0.5px solid rgba(248,113,113,0.3);padding:9px 16px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;flex:1}

.table-wrap{overflow:auto;border-radius:12px;border:0.5px solid var(--border-col);margin-bottom:12px;background:var(--bg-card);-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;min-width:460px}
.data-table th{padding:8px 12px;text-align:left;font-size:10px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;color:var(--text-muted);border-bottom:0.5px solid var(--border-col);background:var(--bg-input);white-space:nowrap;position:sticky;top:0}
.data-table td{padding:9px 12px;font-size:12px;border-bottom:0.5px solid var(--border-col2);vertical-align:middle;color:var(--text-primary)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg-input)}
.pos{color:var(--text-accent);font-weight:500}.neg{color:#F87171;font-weight:500}.muted{color:var(--text-muted)}

.pending-card{background:var(--bg-card);border:0.5px solid var(--border-col);border-radius:12px;padding:14px;margin-bottom:10px}
.pending-event{font-size:14px;font-weight:500;color:var(--text-primary);margin-bottom:6px}
.pending-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pending-info{background:var(--bg-input);border-radius:8px;padding:10px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pinfo-item{display:flex;flex-direction:column;gap:2px}
.pinfo-label{font-size:10px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.pinfo-val{font-size:13px;font-weight:500;color:var(--text-primary)}
.pinfo-val.pos{color:var(--text-accent)}.pinfo-val.neg{color:#F87171}

.month-wrap{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding:6px 2px 2px}
.month-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;min-width:44px}
.month-bar{width:36px;border-radius:3px 3px 0 0;min-height:3px}
.month-bar.pos{background:var(--text-accent)}.month-bar.neg{background:#F87171;border-radius:0 0 3px 3px}
.month-lbl{font-size:9px;color:var(--text-muted);font-weight:500}
.month-val{font-size:9px;font-weight:500}

<body>
<div id="pin-screen" style="display:none"></div>
<div id="app-content" style="display:none">
<div class="app">
  <div class="topbar">

        <button id="theme-btn-slate" onclick="setTheme('slate')" title="Charcoal Warm" style="border:none;cursor:pointer;padding:3px 9px;border-radius:12px;background:transparent;font-family:system-ui;font-size:10px;font-weight:500;color:var(--text-primary);transition:background .2s">Warm</button>
      </div>
      <div class="sync-badge"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">Loading</span></div>
    </div>
  </div>
  <div class="profile-bar" id="profile-bar" style="display:none">
    <span class="profile-label">Viewing</span>
    <div class="profile-toggle">
      <button class="profile-btn active-jg" id="pbtn-jg" onclick="switchProfile('jg')">JG</button>
      <button class="profile-btn" id="pbtn-hg" onclick="switchProfile('hg')">HG</button>
      <button class="profile-btn" id="pbtn-bp" onclick="switchProfile('bp')">BP</button>
      <button class="profile-btn" id="pbtn-rq" onclick="switchProfile('rq')">RQ</button>
      <button class="profile-btn" id="pbtn-both" onclick="switchProfile('both')">All</button>
    </div>
  </div>
  <div class="content" id="main-content">
    <div class="loading"><div class="spinner"></div>Loading…</div>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="tab-dashboard" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard" aria-hidden="true"></i><span class="tab-label">Dashboard</span></button>
    <button class="tab" id="tab-pending" onclick="switchTab('pending')"><i class="ti ti-clock" aria-hidden="true"></i><span class="tab-label">Settle <span id="pending-badge" style="display:none;background:#BA7517;color:#fff;border-radius:10px;padding:0 5px;font-size:9px;font-weight:500">0</span></span></button>
    <button class="tab" id="tab-trade" onclick="switchTab('trade')"><i class="ti ti-repeat" aria-hidden="true"></i><span class="tab-label">Trade</span></button>
    <button class="tab" id="tab-accounts" onclick="switchTab('accounts')"><i class="ti ti-wallet" aria-hidden="true"></i><span class="tab-label">Accounts</span></button>

  </div>

<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
const SUPABASE_URL_UNUSED='';
let syncTimeout=null;
let _serverLoaded=false;
let _saveQueue=[];        // queue of failed saves to retry
let _retryTimeout=null;  // retry timer handle
let _retrying=false;     // prevents concurrent retries

function setSyncStatus(s){
  const dot=document.getElementById('sync-dot'),label=document.getElementById('sync-label');
  if(!dot||!label)return;
  dot.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  const qLen=_saveQueue.length;
  if(s==='syncing')label.textContent='Saving'+(qLen?` (${qLen} queued)`:'');
  else if(s==='error')label.textContent=qLen?`Offline · ${qLen} pending`:'Offline';
  else label.textContent=qLen?`Saved · ${qLen} queued`:'Saved';
}

async function loadData(){
  try{
    // Try sessionStorage first — most recent confirmed state from this session
    const cached=localStorage.getItem('mbe_state');
    if(cached){
      const parsed=JSON.parse(cached);
      // ONE-TIME MIGRATION: older cached blobs use the pre-rename keys
      // 'me'/'wife'. If the new keys aren't present but the old ones are,
      // copy the data across under the new names. Old keys are left
      // untouched in the parsed object (harmless — PROFILES.forEach below
      // only reads the new key names), so nothing is lost either way.
      const LEGACY_PROFILE_MAP={jg:'me',hg:'wife'};
      Object.entries(LEGACY_PROFILE_MAP).forEach(([newKey,oldKey])=>{
        if(!parsed[newKey]&&parsed[oldKey])parsed[newKey]=parsed[oldKey];
      });
      // Sanity check: if cache has mostly Not Signed Up bookies, it's stale — discard
      const meBookies=parsed['jg']?.bookies||{};
      const activeCount=Object.values(meBookies).filter(b=>b&&b.status&&b.status!=='Not Signed Up').length;
      const totalCount=Object.keys(meBookies).length;
      const cacheIsValid=totalCount===0||(activeCount/totalCount)>0.05; // at least 5% non-default
      if(cacheIsValid){
        PROFILES.forEach(pr=>{
          if(parsed[pr]){
            state[pr]=JSON.parse(JSON.stringify(parsed[pr]));
            if(state[pr].casino){
              // Filter locally deleted sessions from cache
              const deletedSet=new Set((casinoDeletedIds[pr]||[]).map(String));
              state[pr].casino=state[pr].casino.filter(s=>!deletedSet.has(String(s.id)));
            }
            // else: leave state[pr].casino undefined — this cached
            // snapshot predates casino ever being cached (or it was
            // cleared), so casinoDataLoaded below correctly stays
            // false and ensureCasinoLoaded() fetches it fresh when
            // actually needed, instead of silently treating "never
            // cached" as "loaded, empty".
            if(!state[pr].freeBets)state[pr].freeBets=[];
          }
        });
        // If every profile's cached snapshot already had real casino
        // data, treat it as already loaded — a returning user with a
        // good local cache shouldn't see a loading spinner for data
        // that's already sitting right here in memory.
        if(PROFILES.every(pr=>Array.isArray(state[pr]?.casino))){
          casinoDataLoaded=true;
        }
        if(parsed.exchanges)state.exchanges=JSON.parse(JSON.stringify(parsed.exchanges));
        if(parsed._deletedTxIds){
          PROFILES.forEach(pr=>{if(parsed._deletedTxIds[pr])deletedTxIds[pr]=parsed._deletedTxIds[pr];});
        }
        lastServerState=JSON.parse(JSON.stringify(parsed));
        setSyncStatus('synced');
        // FIX: clean up bookie name variants (Gala->Gala Casino etc.) on the
        // CACHED data too, not only after the server fetch completes below.
        // Previously the first render used raw unmigrated cache data, so
        // old/duplicate bookie names flashed on screen until the background
        // fetchFromServer() finished and re-rendered.
        migrateLegacy();

      // Still fetch from server in background to pick up changes from other devices
      fetchFromServer();
      return;
      } // end cacheIsValid
    }
    // No cache — load from server directly
    await fetchFromServer();
  }catch(e){
    console.error('Load error:',e);
    setSyncStatus('error');
  }
}

async function fetchFromServer(){
  try{
    const sportsRes = await fetch('/api/load-sports?t='+Date.now());
    if(!sportsRes.ok)throw new Error('HTTP '+sportsRes.status);
    const sportsJson=await sportsRes.json();
    if(sportsJson.ok&&sportsJson.data){
      const saved=sportsJson.data;
      const hasData=PROFILES.some(p=>saved[p]&&((saved[p].transactions||[]).length>0||saved[p].bank!==0));
      if(hasData){
        // Only update if server has more data than current state
        const serverCount=PROFILES.reduce((a,p)=>a+(saved[p]?.transactions||[]).length,0);
        const localCount=PROFILES.reduce((a,p)=>a+(state[p]?.transactions||[]).length,0);
        // Always merge — never let server overwrite local-only transactions
        PROFILES.forEach(pr=>{
          if(!saved[pr])return;
          const serverTxs=saved[pr].transactions||[];
          const localTxs=state[pr].transactions||[];
          const serverMap=new Map(serverTxs.map(t=>[String(t.id),t]));
          const localMap=new Map(localTxs.map(t=>[String(t.id),t]));
          // Union: all IDs from both
          const allIds=new Set([...serverMap.keys(),...localMap.keys()]);
          const merged=[];
          const deletedIds=new Set((deletedTxIds[pr]||[]).map(String));
          allIds.forEach(id=>{
            // Skip deleted transactions
            if(deletedIds.has(String(id)))return;
            const server=serverMap.get(id);
            const local=localMap.get(id);
            if(local&&server){
              // Prefer local settled over server pending
              if(local.result!=='Pending'&&server.result==='Pending')merged.push(local);
              else merged.push(server);
            } else if(local){
              merged.push(local); // local-only — keep it (new log not yet on server)
            } else {
              // Server-only — only add if not in deleted list
              if(!deletedIds.has(String(id)))merged.push(server);
            }
          });
          // Sort by date desc
          merged.sort((a,b)=>{const da=parseDate(a.date),db=parseDate(b.date);return db!==da?db-da:b.id-a.id;});
          // FIX: was "only take server bank if local is 0", which meant any
          // device holding a stale non-zero cached bank would NEVER accept
          // a corrected value from the server. Now merges on a timestamp,
          // same principle already used for bookie balances below.
          {
            const localBankTs=state[pr].bankUpdatedAt||0;
            const serverBankTs=saved[pr].bankUpdatedAt||0;
            if(serverBankTs>=localBankTs){
              state[pr].bank=saved[pr].bank;
              state[pr].bankUpdatedAt=serverBankTs;
            }
            // else: local edit is newer, keep it — it'll be pushed on next save
          }
          // Merge bookies — keep local balance if it differs from server
          // (local is more recent, server may be stale replica)
          const serverBk=saved[pr].bookies||{};
          const localBk=state[pr].bookies||{};
          // Timestamp-based merge — most recently updated balance wins
          const mergedBk={...serverBk};
          Object.keys(localBk).forEach(function(k){
            if(!mergedBk[k]){
              mergedBk[k]=localBk[k];
            } else {
              const localTs=localBk[k].balUpdatedAt||0;
              const serverTs=mergedBk[k].balUpdatedAt||0;
              const localWins=localTs>0&&localTs>serverTs;
              mergedBk[k]=Object.assign({},mergedBk[k],{
                bal:localWins?localBk[k].bal:mergedBk[k].bal,
                status:localWins?(localBk[k].status||mergedBk[k].status):mergedBk[k].status,
                notes:localWins?(localBk[k].notes!==undefined?localBk[k].notes:mergedBk[k].notes):mergedBk[k].notes,
                verifiedAt:localBk[k].verifiedAt||mergedBk[k].verifiedAt||null,
                balUpdatedAt:Math.max(localTs,serverTs)
              });
            }
          });
          // Preserve local verifiedAt — server doesn't track this
          Object.keys(mergedBk).forEach(function(bk){
            const loc=localBk[bk];
            if(loc&&loc.verifiedAt)mergedBk[bk].verifiedAt=loc.verifiedAt;
          });
          state[pr].bookies=mergedBk;
          state[pr].transactions=merged;
          state[pr].freeBets=saved[pr].freeBets||state[pr].freeBets||[];
          // Casino no longer comes from this endpoint — load-sports.js
          // omits it entirely (see ensureCasinoLoaded()). Deliberately
          // NOT touching state[pr].casino here at all: the previous
          // logic's fallback (`else if(!state[pr].casino)...=[]`) would
          // have silently turned "not loaded yet" into "loaded, empty"
          // on every background sync, defeating the whole point of the
          // casinoDataLoaded flag. Leave it exactly as-is.
        });
        if(saved.exchanges)state.exchanges=JSON.parse(JSON.stringify(saved.exchanges));
        lastServerState=JSON.parse(JSON.stringify(saved));
      }
    }
// Casino loaded from /api/load (split key)
    setSyncStatus('synced');
    migrateLegacy();
    _serverLoaded=true;
    render();
  }catch(e){
    console.error('Server fetch error:',e);
  }
}

// ── SAVE QUEUE ───────────────────────────────────────────────────────────────
function persistQueue(){
  try{localStorage.setItem('mbe_save_queue',JSON.stringify(_saveQueue));}catch(e){}
}

function restoreQueue(){
  try{
    const q=localStorage.getItem('mbe_save_queue');
    if(q){
      _saveQueue=JSON.parse(q)||[];
      // Don't retry immediately — wait until app is fully loaded
      // drainQueue is called after loadApp completes
    }
  }catch(e){_saveQueue=[];}
}

function queueSave(source){
  // Merge with existing queue — don't stack duplicates, just update source
  const existing=_saveQueue.findIndex(s=>s.source===source);
  const entry={source,timestamp:Date.now(),state:buildSavePayload()};
  if(existing>=0)_saveQueue[existing]=entry;
  else _saveQueue.push(entry);
  persistQueue();
  setSyncStatus('error');
  scheduleRetry();
}

function scheduleRetry(){
  if(_retryTimeout)clearTimeout(_retryTimeout);
  _retryTimeout=setTimeout(drainQueue,15000); // retry in 15 seconds
}

async function drainQueue(){
  if(_retrying||_saveQueue.length===0)return;
  _retrying=true;
  setSyncStatus('syncing');
  const entry=_saveQueue[0]; // try oldest first
  try{
    const sportsRes=await fetch('/api/save-sports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry.state.sports)});
    if(!sportsRes.ok)throw new Error('Retry save failed: '+sportsRes.status);
    _saveQueue.shift(); // remove successfully sent item
    persistQueue();
    if(_saveQueue.length>0){
      setSyncStatus('syncing');
      setTimeout(drainQueue,2000); // drain next item
    }else{
      setSyncStatus('synced');
    }
  }catch(e){
    setSyncStatus('error');
    scheduleRetry(); // try again in 15s
  }finally{
    _retrying=false;
  }
}

function buildSavePayload(){
  // Sports-only — casino saves are handled immediately by
  // saveCasinoOnly(), not queued through this retry mechanism. The
  // `casino` object this used to build here was dead code anyway: it
  // was captured into every queued entry but drainQueue() never
  // actually sent it anywhere.
  const sports={exchanges:state.exchanges,_source:'queue',_serverState:lastServerState};
  PROFILES.forEach(pr=>{
    sports[pr]={bank:state[pr]?.bank||0,bankUpdatedAt:state[pr]?.bankUpdatedAt||0,bookies:state[pr]?.bookies||{},
      transactions:state[pr]?.transactions||[],freeBets:state[pr]?.freeBets||[],
      deletedIds:deletedTxIds[pr]||[]};
  });
  return{sports};
}

// Casino session create/delete route through the dedicated casino
// endpoint (same one casino.html uses) rather than the generic sports
// save. This is the correct fix for a real bug found while auditing:
// the generic saveData() never sent deletedCasinoIds, so deleting a
// casino session via the main app could silently fail to persist and
// reappear on a future sync. save-casino.js already handles casino
// tombstones properly AND independently recomputes the bookie balance
// delta from session diffing server-side — so this function only needs
// to send casino + deletedIds, not bookies.
async function saveCasinoOnly(source='casino'){
  setSyncStatus('syncing');
  try{
    const casinoState={};
    PROFILES.forEach(pr=>{casinoState[pr]={casino:state[pr]?.casino||[],deletedIds:casinoDeletedIds[pr]||[]};});
    const res=await fetch('/api/save-casino',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(casinoState)});
    if(!res.ok)throw new Error('Casino save failed: '+res.status);
    PROFILES.forEach(pr=>{casinoDeletedIds[pr]=[];});
    setSyncStatus('synced');
  }catch(e){
    console.error('Casino save error:',e);
    setSyncStatus('error');
    showToast('⚠ Casino save failed — check connection and try again','error');
  }
}

async function saveData(source='unknown'){
  if(window._appLoading){console.log('Save blocked during load');return;}
  // If a save is already in progress, queue this one and return
  if(saveInProgress){
    pendingSave=source;
    return;
  }
  saveInProgress=true;
  setSyncStatus('syncing');
  window._lastSaveSource=source;
  try{
    // Sports-only payload — casino is now handled entirely by
    // saveCasinoOnly() via /api/save-casino, and never sent here.
    const sportsState={exchanges:state.exchanges,_source:source,_serverState:lastServerState};
    PROFILES.forEach(pr=>{
      sportsState[pr]={
        bank:state[pr]?.bank||0,
        bankUpdatedAt:state[pr]?.bankUpdatedAt||0,
        bookies:state[pr]?.bookies||{},
        transactions:state[pr]?.transactions||[],
        freeBets:state[pr]?.freeBets||[],
        deletedIds:deletedTxIds[pr]||[]
      };
    });
    const sportsRes=await fetch('/api/save-sports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sportsState)});
    if(!sportsRes.ok){
      let errBody='';
      try{const j=await sportsRes.json();errBody=j.error||'';}catch(_){}
      throw new Error('Save '+sportsRes.status+(errBody?' — '+errBody:''));
    }
    // Update state from server's merged response — avoids stale load on next refresh
    const sportsJson=await sportsRes.json();
    if(sportsJson.ok&&sportsJson.data){
      PROFILES.forEach(pr=>{
        if(sportsJson.data[pr]){
          state[pr].bank=sportsJson.data[pr].bank;
          // Timestamp-based merge on save response
          const serverBk=sportsJson.data[pr].bookies||{};
          const localBk=state[pr].bookies||{};
          const mergedBk=Object.assign({},serverBk);
          Object.keys(localBk).forEach(function(bk){
            if(!mergedBk[bk]){
              mergedBk[bk]=localBk[bk];
            } else {
              const localTs=localBk[bk].balUpdatedAt||0;
              const serverTs=mergedBk[bk].balUpdatedAt||0;
              const localWins=localTs>0&&localTs>serverTs;
              mergedBk[bk]=Object.assign({},mergedBk[bk],{
                bal:localWins?localBk[bk].bal:mergedBk[bk].bal,
                status:localWins?(localBk[bk].status||mergedBk[bk].status):mergedBk[bk].status,
                notes:localWins?(localBk[bk].notes!==undefined?localBk[bk].notes:mergedBk[bk].notes):mergedBk[bk].notes,
                verifiedAt:localBk[bk].verifiedAt||mergedBk[bk].verifiedAt||null,
                balUpdatedAt:Math.max(localTs,serverTs)
              });
            }
          });
          state[pr].bookies=mergedBk;
          // Merge transactions — union of server + local, prefer settled over pending
          const serverTxs=sportsJson.data[pr].transactions||[];
          const localTxs=state[pr].transactions||[];
          const serverMap=new Map(serverTxs.map(t=>[String(t.id),t]));
          const localMap=new Map(localTxs.map(t=>[String(t.id),t]));
          const allIds=new Set([...serverMap.keys(),...localMap.keys()]);
          const mergedTxs=[];
          allIds.forEach(id=>{
            const srv=serverMap.get(id);
            const loc=localMap.get(id);
            if(loc&&srv){
              if(loc.result!=='Pending'&&srv.result==='Pending')mergedTxs.push(loc);
              else mergedTxs.push(srv);
            } else { mergedTxs.push(loc||srv); }
          });
          mergedTxs.sort((a,b)=>{const da=parseDate(a.date),db=parseDate(b.date);return db!==da?db-da:b.id-a.id;});
          state[pr].transactions=mergedTxs;
          // Casino no longer comes back in this response at all —
          // save-sports.js is deliberately casino-blind (see
          // saveCasinoOnly() for how casino actually persists).
          // Deliberately NOT touching state[pr].casino here — same
          // reasoning as fetchFromServer() and migrateLegacy(): doing so
          // would silently convert "not loaded" into "loaded, empty".
          if(!state[pr].freeBets)state[pr].freeBets=[];
        }
      });
      if(sportsJson.data.exchanges)state.exchanges=sportsJson.data.exchanges;
      // Track confirmed server state so next save can skip stale KV read
      lastServerState=JSON.parse(JSON.stringify(sportsJson.data));
      // Cache in sessionStorage so pull-to-refresh gets fresh data
      try{
        const _sd=JSON.parse(JSON.stringify(sportsJson.data));
        _sd._deletedTxIds=deletedTxIds;
        // Only include casino in the cache if it's genuinely loaded —
        // omitting the key (rather than defaulting to []) preserves the
        // "not loaded" signal for next session's cache-restore. This is
        // the third, differently-shaped instance of a bug already fixed
        // twice elsewhere (fetchFromServer's snap[pr] builders) — found
        // here because it uses `_sd`, not `snap`, so the earlier
        // pattern-search for `snap[pr]=` didn't catch it.
        PROFILES.forEach(pr=>{
          if(_sd[pr]&&Array.isArray(state[pr].casino))_sd[pr].casino=state[pr].casino;
        });
        localStorage.setItem('mbe_state',JSON.stringify(_sd));
      }catch(e){}
    }
    // Only clear tx deletion tracking here — casino deletion tracking is
    // saveCasinoOnly()'s exclusive responsibility now. Clearing it here
    // too would risk a race: if a casino delete is still in flight (or
    // retrying after a failure) when an unrelated sports save completes,
    // this would prematurely wipe the tombstone tracking before the
    // casino delete ever actually persisted.
    PROFILES.forEach(pr=>{deletedTxIds[pr]=[];});
    // Clear save queue on successful save
    _saveQueue=[];
    persistQueue();
    setSyncStatus('synced');
  }catch(e){
    console.error('Save error:',e);
    // Try to get server error message
    let errMsg=e.message||'unknown';
    try{
      if(e.response){const j=await e.response.json();errMsg=j.error||errMsg;}
    }catch(_){}
    queueSave(source);
    showToast('⚠ Save failed: '+errMsg,'error');
  }finally{
    saveInProgress=false;
    if(pendingSave){const nextSource=pendingSave;pendingSave=null;saveData(nextSource);}
  }
}
function debouncedSave(source='unknown'){if(syncTimeout)clearTimeout(syncTimeout);setSyncStatus('syncing');syncTimeout=setTimeout(()=>saveData(source),1500);}
function save(source='unknown'){debouncedSave(source);}

// LAZY-LOADING CASINO DATA: index.html calls load-sports.js (which omits
// casino) instead of load.js, so casino genuinely isn't loaded upfront.
// ensureCasinoLoaded() fetches it the first time it's actually needed.
//
// This used to be a one-time-ever flag: once loaded, it was NEVER
// re-fetched again for the rest of the session, no matter how long the
// app stayed open or how much new activity happened elsewhere (e.g.
// Operator A logging sessions via /casino). That's a real gap found
// after a "close and reopen didn't fix it" report — some browsers
// suspend/resume a page rather than truly reloading it, so even a
// genuine close-and-reopen might just resume the same stale JS state
// without ever re-running this fetch. Converted to a staleness check
// instead: data older than CASINO_STALE_MS gets silently refreshed in
// the background whenever the Casino tab or Dashboard is visited again,
// so it self-corrects without needing a true full reload at all.
let casinoDataLoaded=false;
let casinoLastFetchedAt=0;
const CASINO_STALE_MS=2*60*1000; // 2 minutes

function ensureCasinoLoaded(onReady){
  fetch('/api/load-casino').then(r=>{
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(json=>{
    if(json.ok&&json.data){
      PROFILES.forEach(pr=>{
        state[pr].casino=json.data[pr]?.casino||[];
      });
    }else{
      // Response came back but with nothing usable — still unblock the
      // UI with empty arrays rather than leaving it stuck loading.
      PROFILES.forEach(pr=>{if(!state[pr].casino)state[pr].casino=[];});
    }
    casinoDataLoaded=true;
    casinoLastFetchedAt=Date.now();
    if(typeof invalidateCasinoCache==='function')invalidateCasinoCache();
    onReady();
  }).catch(e=>{
    console.error('Casino lazy-load failed:',e);
    // Don't update casinoLastFetchedAt on failure — leave it due for an
    // immediate retry next time, rather than silently treating a failed
    // fetch as "successfully checked, fresh for the next 2 minutes".
    PROFILES.forEach(pr=>{if(!state[pr].casino)state[pr].casino=[];});
    onReady();
  });
}

// Called on every Casino tab / Dashboard render. If data's never been
// loaded, blocks and shows a spinner (via the existing casinoDataLoaded
// check in render()) — same as before. If data's already loaded but
// stale, refreshes quietly in the background and re-renders once done,
// with nothing shown on screen changing until the update actually lands.
function refreshCasinoIfStale(onUpdate){
  if(!casinoDataLoaded)return; // first load handled by ensureCasinoLoaded()'s own blocking path
  if((Date.now()-casinoLastFetchedAt)<=CASINO_STALE_MS)return; // still fresh, nothing to do
  fetch('/api/load-casino').then(r=>r.ok?r.json():null).then(json=>{
    if(json&&json.ok&&json.data){
      PROFILES.forEach(pr=>{state[pr].casino=json.data[pr]?.casino||[];});
      casinoLastFetchedAt=Date.now();
      if(typeof invalidateCasinoCache==='function')invalidateCasinoCache();
      onUpdate();
    }
  }).catch(e=>console.error('Casino background refresh failed:',e));
}

function getChartMonthKey(){
  if(!_chartMonth){const n=new Date();return{year:n.getFullYear(),month:n.getMonth()+1};}
  return _chartMonth;
}
function navChartMonth(dir){
  const cur=getChartMonthKey();
  let m=cur.month+dir,y=cur.year;
  if(m>12){m=1;y++;}if(m<1){m=12;y--;}
  const now=new Date();
  if(y>now.getFullYear()||(y===now.getFullYear()&&m>now.getMonth()+1)||
    (y===now.getFullYear()&&m===now.getMonth()+1))_chartMonth=null;
  else _chartMonth={year:y,month:m};
  const mc=document.getElementById('main-content');
  if(mc)mc.innerHTML=renderDashboard();
  setTimeout(initMonthlyChart,50);
}
function buildChartData(){
  const{year,month}=getChartMonthKey();
  const now=new Date();
  const isCurrent=!_chartMonth;
  const daysInMonth=new Date(year,month,0).getDate();
  const lastDay=isCurrent?now.getDate():daysInMonth;
  const sportsByDay={},casinoByDay={};
  PROFILES.forEach(pr=>{
    (state[pr].transactions||[]).forEach(t=>{
      if(t.result==='Pending'||t.type==='Balance Amendment'||!t.date)return;
      const p=t.date.split('/');if(p.length<3)return;
      const d=parseInt(p[0]),mo=parseInt(p[1]),y=parseInt(p[2]);
      if(y!==year||mo!==month)return;
      sportsByDay[d]=(sportsByDay[d]||0)+(t.pnl||0);
    });
    (state[pr].casino||[]).forEach(s=>{
      if(!s.date)return;
      const p=s.date.split('/');if(p.length<3)return;
      const d=parseInt(p[0]),mo=parseInt(p[1]),y=parseInt(p[2]);
      if(y!==year||mo!==month)return;
      const pnl=(s.startBal!==undefined&&s.endBal!==undefined&&(s.startBal!==0||s.endBal!==0))?s.endBal-s.startBal:(s.netProfit||0);
      casinoByDay[d]=(casinoByDay[d]||0)+pnl;
    });
  });
  const labels=[],sD=[],cD=[],comD=[];
  let sc=0,cc=0;
  for(let d=1;d<=lastDay;d++){
    sc+=sportsByDay[d]||0;cc+=casinoByDay[d]||0;
    labels.push(String(d));
    sD.push(Math.round(sc*100)/100);
    cD.push(Math.round(cc*100)/100);
    comD.push(Math.round((sc+cc)*100)/100);
  }
  // Last month same-day
  let lm=month-1,ly=year;
  if(lm<1){lm=12;ly--;}
  let lmS=0,lmC=0;
  PROFILES.forEach(pr=>{
    (state[pr].transactions||[]).forEach(t=>{
      if(t.result==='Pending'||t.type==='Balance Amendment'||!t.date)return;
      const p=t.date.split('/');if(p.length<3)return;
      const d=parseInt(p[0]),mo=parseInt(p[1]),y=parseInt(p[2]);
      if(y!==ly||mo!==lm||d>lastDay)return;
      lmS+=(t.pnl||0);
    });
    (state[pr].casino||[]).forEach(s=>{
      if(!s.date)return;
      const p=s.date.split('/');if(p.length<3)return;
      const d=parseInt(p[0]),mo=parseInt(p[1]),y=parseInt(p[2]);
      if(y!==ly||mo!==lm||d>lastDay)return;
      const pnl=(s.startBal!==undefined&&s.endBal!==undefined&&(s.startBal!==0||s.endBal!==0))?s.endBal-s.startBal:(s.netProfit||0);
      lmC+=pnl;
    });
  });
  return{labels,sD,cD,comD,
    sT:Math.round(sc*100)/100,cT:Math.round(cc*100)/100,comT:Math.round((sc+cc)*100)/100,
    lmS:Math.round(lmS*100)/100,lmC:Math.round(lmC*100)/100,lmCom:Math.round((lmS+lmC)*100)/100};
}

ottom:3px;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#60A5FA;display:inline-block"></span>Combined</div>'    +'<div style="font-size:17px;font-weight:500;color:#60A5FA">'+mv(d.comT)+'</div>'    +delta(d.comT,d.lmCom)    +'</div></div>'    +'<div style="position:relative;width:100%;height:130px"><canvas id="monthlyChart" role="img" aria-label="Monthly P&L trend chart">Sports '+d.sT+' Casino '+d.cT+'</canvas></div>'    +'<div style="display:flex;gap:12px;margin-top:8px">'    +'<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-muted)"><div style="width:16px;height:2px;background:var(--text-accent);border-radius:1px"></div>Sports</div>'    +'<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-muted)"><div style="width:16px;height:2px;background:#A78BFA;border-radius:1px"></div>Casino</div>'    +'<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-muted)"><div style="width:16px;height:2px;border-top:2px dashed #60A5FA"></div>Combined</div>'    +'</div></div>';
}

        ${t.exchange?`<span style="font-size:11px;color:var(--text-muted);background:var(--border-col2);padding:2px 6px;border-radius:4px">${t.exchange}</span>`:''}
        ${isFB?'<span class="badge" style="background:rgba(34,197,94,0.1);color:var(--text-accent)">SNR</span>':''}
        ${t.underlay?'<span class="badge" style="background:rgba(34,197,94,0.1);color:var(--text-accent);border:0.5px solid rgba(93,202,165,0.3)">U</span>':''}
      </div>
      <div class="pending-info">
        ${t.bstake?`<div class="pinfo-item"><span class="pinfo-label">Back</span><span class="pinfo-val">£${t.bstake} @ ${t.bodds}</span></div>`:''}
        <div class="pinfo-item">
          <span class="pinfo-label">If wins</span>
          <span class="pinfo-val pos">${fmtS(t.expectedPnl||0)}</span>
        </div>
        ${(()=>{
          const isFB=isFreeBet(t.type);
          const bs=t.bstake||0,bo=t.bodds||0,lo=t.lodds||0;
          if(t.underlay&&isFB&&lo>1&&bo>2){
            const ul_ls=bs*(bo-2)/(lo-1);
            return '<div class="pinfo-item"><span class="pinfo-label">If loses</span><span class="pinfo-val pos">'+fmtS(ul_ls)+'</span></div>';
          }
          if(!t.underlay&&lo>0){
            const li_ls=isFB?bs*(bo-1)/lo:bs*bo/lo;
            const lose_pnl=isFB?li_ls:li_ls-bs;
            return '<div class="pinfo-item"><span class="pinfo-label">If loses</span><span class="pinfo-val '+(lose_pnl>=0?'pos':'neg')+'">'+fmtS(lose_pnl)+'</span></div>';
          }
          return '';
        })()}
        <div style="margin-left:auto"><button class="btn-sm btn-sm-edit" onclick="editPnl('${t._acct}',${t.id})">Edit P&L</button></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">
        <button class="btn-won" onclick="settleBet('${t._acct}',${t.id},'Won')" style="padding:14px;font-size:15px;border-radius:10px"><i class="ti ti-check" aria-hidden="true"></i> Won</button>
        <button class="btn-lost" onclick="settleBet('${t._acct}',${t.id},'Lost')" style="padding:14px;font-size:15px;border-radius:10px"><i class="ti ti-x" aria-hidden="true"></i> Lost</button>
      </div>
    </div>`;
  }).join('')}`;
}

function applyBalanceOnSettle(tx,p,result){
  const isFB=isFreeBet(tx.type);
  const bs=tx.bstake||0,bo=tx.bodds||0,lo=tx.lodds||0,exchange=tx.exchange;
  const bk=tx.bookie&&p.bookies[tx.bookie]?p.bookies[tx.bookie]:null;
  // Exchange commission, stored as a percentage (e.g. 2 for 2%), as a
  // decimal for the maths below. Every formula here has been checked to
  // reduce exactly to the original pre-commission formula when this is
  // 0 — commission only ever changes a branch where the LAY side wins,
  // since a losing lay is never charged commission.
  const c=(tx.comm||0)/100;

  if(tx.type==='MBAL'){
    // Bonus lock-in: a real (non-free-bet) qualifying bet where the
    // bookie pays a bonus (usually a free bet) ONLY if it loses, nothing
    // extra if it wins. The lay stake itself is calculated to fold that
    // bonus's retained value in — see autoCalcUnderlay() for the same
    // formulas and the worked examples they were verified against.
    // Zero commission assumed throughout, matching how this bet type is
    // actually used in practice.
    const bonus=tx.mbalBonus||0;
    const retention=(tx.mbalRetention||0)/100;
    if(!tx.underlay){
      const li_ls=lo>0?(bs*bo-bonus*retention)/lo:0;
      if(result==='Won'){
        tx.pnl=Math.round((bs*(bo-1)-li_ls*(lo-1))*100)/100;
        if(bk){bk.bal=(bk.bal||0)+(bo*bs);bk.balUpdatedAt=Date.now();}
        if(exchange&&state.exchanges[exchange]!==undefined)
          state.exchanges[exchange]=(state.exchanges[exchange]||0)-li_ls*(lo-1);
      }else{
        // Standalone loss only — deliberately does NOT include the
        // bonus value. The bonus becomes a real free bet you'll log and
        // settle as its own separate transaction later; folding an
        // estimate of it in here too would double-count it once that
        // second transaction's own real P&L comes in.
        tx.pnl=Math.round((li_ls-bs)*100)/100;
        if(exchange&&state.exchanges[exchange]!==undefined)
          state.exchanges[exchange]=(state.exchanges[exchange]||0)+tx.pnl;
      }
    }else{
      // Underlay variant — lay stake deliberately calibrated so the
      // "lost" outcome nets to £0, same as the non-MBAL normal underlay
      // below, so it doesn't touch the exchange balance either — that
      // pattern only applies to lock-in bets in this codebase.
      const ul_ls=bs-bonus*retention;
      if(result==='Won'){
        tx.pnl=Math.round((bs*(bo-1)-ul_ls*(lo-1))*100)/100;
        if(bk){bk.bal=(bk.bal||0)+(bo*bs);bk.balUpdatedAt=Date.now();}
      }else{
        // Same principle — standalone loss only, no bonus folded in.
        // This is the full loss the underlay was deliberately accepting
        // in exchange for bigger upside on a Win; the separately-logged
        // free bet is what's meant to offset it, not an assumption here.
        tx.pnl=Math.round((ul_ls-bs)*100)/100;
      }
    }
    // A free bet becomes available specifically when the bet is LOST —
    // record it the same way a Qualifier's free bet is tracked, so it
    // shows up in the existing Free Bets panel on Dashboard rather than
    // relying on memory to go redeem it.
    if(result==='Lost'&&bonus>0&&tx.bookie){
      if(!p.freeBets)p.freeBets=[];
      p.freeBets.push({id:Date.now()+Math.random(),date:tx.date,bookie:tx.bookie,acct:tx._acct,status:'Pending',amount:bonus,sourceMbalId:tx.id});
      showToast('Free bet available at '+tx.bookie+' (£'+bonus.toFixed(2)+') — check Dashboard','success');
    }
    return;
  }

  if(tx.underlay){
    if(!isFB){
      // NORMAL UNDERLAY — lay stake is deliberately just the back stake
      // (not a full hedge, that's the point of the strategy), so
      // commission only affects the branch where the lay actually wins.
      if(result==='Won'){
        const winProfit=lo>0?Math.round(bs*(bo-lo)*100)/100:(tx.pnl||0);
        tx.pnl=winProfit;
        if(bk){bk.bal=Math.round(((bk.bal||0)+(bo*bs))*100)/100;bk.balUpdatedAt=Date.now();}
      }else{
        // Lay wins here — commission comes off that win. Was a flat £0
        // (assuming the back-stake loss and lay win exactly cancel);
        // now correctly reflects the small shortfall commission causes.
        tx.pnl=Math.round((bs*(1-c)-bs)*100)/100;
      }
    }else{
      // FREE BET SNR UNDERLAY — same reasoning: the smaller-than-full-
      // hedge lay stake is intentional, only the lay-wins branch changes.
      const ul_ls=lo>1&&bo>2?bs*(bo-2)/(lo-1):0;
      if(result==='Won'){
        const winProfit=bs;
        tx.pnl=winProfit;
        if(bk){bk.bal=(bk.bal||0)+(bo-1)*bs;bk.balUpdatedAt=Date.now();}
        if(exchange&&state.exchanges[exchange]!==undefined)
          state.exchanges[exchange]=(state.exchanges[exchange]||0)-ul_ls*(lo-1);
      }else{
        // Lost: lay wins — profit is the lay stake net of commission
        // (was flat ul_ls, ignoring commission entirely).
        tx.pnl=Math.round(ul_ls*(1-c)*100)/100;
        if(exchange&&state.exchanges[exchange]!==undefined)
          state.exchanges[exchange]=(state.exchanges[exchange]||0)+tx.pnl;
      }
    }
  }else{
    // LOCK-IN (standard matched bet) — the lay stake itself needs
    // adjusting so both outcomes are genuinely equal once commission is
    // real, otherwise the "lock" isn't actually balanced in real life.
    // Same derivation as the Quick Calculator (see calcQuick()).
    if(result==='Won'){
      if(isFB){
        const li_ls=(lo-c)>0?(bo-1)*bs/(lo-c):0;
        tx.pnl=Math.round(((bo-1)*bs-li_ls*(lo-1))*100)/100;
        if(bk)bk.bal=(bk.bal||0)+(bo-1)*bs; // back winnings to bookie
        if(exchange&&state.exchanges[exchange]!==undefined)
          state.exchanges[exchange]=(state.exchanges[exchange]||0)-li_ls*(lo-1);
      }else{
        const li_ls=(lo-c)>0?bs*bo/(lo-c):0;
        tx.pnl=Math.round((bs*(bo-1)-li_ls*(lo-1))*100)/100;
        if(bk){bk.bal=(bk.bal||0)+(bo*bs);bk.balUpdatedAt=Date.now();}
        if(exchange&&state.exchanges[exchange]!==undefined)
          state.exchanges[exchange]=(state.exchanges[exchange]||0)-li_ls*(lo-1);
      }
    }else{
      // Lost: lay wins — commission comes off that win. Previously used
      // the SAME formula as the Won branch (no commission-adjustment,
      // and no (1-c) applied to the winnings), which overstated P&L on
      // every commission-bearing bet that settled Lost.
      const li_ls=(lo-c)>0?(isFB?(bo-1)*bs/(lo-c):bs*bo/(lo-c)):0;
      const lockinProfit=(lo-c)>0?(isFB?li_ls*(1-c):li_ls*(1-c)-bs):(tx.expectedPnl||0);
      tx.pnl=Math.round(lockinProfit*100)/100;
      if(exchange&&state.exchanges[exchange]!==undefined)
        state.exchanges[exchange]=(state.exchanges[exchange]||0)+tx.pnl;
    }
  }
}

function applyBalanceAtLog(tx,p){
  if(tx.result==='Pending'){
    // Only deduct stake for normal bets — free bets don't use your money
    if(!isFreeBet(tx.type)&&tx.bookie&&p.bookies[tx.bookie]){
      p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(tx.bstake||0);
      p.bookies[tx.bookie].balUpdatedAt=Date.now();
    }
  }else{
    // Logged as already settled — for normal bets deduct stake first, then apply result
    if(!isFreeBet(tx.type)&&tx.result==='Lost'&&tx.bookie&&p.bookies[tx.bookie])
      p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(tx.bstake||0);
    applyBalanceOnSettle(tx,p,tx.result);
  }
}

function settleBet(acct,id,result){
  const p=state[acct];const tx=(p.transactions||[]).find(t=>t.id===id);if(!tx||tx.result!=='Pending')return;
  tx.result=result;tx.txUpdatedAt=Date.now();applyBalanceOnSettle(tx,p,result);
  // If this bet had a pre-settlement P&L override (edited via the Settle
  // tab before clicking Won/Lost — see confirmPnlEdit), apply it now as
  // the real final figure. This is a pure reporting correction — bookie
  // and exchange balances are derived purely from the back stake/odds
  // and lay odds actually entered, and stay exactly as the formula just
  // computed them; only the stored P&L figure itself changes.
  if(tx.pnlOverride!==undefined){
    tx.pnl=tx.pnlOverride;
    delete tx.pnlOverride;
  }
  // Immediately write to localStorage so refresh picks up settled state
  try{
    const snap={exchanges:state.exchanges,_deletedTxIds:deletedTxIds,_casinoDeletedIds:casinoDeletedIds};
    PROFILES.forEach(pr=>{snap[pr]={bank:state[pr].bank,bankUpdatedAt:state[pr].bankUpdatedAt||0,bookies:state[pr].bookies,transactions:state[pr].transactions,freeBets:state[pr].freeBets||[]};if(Array.isArray(state[pr].casino))snap[pr].casino=state[pr].casino;});
    localStorage.setItem('mbe_state',JSON.stringify(snap));
  }catch(e){}
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('settle');
  const card=document.getElementById('pcard-'+id);
  if(card){card.style.transition='opacity .25s,transform .25s';card.style.opacity='0';card.style.transform='translateY(-6px)';setTimeout(()=>{card.remove();updateBadge();},260);}
  showToast(`${result==='Won'?'Won':'Lost'} — ${fmtS(tx.pnl||0)}`,result==='Won'?'success':'error');
  // Smart update: only rebuild what changed
  setTimeout(function(){
    updateBadge();
    // If on dashboard, refresh just the P&L figures
    if(currentTab==='dashboard')render();
    // If on pending tab, check if any pending remain
    else if(currentTab==='pending'&&pendingAll().length===0){
      const mc=document.getElementById('main-content');
      if(mc)mc.innerHTML='<div style="text-align:center;padding:60px 20px"><i class="ti ti-circle-check" style="font-size:48px;color:#22C55E"></i><div style="font-size:15px;font-weight:500;margin-top:12px;color:var(--text-primary)">All settled</div></div>';
    }
  },300);
}

function editPnl(acct,id){
  const tx=state[acct].transactions.find(t=>t.id===id);if(!tx)return;
  // For a pending bet, tx.pnl is always 0 (nothing's settled) and isn't
  // even what's shown on the card — expectedPnl (or a prior override) is
  // the actual "current" figure to display and start editing from.
  const currentVal=tx.result==='Pending'?(tx.pnlOverride!==undefined?tx.pnlOverride:(tx.expectedPnl||0)):(tx.pnl||0);
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Edit P&L</div>
      <div class="modal-sub">${tx.event||tx.bookie||'Transaction'} · ${tx.date}</div>
      ${tx.result==='Pending'?`<div style="font-size:11px;color:var(--text-accent);background:rgba(34,197,94,0.1);border-radius:8px;padding:8px 10px;margin-bottom:12px">This bet hasn't settled yet — your figure will become the final P&L once you mark it Won or Lost.</div>`:''}
      <div style="margin-bottom:12px">
        <div class="form-label">${tx.result==='Pending'?'Current expected P&L':'Current P&L'}</div>
        <div style="font-size:24px;font-weight:500;color:${(currentVal)>=0?'#22C55E':'#F87171'}">${fmtS(currentVal)}</div>
      </div>
      <div style="margin-bottom:4px">
        <div class="form-label">New P&L (£)</div>
        <input type="number" id="modal-pnl" step="0.01" value="${currentVal.toFixed(2)}" inputmode="decimal" style="font-size:20px;font-weight:500;border-color:var(--text-accent);background:var(--bg-input)"/>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" style="flex:1" onclick="confirmPnlEdit('${acct}',${id})">Save</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('modal-pnl')?.focus(),50);
}

// Editing P&L is a pure reporting correction — bookie and exchange
// balances are derived entirely from the back stake/odds and lay odds
// actually entered, and are never touched by a P&L edit, whether it's
// made before settlement (an override, applied automatically once the
// bet is actually marked Won/Lost — see settleBet) or after (a direct
// correction to an already-settled bet's stored figure).
function confirmPnlEdit(acct,id){
  const newPnl=parseFloat(document.getElementById('modal-pnl')?.value);if(isNaN(newPnl))return;
  const p=state[acct];const tx=p.transactions.find(t=>t.id===id);if(!tx)return;
  if(tx.result==='Pending'){
    // Pre-settlement: store as an override to apply automatically once
    // the bet is actually marked Won/Lost — see settleBet(). Also update
    // expectedPnl so the pending card and the Dashboard's "Expected P&L"
    // total reflect the correction immediately, before settlement.
    tx.pnlOverride=newPnl;tx.expectedPnl=newPnl;tx.txUpdatedAt=Date.now();
    if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('editPnl');closeModal();showToast(`Will apply ${fmtS(newPnl)} once settled`);render();
    return;
  }
  tx.pnl=newPnl;tx.txUpdatedAt=Date.now();
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('editPnl');closeModal();showToast(`P&L updated to ${fmtS(newPnl)}`);render();
}

function closeModal(){document.getElementById('modal-root').innerHTML='';}

function autoCalcUnderlay(){
  const bs=parseFloat(document.getElementById('f-bstake')?.value)||0;
  const bo=parseFloat(document.getElementById('f-bodds')?.value)||0;
  const lo=parseFloat(document.getElementById('f-lodds')?.value)||0;
  const partial=Math.min(100,Math.max(1,parseFloat(document.getElementById('f-partial')?.value)||100))/100;
  const isFB=isFreeBet(selectedBetType);
  const isMBAL=selectedBetType==='MBAL';

  const calc=document.getElementById('underlay-calc');
  const pnlEl=document.getElementById('f-pnl');
  const winEl=document.getElementById('ul-win-display');
  const loseEl=document.getElementById('ul-lose-display');
  const stakeEl=document.getElementById('ul-liab-display');

  if(!bs||!bo||!lo){
    if(calc){
      calc.style.display=lo?'none':'block';
      if(!lo){
        if(winEl)winEl.textContent='—';
        if(loseEl)loseEl.textContent='—';
        if(stakeEl)stakeEl.textContent='Enter lay odds';
      }
    }
    return;
  }

  let total_win, total_lose, total_lay_stake;

  if(isMBAL){
    // Bonus lock-in: a bookie promo that pays a free bet ONLY if the
    // qualifying bet loses, nothing extra if it wins. The maths here
    // fold that bonus's retained value directly into the lay stake so
    // both outcomes are genuinely equal (lock-in) or the loss side nets
    // to exactly £0 (underlay) — verified against real worked examples,
    // zero commission assumed throughout (see Bonus Retention field).
    // Partial-underlay isn't supported in combination with a bonus —
    // this always treats it as a pure 100% lock-in or 100% underlay.
    const bonus=parseFloat(document.getElementById('f-mbal-bonus')?.value)||0;
    const retention=(parseFloat(document.getElementById('f-mbal-retention')?.value)||0)/100;
    if(!isUnderlay){
      total_lay_stake=(bs*bo-bonus*retention)/lo;
      total_win=bs*(bo-1)-total_lay_stake*(lo-1);
      total_lose=(total_lay_stake-bs)+bonus*retention;
    }else{
      total_lay_stake=bs-bonus*retention;
      total_win=bs*(bo-1)-total_lay_stake*(lo-1);
      total_lose=(total_lay_stake-bs)+bonus*retention; // always £0 by construction
    }
  }else if(!isUnderlay){
    // Lock-in: standard lay stake calculation
    if(!isFB){
      total_lay_stake=bs*bo/lo;
      total_win=total_lay_stake-bs;
      total_lose=total_lay_stake-bs;
    } else {
      // SNR free bet lock-in
      total_lay_stake=bs*(bo-1)/lo;
      total_win=total_lay_stake;
      total_lose=total_lay_stake;
    }
  } else {
    // Underlay portion
    const ul_bs=bs*partial;
    const li_bs=bs*(1-partial);

    let ul_win,ul_lose,ul_ls;
    if(!isFB){
      ul_ls=ul_bs; // lay stake = back stake for underlay
      ul_win=ul_bs*(bo-lo);
      ul_lose=0;
    } else {
      ul_ls=bo>2&&lo>1?ul_bs*(bo-2)/(lo-1):0;
      ul_win=ul_bs;
      ul_lose=ul_ls;
    }

    // Lock-in portion
    const li_ls=li_bs>0?(!isFB?li_bs*bo/lo:li_bs*(bo-1)/lo):0;
    const li_profit=li_ls-li_bs;

    total_win=ul_win+li_profit;
    total_lose=ul_lose+li_profit;
    total_lay_stake=ul_ls+li_ls;
  }

  if(winEl)winEl.textContent='£'+total_win.toFixed(2);
  if(loseEl){
    loseEl.textContent='£'+total_lose.toFixed(2);
    loseEl.style.color=total_lose>0?'#22C55E':'#9A9590';
  }
  if(stakeEl)stakeEl.textContent='£'+total_lay_stake.toFixed(2);
  if(calc)calc.style.display='block';
  // Update win/lose labels
  const winLbl=document.getElementById('ul-win-label');
  const loseLbl=document.getElementById('ul-lose-label');
  if(winLbl)winLbl.textContent=isUnderlay?'Underlay P&L if wins':'Lock-in profit';
  if(loseLbl)loseLbl.textContent=isUnderlay?'Underlay P&L if loses':'Lock-in profit';
  // Auto-fill P&L for both modes — field stays editable for manual override
  if(pnlEl&&!pnlEl.hasAttribute('data-manual'))pnlEl.value=total_win.toFixed(2);
}

function setStrategy(s){
  isUnderlay=(s==='underlay');
  const bu=document.getElementById('btn-underlay');
  const bl=document.getElementById('btn-lockin');
  if(bu){bu.className='btn '+(isUnderlay?'btn-primary':'btn-ghost');}
  if(bl){bl.className='btn '+(isUnderlay?'btn-ghost':'btn-primary');}
  // P&L field — readonly for underlay (formula is exact), editable for lock-in (allow override)
  const pnl=document.getElementById('f-pnl');
  if(pnl){
    if(isUnderlay){
      pnl.setAttribute('readonly','readonly');
      pnl.style.background=getCssVar('--bg-card2')||'#252630';
      pnl.style.color='#22C55E';
    } else {
      pnl.removeAttribute('readonly');
      pnl.style.background='';
      pnl.style.color='#22C55E';
    }
  }
  const hint=document.getElementById('pnl-label-hint');
  if(hint)hint.textContent='auto-calculated';
  autoCalcUnderlay();
}

}

function submitTx(){
  const msg=document.getElementById('form-msg');
  if(!selectedBetType){msg.textContent='Please select a transaction type.';return;}
  const isBookieT=BOOKIE_TRANSFER.includes(selectedBetType),isExchT=EXCHANGE_TRANSFER.includes(selectedBetType),isBet=BET_ONLY.includes(selectedBetType),isAmend=selectedBetType==='Balance Amendment';
  const date=document.getElementById('f-date').value||todayStr(),notes=document.getElementById('f-notes')?.value||'';
  if(isAmend){
    const target=document.getElementById('f-amend-target')?.value,newValStr=document.getElementById('f-amend-new')?.value,reason=document.getElementById('f-amend-reason')?.value||'Balance Amendment';
    if(!target){msg.textContent='Select what to amend.';return;}
    if(!newValStr){msg.textContent='Enter a new balance.';return;}
    const newVal=parseFloat(newValStr);if(isNaN(newVal))return;
    const p=state[formAccount];let oldVal,targetLabel;
    if(target==='bank'){oldVal=p.bank;p.bank=newVal;p.bankUpdatedAt=Date.now();targetLabel='Bank';}
    else{const name=target.slice(7);oldVal=(p.bookies||{})[name]?.bal||0;p.bookies[name].bal=newVal;targetLabel=name;}
    const diff=newVal-oldVal;if(!p.transactions)p.transactions=[];
    p.transactions.push({id:Date.now(),date,type:'Balance Amendment',target:targetLabel,oldVal,newVal,diff,pnl:diff,notes:reason,result:'—',_acct:formAccount,txUpdatedAt:Date.now()});
    if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('balanceAmend');showToast(`${targetLabel} → ${fmt(newVal)}`);msg.textContent='';resetForm();setTimeout(render,100);return;
  }
  const bookie=document.getElementById('f-bookie')?.value||(document.getElementById('f-bookie-search')?.value||''),exchange=document.getElementById('f-exchange')?.value,event=document.getElementById('f-event')?.value||'';
  const bstake=parseFloat(document.getElementById('f-bstake')?.value)||0,bodds=parseFloat(document.getElementById('f-bodds')?.value)||0,comm=parseFloat(document.getElementById('f-comm')?.value)||0;
  const result=document.getElementById('f-result')?.value||'Pending',pnl=parseFloat(document.getElementById('f-pnl')?.value)||0,amount=parseFloat(document.getElementById('f-amount')?.value)||0;
  if(isBookieT){
    if(!bookie){msg.textContent='Select a bookmaker.';return;}
    if(!amount){msg.textContent='Enter an amount.';return;}
    const p=state[formAccount];
    if(!p.bookies[bookie])p.bookies[bookie]={bal:0,status:'Active',notes:''};
    if(selectedBetType==='Deposit'){p.bookies[bookie].bal=(p.bookies[bookie].bal||0)+amount;p.bookies[bookie].balUpdatedAt=Date.now();p.bank-=amount;}
    else{p.bookies[bookie].bal=(p.bookies[bookie].bal||0)-amount;p.bookies[bookie].balUpdatedAt=Date.now();p.bank+=amount;}
    if(!p.transactions)p.transactions=[];
    p.transactions.push({id:Date.now(),date,type:selectedBetType,bookie,amount,pnl:0,notes,result:'—',_acct:formAccount,txUpdatedAt:Date.now()});
  }else if(isExchT){
    if(!exchange){msg.textContent='Select an exchange.';return;}
    if(!amount){msg.textContent='Enter an amount.';return;}
    const ba=state[exchTransferBank];
    if(selectedBetType==='Exchange Deposit'){state.exchanges[exchange]=(state.exchanges[exchange]||0)+amount;ba.bank-=amount;}
    else{state.exchanges[exchange]=(state.exchanges[exchange]||0)-amount;ba.bank+=amount;}
    if(!ba.transactions)ba.transactions=[];
    ba.transactions.push({id:Date.now(),date,type:selectedBetType,exchange,amount,pnl:0,notes,result:'—',_acct:exchTransferBank,txUpdatedAt:Date.now()});
  }else if(isBet){
    if(!bookie){msg.textContent='Select a bookmaker.';return;}
    if(!bstake||!bodds){msg.textContent='Enter back stake and odds.';return;}
    const p=state[formAccount];
    if(!p.bookies[bookie])p.bookies[bookie]={bal:0,status:'Active',notes:''};
    if(!p.transactions)p.transactions=[];
    // For pending bets, pnl=0 until settled. Store expected P&L separately for reference.
    const storedPnl=result==='Pending'?0:pnl;
    const lodds=parseFloat(document.getElementById('f-lodds')?.value)||0;
    const isMBAL=selectedBetType==='MBAL';
    const mbalBonus=isMBAL?(parseFloat(document.getElementById('f-mbal-bonus')?.value)||0):undefined;
    const mbalRetention=isMBAL?(parseFloat(document.getElementById('f-mbal-retention')?.value)||0):undefined;
    const tx={id:Date.now(),date,type:selectedBetType,bookie,exchange,event,bstake,bodds,lodds,comm,result,pnl:storedPnl,expectedPnl:pnl,notes,underlay:isUnderlay,_acct:formAccount,txUpdatedAt:Date.now(),mbalBonus,mbalRetention};
    // If this Free Bet was logged via "Log this free bet" from the Free
    // Bets panel, link it back to the MBAL bet it came from — this is
    // what lets the combined real total be shown once both settle, and
    // closes the loop by marking that panel entry Used automatically
    // rather than needing a separate manual step.
    if(_pendingMbalLink&&selectedBetType==='Free Bet'&&_pendingMbalLink.acct===formAccount){
      tx.linkedMbalId=_pendingMbalLink.mbalId;
      const fbEntry=(p.freeBets||[]).find(f=>String(f.id)===String(_pendingMbalLink.freeBetEntryId));
      if(fbEntry)fbEntry.status='Used';
      _pendingMbalLink=null;
    }
    p.transactions.push(tx);applyBalanceAtLog(tx,p);
    if(selectedBetType==='Qualifier'){
      if(!p.freeBets)p.freeBets=[];
      p.freeBets.push({id:Date.now()+Math.random(),date,bookie,acct:formAccount,status:'Pending'});
      showToast('Free bet added for '+bookie+' — check Dashboard','success');
    }
  }
  // Track recent bookies and last exchange

// Once both halves of an MBAL/linked-free-bet pair have settled, this
// computes their real combined total — shown as a small badge on both
// rows in History, rather than something you have to add up yourself.
function getMbalPairTotal(t){
  if(t.result==='Pending')return null;
  const txs=state[t._acct]?.transactions||[];
  let partner=null;
  if(t.type==='MBAL')partner=txs.find(o=>o.linkedMbalId===t.id);
  else if(t.linkedMbalId)partner=txs.find(o=>o.id===t.linkedMbalId);
  if(!partner||partner.result==='Pending')return null;
  return Math.round(((t.pnl||0)+(partner.pnl||0))*100)/100;
}

function deleteTx(acct,id){
  if(!confirm('Delete this transaction? Balances will be reversed.'))return;
  const tx=(state[acct].transactions||[]).find(t=>t.id===id);
  if(!tx){state[acct].transactions=state[acct].transactions.filter(t=>t.id!==id);if(!deletedTxIds[acct])deletedTxIds[acct]=[];deletedTxIds[acct].push(id);if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}saveData('quickDeleteTx');render();return;}
  const p=state[acct];
  const isFB=isFreeBet(tx.type);
  const bstake=tx.bstake||0,bodds=tx.bodds||0,pnl=tx.pnl||0;
  // Reverse the balance changes that were applied when this tx was logged/settled
  if(BET_ONLY.includes(tx.type)){
    if(tx.result==='Pending'){
      // Was deducted at log time — restore stake to bookie
      if(!isFB&&tx.bookie&&p.bookies[tx.bookie])
        p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+bstake;
    }else if(tx.result==='Won'){
      // Return was added — reverse it
      if(isFB){
        if(tx.bookie&&p.bookies[tx.bookie])
          p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-((bodds-1)*bstake);
      }else{
        if(tx.bookie&&p.bookies[tx.bookie])
          p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(bodds*bstake);
      }
    }else if(tx.result==='Lost'){
      // Stake was deducted, lay profit went to exchange — reverse exchange
      if(!isFB&&tx.bookie&&p.bookies[tx.bookie])
        p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+bstake;
      if(tx.exchange&&state.exchanges[tx.exchange]!==undefined)
        state.exchanges[tx.exchange]=(state.exchanges[tx.exchange]||0)-pnl;
    }
  }else if(tx.type==='Deposit'){
    // Reverse: bookie −deposit, bank +deposit
    if(tx.bookie&&p.bookies[tx.bookie])p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)-(tx.amount||0);
    p.bank+=(tx.amount||0);
  }else if(tx.type==='Withdrawal'){
    if(tx.bookie&&p.bookies[tx.bookie])p.bookies[tx.bookie].bal=(p.bookies[tx.bookie].bal||0)+(tx.amount||0);
    p.bank-=(tx.amount||0);
  }else if(tx.type==='Exchange Deposit'){
    if(tx.exchange&&state.exchanges[tx.exchange]!==undefined)state.exchanges[tx.exchange]=(state.exchanges[tx.exchange]||0)-(tx.amount||0);
    p.bank+=(tx.amount||0);
  }else if(tx.type==='Exchange Withdrawal'){
    if(tx.exchange&&state.exchanges[tx.exchange]!==undefined)state.exchanges[tx.exchange]=(state.exchanges[tx.exchange]||0)+(tx.amount||0);
    p.bank-=(tx.amount||0);
  }
  // Balance Amendment — reverse the diff
  else if(tx.type==='Balance Amendment'){
    const target=tx.target;
    if(target==='Bank'){p.bank-=(tx.diff||0);}
    else if(target&&p.bookies[target]){p.bookies[target].bal=(p.bookies[target].bal||0)-(tx.diff||0);}
  }
  state[acct].transactions=state[acct].transactions.filter(t=>t.id!==id);
  if(!deletedTxIds[acct])deletedTxIds[acct]=[];
  deletedTxIds[acct].push(id);
  // Write to localStorage immediately so refresh doesn't restore deleted tx
  try{
    const snap={exchanges:state.exchanges,_deletedTxIds:deletedTxIds,_casinoDeletedIds:casinoDeletedIds};
    PROFILES.forEach(pr=>{snap[pr]={bank:state[pr].bank,bankUpdatedAt:state[pr].bankUpdatedAt||0,bookies:state[pr].bookies,transactions:state[pr].transactions,freeBets:state[pr].freeBets||[]};if(Array.isArray(state[pr].casino))snap[pr].casino=state[pr].casino;});
    localStorage.setItem('mbe_state',JSON.stringify(snap));
  }catch(e){}
  if(syncTimeout){clearTimeout(syncTimeout);syncTimeout=null;}
  invalidateTxCache();saveData('deleteTx');showToast('Transaction deleted & balances reversed');
  // Smart update: remove just that row
  const row=document.querySelector(`tr[data-txid="${id}"]`)||document.getElementById('pcard-'+id);
  if(row){
    row.style.transition='opacity .2s';row.style.opacity='0';
    setTimeout(function(){row.remove();updateBadge();},200);
  }else{render();}
}
