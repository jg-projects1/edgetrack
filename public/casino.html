<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Casino — MBWorld"/>
<meta name="theme-color" content="#3A3D47"/>
<title>Casino — MBWorld</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,sans-serif;background:#343A40;min-height:100%;font-size:14px;color:#F0EDE8;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;min-height:100svh}
.topbar{background:#2C3136;border-bottom:0.5px solid rgba(255,255,255,0.09);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:17px;font-weight:500;color:#F0EDE8}.logo span{color:#22C55E}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:#C8C5BF;background:#3D4349;padding:4px 10px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.08)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#22C55E;flex-shrink:0}
.sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}
.sync-dot.error{background:#F87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tab-bar{background:#2C3136;border-top:0.5px solid rgba(255,255,255,0.09);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100}
.tab{flex:1;padding:5px 2px;cursor:pointer;font-size:9px;font-weight:500;color:#9A9590;border:none;background:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.tab i{font-size:20px;line-height:1}
.tab.active{color:#22C55E}
.tab-label{font-size:9px;font-weight:500;white-space:nowrap}
.content{flex:1;padding:14px 16px;padding-bottom:calc(72px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;width:100%}
.card{background:#2C3136;border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;overflow:hidden;margin-bottom:12px}
.card-header{padding:12px 16px;border-bottom:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;font-weight:500;color:#9A9590;letter-spacing:.3px;text-transform:uppercase}
.card-body{padding:14px 16px}
.metric-card{background:#3D4349;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:3px}
.metric-label{font-size:11px;color:#C8C5BF;font-weight:500;display:flex;align-items:center;gap:4px}
.metric-label i{font-size:14px}
.metric-value{font-size:26px;font-weight:500;letter-spacing:-1px;color:#F0EDE8;line-height:1.1}
.metric-value.pos{color:#22C55E}.metric-value.neg{color:#F87171}.metric-value.warn{color:#BA7517}
.metric-sub{font-size:11px;color:#9A9590}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid rgba(255,255,255,0.05)}
.list-row:last-child{border-bottom:none}
.list-row-left{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;margin-right:10px}
.list-row-title{font-size:13px;font-weight:500;color:#F0EDE8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.list-row-right{font-size:13px;font-weight:500;flex-shrink:0}
.list-row-right.pos{color:#22C55E}.list-row-right.neg{color:#F87171}
.pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;background:#3D4349;color:#C8C5BF;border:0.5px solid transparent}
.pill-jg{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.pill-hg{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.pill-bp{background:#5C3800;color:#F0A500;border-color:#854F0B}
.pill-rq{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.form-label{font-size:10px;font-weight:500;color:#9A9590;letter-spacing:.3px;text-transform:uppercase;display:block;margin-bottom:5px}
input[type=text],input[type=number],select{width:100%;background:#3D4349;border:0.5px solid rgba(255,255,255,0.10);border-radius:8px;padding:9px 11px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:#F0EDE8;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s}
input:focus,select:focus{border-color:rgba(255,255,255,0.25);background:#575A65}
select option{background:#3D4349}
.acct-selector{display:flex;gap:5px;flex-wrap:wrap}
.acct-sel-btn{flex:1;min-width:60px;padding:7px 5px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF;font-family:system-ui,-apple-system,sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.acct-sel-btn.active-jg{background:#7A4F00;color:#F5C842;border-color:#185FA5}
.acct-sel-btn.active-hg{background:#3C3489;color:#AFA9EC;border-color:#534AB7}
.acct-sel-btn.active-bp{background:#5C3800;color:#F0A500;border-color:#854F0B}
.acct-sel-btn.active-rq{background:#14532D;color:#86EFAC;border-color:#3B6D11}
.btn{padding:11px 20px;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:0.5px solid rgba(255,255,255,0.09);background:#3D4349;color:#F0EDE8;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:#22C55E;color:#fff;border-color:#22C55E}
.btn-full{width:100%;padding:13px}
.btn-ghost{background:#3D4349;color:#C8C5BF;border-color:rgba(255,255,255,0.09)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px;font-family:system-ui,-apple-system,sans-serif;font-weight:500;cursor:pointer;border:0.5px solid rgba(255,255,255,0.10);background:#3D4349;color:#C8C5BF}
.btn-sm-edit{background:#5C3800;color:#F0A500;border-color:#854F0B}
.btn-sm-danger{background:#791F1F;color:#F09595;border-color:#A32D2D}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:#2C3136;border-radius:16px 16px 0 0;border:0.5px solid rgba(255,255,255,0.10);padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));width:100%;max-width:500px}
@media(min-width:600px){.modal{border-radius:14px;padding:24px}}
.modal-handle{width:32px;height:3px;background:rgba(255,255,255,0.09);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:500;margin-bottom:4px;color:#F0EDE8}
.modal-sub{font-size:12px;color:#9A9590;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);background:#F0EDE8;border-radius:20px;padding:10px 18px;font-size:12px;font-weight:500;color:#42454F;z-index:999;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:12px;color:#9A9590;font-size:13px}
.spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,0.09);border-top-color:#22C55E;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:30px 20px;text-align:center;color:#9A9590;font-size:13px}
.pos{color:#22C55E;font-weight:500}.neg{color:#F87171;font-weight:500}
.month-wrap{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:4px 2px}
.month-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;min-width:40px}
.month-bar{width:32px;border-radius:3px 3px 0 0;min-height:2px}
.month-bar.pos{background:#22C55E}.month-bar.neg{background:#F87171;border-radius:0 0 3px 3px}
.month-lbl{font-size:9px;color:#9A9590;font-weight:500}
.month-val{font-size:9px;font-weight:500}
.month-val.pos{color:#22C55E}.month-val.neg{color:#F87171}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">MB<span>World</span> <span style="font-size:12px;color:#9A9590;font-weight:400">Casino</span></div>
    <div class="sync-badge"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">Loading</span></div>
  </div>
  <div class="content" id="main-content">
    <div class="loading"><div class="spinner"></div>Loading…</div>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="tab-log" onclick="switchTab('log')"><i class="ti ti-plus"></i><span class="tab-label">Log</span></button>
    <button class="tab" id="tab-history" onclick="switchTab('history')"><i class="ti ti-list"></i><span class="tab-label">History</span></button>
    <button class="tab" id="tab-summary" onclick="switchTab('summary')"><i class="ti ti-chart-bar"></i><span class="tab-label">Summary</span></button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
const PROFILES=['jg','hg','bp','rq'];
const PROFILE_LABELS={jg:'JG',hg:'HG',bp:'BP',rq:'RQ'};
const PROFILE_COLORS={jg:'#F0A500',hg:'#7F77DD',bp:'#BA7517',rq:'#639922'};
const CASINO_OFFER_TYPES=['Reload','Welcome','Free Spins','Cashback','Other'];

let currentTab='log';
let formAcct='jg';
let casinoPending=false;
let hasDeposit=false;
let operator='JG';
let syncTimeout=null;
let fullState={jg:{casino:[]},hg:{casino:[]},bp:{casino:[]},rq:{casino:[]}};
let deletedIds={jg:[],hg:[],bp:[],rq:[]};

function setSyncStatus(s){
  const dot=document.getElementById('sync-dot'),label=document.getElementById('sync-label');
  if(!dot||!label)return;
  dot.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  label.textContent=s==='syncing'?'Saving':s==='error'?'Offline':'Saved';
}

async function loadData(){
  try{
    const [casinoRes, sportsRes] = await Promise.all([
      fetch('/api/load-casino'),
      fetch('/api/load')
    ]);
    if(!casinoRes.ok)throw new Error('HTTP '+casinoRes.status);
    const casinoJson=await casinoRes.json();
    if(casinoJson.ok&&casinoJson.data){
      PROFILES.forEach(p=>{
        if(casinoJson.data[p]?.casino)fullState[p].casino=casinoJson.data[p].casino;
      });
    }
    // Load bookie list from sports data for the dropdown only
    if(sportsRes.ok){
      const sportsJson=await sportsRes.json();
      if(sportsJson.ok&&sportsJson.data){
        PROFILES.forEach(p=>{
          if(sportsJson.data[p]?.bookies)fullState[p].bookies=sportsJson.data[p].bookies;
        });
      }
    }
    setSyncStatus('synced');
  }catch(e){setSyncStatus('error');}
}

async function saveData(){
  setSyncStatus('syncing');
  try{
    // Save casino sessions only — never touches sports data
    const casinoState={};
    PROFILES.forEach(pr=>{casinoState[pr]={casino:fullState[pr]?.casino||[],deletedIds:deletedIds[pr]||[]};});
    const res=await fetch('/api/save-casino',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(casinoState)});
    if(!res.ok)throw new Error('Save failed');
    // Clear deletedIds after successful save since server has processed them
    PROFILES.forEach(pr=>{deletedIds[pr]=[];});
    setSyncStatus('synced');
  }catch(e){
    console.error('Casino save error:',e);
    setSyncStatus('error');
  }
}
function save(){if(syncTimeout)clearTimeout(syncTimeout);setSyncStatus('syncing');syncTimeout=setTimeout(saveData,1000);}

function fmt(v){const n=parseFloat(v)||0;return(n<0?'-':'')+'£'+Math.abs(n).toFixed(2);}
function fmtS(v){const n=parseFloat(v)||0;return(n>=0?'+':'-')+'£'+Math.abs(n).toFixed(2);}
function todayStr(){const d=new Date();return[String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),d.getFullYear()].join('/');}
function profileLabel(p){return PROFILE_LABELS[p]||p;}
function profileColor(p){return PROFILE_COLORS[p]||'#C8C5BF';}
function acctPill(a){return`<span class="pill pill-${a}">${profileLabel(a)}</span>`;}
function casinoPnl(p){
  return(fullState[p]?.casino||[]).reduce((a,s)=>{
    if(s.startBal!==undefined&&s.endBal!==undefined)return a+(s.endBal-s.startBal);
    return a+(s.netProfit||0);
  },0);
}
function allSessions(){return PROFILES.flatMap(p=>(fullState[p]?.casino||[]).map(s=>({...s,_acct:p}))).sort((a,b)=>b.id-a.id);}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

let suppressTabSwitchUntil=0;
function switchTab(t){
  // Guards against a ghost/synthetic tap landing on the tab bar right
  // after Save — see saveSession() for why this window exists.
  if(Date.now()<suppressTabSwitchUntil)return;
  currentTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t)?.classList.add('active');
  render();window.scrollTo(0,0);
}

function render(){
  const el=document.getElementById('main-content');
  if(currentTab==='log')el.innerHTML=renderLog();
  else if(currentTab==='history')el.innerHTML=renderHistory();
  else if(currentTab==='summary')el.innerHTML=renderSummary();
}

function renderLog(){
  return`
  <div class="card"><div class="card-header"><span class="card-title">Log casino session</span></div>
  <div class="card-body" style="padding-bottom:80px">
    <div style="margin-bottom:12px">
      <div class="form-label">Account</div>
      <div class="acct-selector">${PROFILES.map(pr=>`<button class="acct-sel-btn ${formAcct===pr?'active-'+pr:''}" onclick="formAcct='${pr}';render()">${profileLabel(pr)}</button>`).join('')}</div>
    </div>
    <div style="margin-bottom:10px">
      <div class="form-label">Operator</div>
      <div style="display:flex;gap:6px">
        <button onclick="operator='JG';render()" style="flex:1;padding:9px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.09);background:${operator==='JG'?'#7A4F00':'#4E5260'};color:${operator==='JG'?'#F5C842':'#C8C5BF'};font-family:system-ui;font-size:13px;font-weight:500;cursor:pointer">JG</button>
        <button onclick="operator='JP';render()" style="flex:1;padding:9px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.09);background:${operator==='JP'?'#14532D':'#4E5260'};color:${operator==='JP'?'#86EFAC':'#C8C5BF'};font-family:system-ui;font-size:13px;font-weight:500;cursor:pointer">JP</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:120px 1fr;gap:8px;margin-bottom:8px">
      <div><div class="form-label">Date</div><input type="text" id="c-date" value="${todayStr()}" style="font-size:12px;padding:7px 9px"/></div>
      <div><div class="form-label">Casino / Bookie</div>
        <div style="position:relative">
          <input type="text" id="c-casino-search" placeholder="Search…" autocomplete="off" oninput="filterBookies(this.value)" onfocus="showBookies()"/>
          <input type="hidden" id="c-casino" value=""/>
          <div id="c-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:#3D4349;border:0.5px solid rgba(255,255,255,0.10);border-radius:8px;margin-top:3px;max-height:180px;overflow-y:auto"></div>
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <div><div class="form-label">Starting Balance (£)</div><input type="number" id="c-start-bal" placeholder="0.00" step="0.01" inputmode="decimal" oninput="updateNet()"/></div>
      <div><div class="form-label">Ending Balance (£)</div><input type="number" id="c-end-bal" placeholder="0.00" step="0.01" inputmode="decimal" oninput="updateNet()"/></div>
    </div>
    <div style="background:#3D4349;border-radius:8px;padding:12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:#C8C5BF">P&L (Ending − Starting)</span>
        <span id="c-net" style="font-size:20px;font-weight:500;color:#22C55E">£0.00</span>
      </div>
      
    </div>
    <div><div class="form-label">Notes </div><input type="text" id="c-notes" placeholder="optional"/></div>
    <div id="c-msg" style="font-size:12px;color:#F87171;margin-top:6px;text-align:center"></div>
  </div></div>
  <div style="position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));left:0;right:0;padding:10px 16px;background:#343A40;border-top:0.5px solid rgba(255,255,255,0.08);display:flex;gap:8px;z-index:90;max-width:680px;margin:0 auto">
    <button class="btn btn-ghost" onclick="resetForm()" style="width:72px;flex-shrink:0">Clear</button>
    <button class="btn btn-primary btn-full" onclick="saveSession()"><i class="ti ti-check"></i> Save session</button>
  </div>`;
}


function updatePendingBtns(){
  const yes=document.getElementById('c-btn-yes'),no=document.getElementById('c-btn-no');
  if(yes){yes.style.background=casinoPending?'#5C3800':'#4E5260';yes.style.color=casinoPending?'#F0A500':'#C8C5BF';}
  if(no){no.style.background=!casinoPending?'#14532D':'#4E5260';no.style.color=!casinoPending?'#86EFAC':'#C8C5BF';}
}

function updateNet(){
  const startBal=parseFloat(document.getElementById('c-start-bal')?.value)||0;
  const endBal=parseFloat(document.getElementById('c-end-bal')?.value)||0;
  const net=endBal-startBal;
  const el=document.getElementById('c-net');
  if(el){el.textContent=(net>=0?'+£':'−£')+Math.abs(net).toFixed(2);el.style.color=net>=0?'#22C55E':'#F87171';}
}
function showBookies(){
  const dd=document.getElementById('c-dropdown');if(!dd)return;
  const q=document.getElementById('c-casino-search')?.value||'';
  const list=Object.keys(fullState[formAcct]?.bookies||{}).sort();
  const filtered=q?list.filter(b=>b.toLowerCase().includes(q.toLowerCase())):list;
  renderBookieItems(filtered);dd.style.display='block';
  setTimeout(()=>document.addEventListener('click',closeDropdown,{once:true}),10);
}
function closeDropdown(e){
  const dd=document.getElementById('c-dropdown'),inp=document.getElementById('c-casino-search');
  if(dd&&!dd.contains(e.target)&&e.target!==inp)dd.style.display='none';
  else if(dd&&dd.style.display!=='none')document.addEventListener('click',closeDropdown,{once:true});
}
function filterBookies(q){
  const dd=document.getElementById('c-dropdown');if(!dd)return;
  const list=Object.keys(fullState[formAcct]?.bookies||{}).sort();
  const filtered=q?list.filter(b=>b.toLowerCase().includes(q.toLowerCase())):list;
  renderBookieItems(filtered);dd.style.display='block';
  document.getElementById('c-casino').value='';
}
function renderBookieItems(items){
  const dd=document.getElementById('c-dropdown');if(!dd)return;
  if(!items.length){dd.innerHTML='<div style="padding:10px 12px;font-size:12px;color:#9A9590">No results</div>';return;}
  dd.innerHTML=items.slice(0,20).map(b=>`<div onclick="selectBookie('${b.replace(/'/g,"\\'")}') " style="padding:10px 12px;font-size:13px;color:#F0EDE8;cursor:pointer;border-bottom:0.5px solid rgba(255,255,255,0.05)" onmouseenter="this.style.background='#575A65'" onmouseleave="this.style.background=''">${b}</div>`).join('');
}
function selectBookie(name){
  const inp=document.getElementById('c-casino-search');if(inp)inp.value=name;
  const bh=document.getElementById('c-casino');if(bh)bh.value=name;
  const dd=document.getElementById('c-dropdown');if(dd)dd.style.display='none';
}

function saveSession(){
  // Blur any focused input right away so keyboard dismissal is tied
  // predictably to this tap, not left to fire ambiguously afterward —
  // that ambiguity is the likely source of the ghost-tap-onto-tab-bar
  // issue on standalone/homescreen iOS apps.
  document.activeElement?.blur?.();
  suppressTabSwitchUntil=Date.now()+600;
  const msg=document.getElementById('c-msg');
  const casino=document.getElementById('c-casino')?.value||(document.getElementById('c-casino-search')?.value?.trim()||'');
  if(!casino){if(msg)msg.textContent='Select a casino / bookie.';return;}
  const startBal=parseFloat(document.getElementById('c-start-bal')?.value)||0;
  const endBal=parseFloat(document.getElementById('c-end-bal')?.value)||0;
  const net=endBal-startBal;
  const p=fullState[formAcct];
  if(!p.casino)p.casino=[];
  p.casino.push({
    id:Date.now(),
    date:document.getElementById('c-date')?.value||todayStr(),
    casino,operator,
    startBal,endBal,netProfit:net,
    notes:document.getElementById('c-notes')?.value||'',
    _acct:formAcct,
  });
  // Saves immediately rather than through the debounced save() — same
  // reasoning as deleteSession: a homescreen-installed app can be
  // suspended by iOS the moment it's backgrounded (very likely right
  // after logging a session and switching away), and a debounced save
  // that never fires means the session silently never reaches the
  // server at all.
  if(syncTimeout)clearTimeout(syncTimeout);
  setSyncStatus('syncing');
  saveData();
  showToast('Session saved!');resetForm();
  // Explicit final guard: stay on Log regardless of what else fires.
  currentTab='log';
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-log')?.classList.add('active');
}

function resetForm(){
  ['c-casino','c-casino-search','c-start-bal','c-end-bal','c-notes'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const d=document.getElementById('c-date');if(d)d.value=todayStr();
  const dd=document.getElementById('c-dropdown');if(dd)dd.style.display='none';
  const net=document.getElementById('c-net');if(net){net.textContent='£0.00';net.style.color='#22C55E';}
}
function renderHistory(){
  const sessions=allSessions();
  if(!sessions.length)return`<div class="empty">No casino sessions yet</div>`;
  const rows=sessions.map(s=>{
    const hasBalances=s.startBal!==undefined&&s.endBal!==undefined;
    return`<tr>
      <td style="padding:10px 12px;font-size:12px;color:#C8C5BF;white-space:nowrap">${s.date}</td>
      <td style="padding:10px 12px;white-space:nowrap"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${profileColor(s._acct)};margin-right:5px"></span><span style="font-size:12px;color:#F0EDE8">${profileLabel(s._acct)}</span></td>
      <td style="padding:10px 12px;font-size:12px;color:${s.operator==='JP'?'#86EFAC':'#F5C842'};font-weight:600">${s.operator||'JG'}</td>
      <td style="padding:10px 12px;font-size:12px;color:#F0EDE8;white-space:nowrap">${s.casino}</td>
      <td style="padding:10px 12px;font-size:12px;color:#C8C5BF;text-align:right;white-space:nowrap">${hasBalances?fmt(s.startBal):'—'}</td>
      <td style="padding:10px 12px;font-size:12px;color:#C8C5BF;text-align:right;white-space:nowrap">${hasBalances?fmt(s.endBal):'—'}</td>
      <td style="padding:10px 12px;font-size:12px;font-weight:500;text-align:right;white-space:nowrap" class="${s.netProfit>=0?'pos':'neg'}">${fmtS(s.netProfit)}</td>
      <td style="padding:10px 12px;text-align:center"><button class="btn-sm btn-sm-danger" onclick="deleteSession('${s._acct}',${s.id})" style="padding:3px 7px"><i class="ti ti-trash"></i></button></td>
    </tr>`;
  }).join('');
  return`<div class="card"><div class="card-header"><span class="card-title">All sessions</span><span style="font-size:11px;color:#9A9590">${sessions.length} total</span></div>
  <div style="overflow-x:auto">
  <table style="width:100%;border-collapse:collapse;min-width:640px">
    <thead><tr style="border-bottom:0.5px solid rgba(255,255,255,0.09)">
      <th style="padding:8px 12px;text-align:left;font-size:10px;font-weight:500;color:#9A9590;text-transform:uppercase;letter-spacing:.3px">Date</th>
      <th style="padding:8px 12px;text-align:left;font-size:10px;font-weight:500;color:#9A9590;text-transform:uppercase;letter-spacing:.3px">Acct</th>
      <th style="padding:8px 12px;text-align:left;font-size:10px;font-weight:500;color:#9A9590;text-transform:uppercase;letter-spacing:.3px">Op</th>
      <th style="padding:8px 12px;text-align:left;font-size:10px;font-weight:500;color:#9A9590;text-transform:uppercase;letter-spacing:.3px">Casino</th>
      <th style="padding:8px 12px;text-align:right;font-size:10px;font-weight:500;color:#9A9590;text-transform:uppercase;letter-spacing:.3px">Start (£)</th>
      <th style="padding:8px 12px;text-align:right;font-size:10px;font-weight:500;color:#9A9590;text-transform:uppercase;letter-spacing:.3px">End (£)</th>
      <th style="padding:8px 12px;text-align:right;font-size:10px;font-weight:500;color:#9A9590;text-transform:uppercase;letter-spacing:.3px">P&L (£)</th>
      <th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  </div></div>`;
}

function addBonus(acct,id){
  const session=(fullState[acct]?.casino||[]).find(s=>s.id===id);if(!session)return;
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Add bonus win</div>
      <div class="modal-sub">${session.casino} · ${session.date}</div>
      <div style="margin-bottom:12px"><div class="form-label">Bonus win (£)</div>
        <input type="number" id="modal-bonus" step="0.01" placeholder="0.00" inputmode="decimal" style="font-size:20px;font-weight:500;border-color:#22C55E;background:#0d1f19"/>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" style="flex:1" onclick="confirmBonus('${acct}',${id})">Save</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('modal-bonus')?.focus(),50);
}

function confirmBonus(acct,id){
  const win=parseFloat(document.getElementById('modal-bonus')?.value)||0;
  const session=(fullState[acct]?.casino||[]).find(s=>s.id===id);if(!session)return;
  session.bonusWin=(session.bonusWin||0)+win;
  session.netProfit=session.wagerPnl+session.bonusWin;
  session.pending=false;
  const p=fullState[acct];
  if(session.casino&&p.bookies?.[session.casino])
    p.bookies[session.casino].bal=(p.bookies[session.casino].bal||0)+win;
  save();closeModal();showToast('Bonus win added!');render();
}

function deleteSession(acct,id){
  if(!confirm('Delete session?'))return;
  fullState[acct].casino=(fullState[acct].casino||[]).filter(s=>s.id!==id);
  if(!deletedIds[acct])deletedIds[acct]=[];
  deletedIds[acct].push(id);
  render();
  // Deletes save immediately rather than going through the debounced
  // save() — a homescreen-installed app can be suspended by iOS the
  // instant it's backgrounded, and if that happens before a debounce
  // timer fires, the delete never reaches the server and silently
  // reappears next time the app opens. Saving right away closes that gap.
  if(syncTimeout)clearTimeout(syncTimeout);
  setSyncStatus('syncing');
  saveData();
}

function closeModal(){document.getElementById('modal-root').innerHTML='';}

function renderSummary(){
  const sessions=allSessions();
  const total=PROFILES.reduce((a,p)=>a+casinoPnl(p),0);

  // P&L per session (handle both old and new format)
  const sessionPnl=s=>s.startBal!==undefined?s.endBal-s.startBal:s.netProfit||0;

  const jgPnl=sessions.filter(s=>s.operator==='JG').reduce((a,s)=>a+sessionPnl(s),0);
  const jpPnl=sessions.filter(s=>s.operator==='JP').reduce((a,s)=>a+sessionPnl(s),0);

  // Monthly by operator
  const monthly={};
  sessions.forEach(s=>{
    const pts=s.date?.split('/');if(!pts||pts.length<3)return;
    const k=pts[2]+'-'+pts[1];
    if(!monthly[k])monthly[k]={JG:0,JP:0};
    monthly[k][s.operator||'JG']+=sessionPnl(s);
  });
  const months=Object.keys(monthly).sort();

  // By casino
  const byCasino={};
  sessions.forEach(s=>{
    if(!s.casino)return;
    byCasino[s.casino]=(byCasino[s.casino]||0)+sessionPnl(s);
  });
  const topCasinos=Object.entries(byCasino).sort((a,b)=>b[1]-a[1]);

  const monthRows=months.map(k=>{
    const mo=monthly[k];
    const total=mo.JG+mo.JP;
    const yr=k.slice(0,4),mn=k.slice(5);
    const lbl=new Date(+yr,+mn-1).toLocaleString('default',{month:'short'})+' '+yr;
    return`<div class="list-row">
      <div class="list-row-left"><div class="list-row-title">${lbl}</div></div>
      <div style="display:flex;gap:12px;align-items:center">
        <span style="font-size:11px;color:#F5C842">JG: <span style="color:${mo.JG>=0?'#22C55E':'#F87171'}">${fmtS(mo.JG)}</span></span>
        <span style="font-size:11px;color:#86EFAC">JP: <span style="color:${mo.JP>=0?'#22C55E':'#F87171'}">${fmtS(mo.JP)}</span></span>
        <span class="list-row-right ${total>=0?'pos':'neg'}">${fmtS(total)}</span>
      </div>
    </div>`;
  }).join('');

  return`
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
    <div class="metric-card" style="grid-column:span 2">
      <div class="metric-label"><i class="ti ti-cards"></i>Total casino P&L</div>
      <div class="metric-value ${total>=0?'pos':'neg'}">${fmtS(total)}</div>
      <div class="metric-sub" style="display:flex;gap:10px;flex-wrap:wrap">
        ${PROFILES.map(p=>`<span>${profileLabel(p)}: <span style="color:${casinoPnl(p)>=0?'#22C55E':'#F87171'}">${fmtS(casinoPnl(p))}</span></span>`).join('')}
      </div>
      <div style="margin-top:6px;padding-top:6px;border-top:0.5px solid rgba(255,255,255,0.08);display:flex;gap:10px">
        <span style="font-size:11px">JG: <span style="color:${jgPnl>=0?'#22C55E':'#F87171'};font-weight:500">${fmtS(jgPnl)}</span></span>
        <span style="font-size:11px">JP: <span style="color:${jpPnl>=0?'#22C55E':'#F87171'};font-weight:500">${fmtS(jpPnl)}</span></span>
      </div>
    </div>
  </div>
  ${months.length?`<div class="card" style="margin-bottom:10px">
    <div class="card-header"><span class="card-title">Monthly P&L by Operator</span></div>
    ${monthRows}
  </div>`:''}
  ${topCasinos.length?`<div class="card" style="margin-bottom:10px">
    <div class="card-header"><span class="card-title">By Casino — Highest Wins</span></div>
    ${topCasinos.map(([name,pnl])=>`<div class="list-row"><div class="list-row-left"><div class="list-row-title">${name}</div></div><div class="list-row-right ${pnl>=0?'pos':'neg'}">${fmtS(pnl)}</div></div>`).join('')}
  </div>`:''}
  <div class="card">
    <div class="card-header"><span class="card-title">By Account</span></div>
    ${PROFILES.map(p=>{const pnl=casinoPnl(p);return`<div class="list-row"><div class="list-row-left"><div class="list-row-title" style="display:flex;align-items:center;gap:8px"><div style="width:7px;height:7px;border-radius:50%;background:${profileColor(p)}"></div>${profileLabel(p)}</div></div><div class="list-row-right ${pnl>=0?'pos':'neg'}">${fmtS(pnl)}</div></div>`;}).join('')}
  </div>`;
}


async function init(){
  try{
    await loadData();
  }catch(e){
    console.error('loadData failed:',e);
  }
  render();
}
init();
</script>
</body>
</html>
